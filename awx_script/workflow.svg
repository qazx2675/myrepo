<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2000" viewBox="0 0 1100 2000" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4f63"/></marker>
    <style>
      .auto  { fill: #e7f0ff; stroke: #3a63c8; stroke-width: 1.6; }
      .input { fill: #fff1dc; stroke: #e08600; stroke-width: 2; }
      .stop  { fill: #ffe5e5; stroke: #d03030; stroke-width: 1.6; }
      .done  { fill: #e3f6e8; stroke: #2f9e57; stroke-width: 2; }
      .inner { fill: #ffffff; stroke: #3a63c8; stroke-width: 1.4; }
      .band  { fill: #eef0f5; }
      .note  { fill: #fbfbfb; stroke: #9aa0ad; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .ln    { stroke: #4a4f63; stroke-width: 1.7; fill: none; marker-end: url(#ah); }
      .lnd   { stroke: #4a4f63; stroke-width: 1.5; fill: none; marker-end: url(#ah); stroke-dasharray: 6 4; }
      .tie   { stroke: #9aa0ad; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .ti    { font-size: 24px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .sub   { font-size: 14px; fill: #4a4f63; text-anchor: middle; }
      .bt    { font-size: 16px; font-weight: bold; fill: #1d2140; }
      .h     { font-size: 15.5px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .b     { font-size: 13.5px; fill: #2b2f45; text-anchor: middle; }
      .s     { font-size: 11.5px; fill: #7a7f8f; text-anchor: middle; }
      .lb    { font-size: 13px; font-weight: bold; fill: #b04a00; text-anchor: middle; }
      .lg    { font-size: 13px; fill: #2b2f45; }
      .nl    { font-size: 12.5px; fill: #4a4f63; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1100" height="2000" fill="#ffffff"/>

  <!-- 제목 · 범례 -->
  <text class="ti" x="550" y="42">AWX 노드정보 등록 — 한눈에 보는 흐름</text>
  <text class="sub" x="550" y="68">위에서 아래로 진행합니다. 주황색(⌨) 상자는 작업자가 직접 입력·선택하는 곳이고, 나머지는 스크립트가 자동으로 처리합니다.</text>
  <rect class="auto"  x="235" y="86" width="26" height="18" rx="4"/><text class="lg" x="268" y="100">자동 처리</text>
  <rect class="input" x="365" y="86" width="26" height="18" rx="4"/><text class="lg" x="398" y="100">⌨ 작업자 입력·선택</text>
  <rect class="stop"  x="545" y="86" width="26" height="18" rx="4"/><text class="lg" x="578" y="100">중단 · 종료</text>
  <rect class="done"  x="680" y="86" width="26" height="18" rx="4"/><text class="lg" x="713" y="100">완료</text>
  <rect class="note"  x="775" y="86" width="26" height="18" rx="4"/><text class="lg" x="808" y="100">보충 설명</text>

  <!-- ===================== 1단계 ===================== -->
  <rect class="band" x="20" y="124" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="147">1단계 · 준비 — 등록할 서버 목록 만들기</text>
  <text class="nl" x="1064" y="146" style="text-anchor:end">01.AWX_nodeinfo_V2.sh</text>

  <!-- 작업 시작 -->
  <rect class="auto" x="270" y="176" width="560" height="62" rx="10"/>
  <text class="h" x="550" y="197">작업 시작 : bash 01.AWX_nodeinfo_V2.sh</text>
  <text class="b" x="550" y="216">작업자(user)를 고르면 그 사람의 &lt;user&gt;.txt 로 진행하고, 화면 내용을 로그로 남김</text>
  <text class="s" x="550" y="230">[1] user · LOG/&lt;user&gt;.log</text>
  <path class="ln" d="M830 207 H866"/>
  <rect class="stop" x="866" y="187" width="214" height="40" rx="8"/>
  <text class="b" x="973" y="212">user 값이 없으면 → 중단</text>
  <path class="ln" d="M550 238 V262"/>

  <!-- nodeinfo 사용 여부 -->
  <rect class="input" x="270" y="262" width="560" height="58" rx="10"/>
  <text class="h" x="550" y="287">⌨ AWX 에서 서버 정보를 가져올까요?</text>
  <text class="b" x="550" y="308">화면 질문 : awx nodeinfo 사용여부 Y|N   <tspan class="s">[2] download_txt</tspan></text>
  <path class="ln" d="M420 320 V350"/><text class="lb" x="404" y="341">Y</text>
  <path class="ln" d="M680 320 V350"/><text class="lb" x="696" y="341">N</text>
  <rect class="auto" x="60" y="350" width="440" height="78" rx="10"/>
  <text class="h" x="280" y="374">Y : AWX 에서 자동 조회</text>
  <text class="b" x="280" y="395">&lt;user&gt;.txt 에 호스트명만 한 줄에 하나씩 적어 두면</text>
  <text class="b" x="280" y="414">조회 결과(서버당 12칸 정보)로 파일을 자동으로 채움</text>
  <rect class="auto" x="600" y="350" width="440" height="78" rx="10"/>
  <text class="h" x="820" y="374">N : 미리 준비한 파일을 그대로 사용</text>
  <text class="b" x="820" y="395">&lt;user&gt;.txt 에 서버당 12칸 정보를 직접 적어 둠</text>
  <text class="s" x="820" y="414">vendor model infra hostname ip mac nic disk part 용량 os boot</text>
  <path class="ln" d="M280 428 V448 H550 V466"/>
  <path class="ln" d="M820 428 V448 H550" style="marker-end:none"/>

  <!-- 자동 정리 -->
  <rect class="auto" x="270" y="466" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="487">자동 정리 · 형식 검사</text>
  <text class="b" x="550" y="506">값 치환(1.1T→1200 등) · 줄마다 12칸인지 검사</text>
  <text class="b" x="550" y="523">infra 이름 치환 · MAC 끝자리가 홀수면 짝수로 보정</text>
  <text class="s" x="550" y="536">[3] parse_msg · [3-1] apply_infra_alias · [4] fix_mac</text>
  <path class="ln" d="M830 505 H866"/>
  <rect class="stop" x="866" y="485" width="214" height="40" rx="8"/>
  <text class="b" x="973" y="510">12칸이 아닌 줄 → 중단</text>
  <path class="ln" d="M550 544 V568"/>

  <!-- DNS 확인 -->
  <rect class="input" x="270" y="568" width="560" height="80" rx="10"/>
  <text class="h" x="550" y="589">DNS 확인 (다를 때만 ⌨ 질문)</text>
  <text class="b" x="550" y="608">파일에 적힌 IP 와 DNS 에 등록된 IP 를 비교</text>
  <text class="b" x="550" y="626">다르면 : a 모두 DNS 값으로 · n 그대로 · s 하나씩 확인 · q 중단</text>
  <text class="s" x="550" y="640">[4-1] dns_check</text>
  <path class="ln" d="M550 648 V672"/>

  <!-- 대상 목록 -->
  <rect class="auto" x="270" y="672" width="560" height="50" rx="10"/>
  <text class="h" x="550" y="694">등록할 서버 목록을 화면에 보여 줌 (총 N대)</text>
  <text class="s" x="550" y="712">[5] show_targets</text>
  <path class="ln" d="M550 722 V746"/>

  <!-- 작업진행 -->
  <rect class="input" x="270" y="746" width="560" height="50" rx="10"/>
  <text class="h" x="550" y="776">⌨ 작업진행여부 (Y|N) — 목록을 확인하고 결정</text>
  <path class="ln" d="M830 771 H866"/><text class="lb" x="848" y="763">N</text>
  <rect class="stop" x="866" y="751" width="214" height="40" rx="8"/>
  <text class="b" x="973" y="776">아무것도 바꾸지 않고 종료</text>

  <!-- ===================== 2단계 ===================== -->
  <rect class="band" x="20" y="814" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="837">2단계 · 점검 — 인벤토리를 만들고 서버 상태 확인</text>
  <text class="nl" x="1064" y="836" style="text-anchor:end">01.AWX_nodeinfo_V2.sh</text>
  <path class="ln" d="M550 796 V866"/><text class="lb" x="566" y="808">Y</text>

  <!-- 인벤토리 만들기 -->
  <rect class="auto" x="270" y="866" width="560" height="100" rx="10"/>
  <text class="h" x="550" y="887">인벤토리 만들기 (자동)</text>
  <text class="b" x="550" y="907">필수 설정값 확인 → 기존 인벤토리 삭제</text>
  <text class="b" x="550" y="925">조건이 같은 서버끼리 그룹으로 나눠 그룹별 yml + 전체(_all) yml 생성</text>
  <text class="b" x="550" y="943">dhcp_pool 기록 → git 업로드</text>
  <text class="s" x="550" y="957">[7]~[11] inventory_delete · split_files · dhcp_info · gen_inventory · git_upload</text>
  <path class="ln" d="M830 893 H866"/>
  <rect class="stop" x="866" y="873" width="214" height="40" rx="8"/>
  <text class="b" x="973" y="898">설정값이 비어 있으면 → 중단</text>
  <path class="tie" d="M270 916 H252"/>
  <rect class="note" x="20" y="872" width="232" height="88" rx="8"/>
  <text class="nl" x="136" y="896">그룹 나누는 기준</text>
  <text class="nl" x="136" y="916">infra · nic · disk · 용량</text>
  <text class="nl" x="136" y="934">os · boot · splunk 가</text>
  <text class="nl" x="136" y="952">모두 같은 서버끼리 yml 1개</text>
  <path class="ln" d="M550 966 V990"/>

  <!-- 서버 상태 점검 -->
  <rect class="auto" x="270" y="990" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1011">서버 상태 점검 (자동, 결과만 화면에 표시)</text>
  <text class="b" x="550" y="1030">LDAP 주소 · LACP(본딩) 서버 · 응답 없는 서버</text>
  <text class="b" x="550" y="1047">os8_mgmt 에서 접속이 안 되는 서버는 os6_mgmt 에서 한 번 더 확인</text>
  <text class="s" x="550" y="1060">[12] check_servers</text>
  <path class="ln" d="M550 1068 V1092"/>

  <!-- 메뉴 -->
  <rect class="input" x="270" y="1092" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1116">⌨ 메뉴 : AWX 인벤토리 소스</text>
  <text class="b" x="550" y="1136">ls = 만든 yml 목록 보기 · 파일명 입력 = 그 yml 내용 보기</text>
  <text class="b" x="550" y="1155">exit = 종료 · su = 등록 시작   <tspan class="s">[13]</tspan></text>
  <path class="lnd" d="M270 1146 H236 V1116 H268"/>
  <text class="nl" x="180" y="1124">ls · 파일명은</text>
  <text class="nl" x="180" y="1142">몇 번이든 반복</text>
  <path class="ln" d="M830 1131 H866"/><text class="lb" x="848" y="1123">exit</text>
  <rect class="stop" x="866" y="1111" width="214" height="40" rx="8"/>
  <text class="b" x="973" y="1136">등록 없이 종료</text>

  <!-- ===================== 3단계 ===================== -->
  <rect class="band" x="20" y="1188" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1211">3단계 · 등록 — AWX 에 소스 · DHCP · PXE 등록</text>
  <text class="nl" x="1064" y="1210" style="text-anchor:end">su 를 입력하면 02.source_dhcp_pxe.sh 가 자동 실행</text>
  <path class="ln" d="M550 1170 V1240"/><text class="lb" x="568" y="1183">su</text>

  <!-- OS 선택 -->
  <rect class="input" x="270" y="1240" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1264">⌨ OS 버전 선택</text>
  <text class="b" x="550" y="1284">1 = 기본값(2026-ECAD_TCAD)을 모든 yml 에 한 번에 적용</text>
  <text class="b" x="550" y="1303">2 = yml 마다 직접 선택 (2024 · 2025 · 2026 · 2026-OPC_MDP · 2026-ECAD_TCAD)</text>
  <path class="ln" d="M550 1318 V1342"/>

  <!-- 옵션 확인 -->
  <rect class="input" x="270" y="1342" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1366">⌨ 옵션 확인표 → 옵션이 맞습니까 (Y|N)</text>
  <text class="b" x="550" y="1386">표 : 번호 | yml | infra | os | boot | splunk | 호스트 수</text>
  <text class="b" x="550" y="1405">Y = 그대로 진행 · N = yml 마다 값을 다시 입력 (Enter = 현재 값 유지)</text>
  <path class="ln" d="M550 1420 V1444"/>

  <!-- yml 별 등록 -->
  <rect class="auto" x="270" y="1444" width="560" height="176" rx="10"/>
  <text class="h" x="550" y="1468">yml 하나씩 차례로 자동 등록</text>
  <rect class="inner" x="390" y="1482" width="320" height="36" rx="8"/>
  <text class="b" x="550" y="1505">① AWX 인벤토리 소스 등록 (invsync)</text>
  <path class="ln" d="M500 1518 L430 1548"/>
  <path class="ln" d="M600 1518 L670 1548"/>
  <text class="lb" x="550" y="1542">동시 실행</text>
  <rect class="inner" x="320" y="1548" width="220" height="36" rx="8"/>
  <text class="b" x="430" y="1571">② DHCP 등록</text>
  <rect class="inner" x="560" y="1548" width="220" height="36" rx="8"/>
  <text class="b" x="670" y="1571">② PXE 등록</text>
  <text class="b" x="550" y="1606">둘 다 끝나야 다음 yml 로 넘어감 · 실패한 yml 은 건너뛰고 계속</text>
  <path class="lnd" d="M830 1600 H860 V1462 H832"/>
  <text class="nl" x="955" y="1520">다음 yml 이 남아 있으면</text>
  <text class="nl" x="955" y="1538">① 부터 반복</text>
  <path class="ln" d="M550 1620 V1644"/>

  <!-- 결과 정리 -->
  <rect class="auto" x="270" y="1644" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1668">모든 yml 이 끝나면 결과 정리</text>
  <text class="b" x="550" y="1688">yml 이 2개 이상이고 모두 성공 → 전체 yml 로 인벤토리 소스 한 번 더 갱신</text>
  <text class="b" x="550" y="1707">성공·실패 요약 · 최종 수량(HPC/SDS · infra · OS 별) · 파티션 표준 확인</text>
  <path class="ln" d="M550 1722 V1746"/>

  <!-- 실패 시 재시도 -->
  <rect class="input" x="270" y="1746" width="560" height="50" rx="10"/>
  <text class="h" x="550" y="1776">실패한 yml 이 있으면 ⌨ 재시도 (Y|N)</text>
  <path class="ln" d="M830 1771 H866"/><text class="lb" x="848" y="1763">N</text>
  <rect class="stop" x="866" y="1751" width="214" height="40" rx="8"/>
  <text class="b" x="973" y="1776">중단 (실패로 종료)</text>
  <path class="lnd" d="M270 1771 H236 V1279 H268"/>
  <text class="nl" x="168" y="1520">Y : 3단계를</text>
  <text class="nl" x="168" y="1538">처음부터 다시</text>

  <!-- ===================== 4단계 ===================== -->
  <rect class="band" x="20" y="1814" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1837">4단계 · 마무리</text>
  <path class="ln" d="M550 1796 V1866"/><text class="lb" x="584" y="1808">모두 성공</text>

  <rect class="input" x="270" y="1866" width="560" height="62" rx="10"/>
  <text class="h" x="550" y="1887">⌨ 등록 후 확인 : 작업 대상 서버 목록을 붙여넣기</text>
  <text class="b" x="550" y="1906">모두 등록됐는지 비교해서 알려 줌 (빈 줄만 입력하면 건너뜀)</text>
  <text class="s" x="550" y="1919">[14-1] 작업 기록을 auto_setup 으로 전달 · [15] verify_hosts</text>
  <path class="ln" d="M550 1928 V1946"/>
  <rect class="done" x="450" y="1946" width="200" height="36" rx="18"/>
  <text class="h" x="550" y="1970">완료</text>
  <text class="s" x="1080" y="1992" style="text-anchor:end">※ 설정이 실제로 바뀌는 작업이므로, 완료 후 임의의 서버 몇 대를 직접 확인하세요.</text>
</svg>
