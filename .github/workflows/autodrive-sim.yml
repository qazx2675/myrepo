name: autodrive-sim CI
on:
  push:
    paths: [".claude/기타/개인프로젝트/자율주행-도로시뮬레이터/**", ".github/workflows/autodrive-sim.yml"]
  pull_request:
    paths: [".claude/기타/개인프로젝트/자율주행-도로시뮬레이터/**", ".github/workflows/autodrive-sim.yml"]
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ".claude/기타/개인프로젝트/자율주행-도로시뮬레이터"
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --no-index --find-links wheels -r requirements.txt
      - run: pip install pyflakes pytest
      - run: python -m pyflakes .
      - run: python -m pytest tests -q
      - run: python main.py --headless --seconds 300 --level hard
