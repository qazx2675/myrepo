# master 용: .claude/VM/V2 변경 시 실행된다. (V2 브랜치용은 .claude/VM/V2/.github/workflows/ci.yml)
name: vm-v2 CI

on:
  push:
    paths:
      - '.claude/VM/V2/**'
      - '.github/workflows/vm-v2.yml'
  pull_request:
    paths:
      - '.claude/VM/V2/**'
      - '.github/workflows/vm-v2.yml'

jobs:
  vm-param-check:
    name: vm-param-check (빌드·정적분석·테스트)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/VM/V2/vm-param-check-usability-improvement/vm-param-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - name: 오프라인 빌드 (govendor 링크)
        run: GOPROXY=off bash setup.sh
      - run: GOPROXY=off go vet -mod=vendor ./...
      - run: GOPROXY=off go test -mod=vendor ./...

  vmsetup:
    name: VMsetup 도구 (빌드·정적분석·테스트)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/VM/V2/VMsetup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - name: 도구별 오프라인 빌드 + vet
        run: |
          set -e
          export GOPROXY=off
          for d in *-source; do
            echo "== $d"
            (cd "$d" && bash setup.sh && go vet -mod=vendor ./...)
          done
      - name: nic_assign 단위 테스트
        run: cd nic_assign-source && GOPROXY=off go test -mod=vendor ./...
      - name: bash 문법 검사
        run: bash -n vm_setup.sh
