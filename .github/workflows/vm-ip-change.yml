# master 용: .claude/VM/vCenter API IP 자동변경 변경 시 실행된다.
name: vm-ip-change CI

on:
  push:
    paths:
      - '.claude/VM/vCenter API IP 자동변경/**'
      - '.github/workflows/vm-ip-change.yml'
  pull_request:
    paths:
      - '.claude/VM/vCenter API IP 자동변경/**'
      - '.github/workflows/vm-ip-change.yml'

jobs:
  vm-ip-change:
    name: vm-ip-change (빌드·정적분석·테스트·가짜 vCenter 시험)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ".claude/VM/vCenter API IP 자동변경/project"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: ".claude/VM/vCenter API IP 자동변경/project/go.mod" }
      - name: 오프라인 빌드 (vendor)
        run: GOPROXY=off bash setup.sh
      - run: GOPROXY=off go vet -mod=vendor ./...
      - run: GOPROXY=off go test -mod=vendor ./...
      - name: 가짜 vCenter 로 끝까지 실행해 결과 검증
        run: GOPROXY=off bash e2e-test.sh
