name: stress-test CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt 필요:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          (cd test/fake_awx && go vet ./...)

      - name: go test
        run: go test ./...

      - name: Bash syntax check
        run: |
          for f in *.sh test/*.sh test/fake_user/*.sh test/fake_repo/*.sh test/fake_repo/.git_upload.sh; do bash -n "$f"; done

      - name: ShellCheck lint
        run: |
          shellcheck -S warning stress_run.sh build.sh
