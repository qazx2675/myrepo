name: CI

on:
  push:
    branches: [ sop, master, main ]
  pull_request:
    branches: [ sop, master, main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build with vendor
        run: go build -mod=vendor -ldflags="-H windowsgui -s -w" -o sop-generator.exe .

      - name: Vet with vendor
        run: go vet -mod=vendor ./...
