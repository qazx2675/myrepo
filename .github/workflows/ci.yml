name: CI

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      - name: Go build
        run: CGO_ENABLED=0 go build -o bin/account-mount-engine ./cmd/account-mount-engine
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test -v ./...
      - name: Bash syntax check
        run: bash -n setup.sh run.sh internal/render/lib_common.sh internal/render/apply_body.sh internal/render/rollback_body.sh
