name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build & test
        shell: cmd
        run: build-windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: datacenter-viewer
          path: datacenter-viewer.exe
