# stress-test 설정 파일 샘플
# 실제 사용 시 conf/${user}_setting.conf 로 복사해 값을 채우세요.
# 예: 사용자 식별자가 hong 이면 conf/hong_setting.conf
# 탐색 순서: -conf 지정 경로 → ./conf → ~/.stress-test → <바이너리 위치>/conf
# 형식: key = value, '#' 이후는 주석 (값 안에 '#' 은 쓸 수 없음)

# ── AWX 접속 ─────────────────────────────────────────
awx_url        = http://10.20.30.40
username       = admin
password       = changeme
insecure_tls   = true          # https 인증서 검증 생략 여부 (true/false)

# ── gossh ────────────────────────────────────────────
gossh          =               # gossh 경로(폴더 또는 파일). 비우면 환경변수 GOSSH(stress_run.sh) → PATH 순

# ── 인벤토리 등록 (AWX 01 스크립트 방식) ───────────────
# yaml 생성 → scp <yaml> <repohost>:<repo_dir>/
#   → ssh <repohost> "bash <repo_dir>/custom_inventory.sh <repo_dir>/<yaml>"
#   → <svr_dir> 에 새로 생긴 *.yml 1개 확인
#   → (git_dir 이 있으면) yml 을 git_dir 로 복사 후 그 안에서 bash .git_upload.sh <user> <yml>
#   → 인벤토리 소스 갱신(invsync)
repohost       = repohost      # custom_inventory.sh 가 있는 서버 (ssh/scp 대상, 비밀번호 없이 접속돼야 함)
repo_dir       = /root/Inventory   # repohost 의 yaml 업로드·custom_inventory.sh 폴더
svr_dir        = /root/svr     # 이 서버(실행 위치)에서 보이는, 새 yml 이 생기는 폴더
git_dir        = /root/user/${user}/myrepo   # 01 의 git_upload 폴더 (${user} 는 사용자로 치환). 비우면 git 업로드 생략

# 인벤토리 소스 ID. 채우면 그 소스를 고정으로 사용, 비우면 inventory 의 첫 번째 소스(ID 가장 작은 것)
inventory_source =
inventory        = 3           # 인벤토리 ID (inventory_source 가 비어 있을 때 소스 탐색에 사용)
source_field     = source_path # yml 이름을 저장할 인벤토리 소스 필드명

# ── 템플릿 ───────────────────────────────────────────
# <tmpl>_template     : job template ID 또는 이름
# <tmpl>_hostname_key : hostname 목록(줄바꿈으로 이은 텍스트)을 넘길 survey 변수명
# <tmpl>_extra_vars   : 다른 필수 survey 항목 "key=value, key2=value2" (선택)
# cpu 단계(a): Intel 묶음 → AMD 묶음 순으로 실행. 대상이 있는 벤더의 템플릿만 필요
cpu_intel_template     = cpu-intel
cpu_intel_hostname_key = target_hosts
cpu_intel_extra_vars   =
cpu_amd_template       = cpu-amd
cpu_amd_hostname_key   = target_hosts
cpu_amd_extra_vars     =
# stress 단계(b): 전체 대상 한 묶음
stress_template        = stress-ng
stress_hostname_key    = target_hosts
stress_extra_vars      =

# ── 감시 ─────────────────────────────────────────────
monitor_sec      = 120         # job 완료 후 최대 감시 시간(초)
monitor_interval = 10          # 1분 로드 확인 간격(초)
load_threshold   = 3           # 1분 로드가 이 값 이상이면 부하 실행으로 판정

# ── 공통 ─────────────────────────────────────────────
output_dir     = ./output      # 결과(${user}_stress_result.txt)·gossh 로그 저장 폴더
poll_interval  = 3             # AWX job/동기화 상태 조회 간격(초)
history_file   = ./stress-test_history.log   # 실행 이력 파일
