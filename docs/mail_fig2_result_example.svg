<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="'Malgun Gothic','Pretendard',sans-serif">
<rect width="720" height="230" fill="#ffffff" stroke="#cbd5e1" rx="6"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">결과 화면 예시</text>
<rect x="20" y="42" width="330" height="170" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="6"/>
<rect x="20" y="42" width="330" height="30" fill="#16a34a" rx="6"/><rect x="20" y="62" width="330" height="10" fill="#16a34a"/>
<text x="36" y="62" font-size="13" font-weight="700" fill="#fff">[MATCH] 전수 일치</text>
<g font-size="11" fill="#166534"><text x="36" y="94">상세목록현황 30대 = 인시던트 30대 = 작업대상 30대</text>
<text x="36" y="114">AWX 1000대 중 6대 제외됨 (필수 서버 자동 차감)</text>
<text x="36" y="144" font-weight="700">안내: 인시던트의 작업대상을 복사해 붙여넣기 권장</text>
<text x="36" y="162" font-family="Consolas,monospace">vim [작업대상] → esc → :set paste → 붙여넣기</text>
<text x="36" y="192" fill="#15803d">[펼치기] 클릭 시 정제된 작업대상 명단 표시</text></g>
<rect x="370" y="42" width="330" height="170" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="6"/>
<rect x="370" y="42" width="330" height="30" fill="#dc2626" rx="6"/><rect x="370" y="62" width="330" height="10" fill="#dc2626"/>
<text x="386" y="62" font-size="13" font-weight="700" fill="#fff">[MISMATCH] 불일치 감지</text>
<g font-size="11" fill="#991b1b"><text x="386" y="94">인시던트에만 있음: 1대   <tspan font-family="Consolas,monospace">web-prd-031</tspan></text>
<text x="386" y="114">상세목록현황에만 있음: 1대   <tspan font-family="Consolas,monospace">web-prd-13</tspan></text>
<text x="386" y="134">AWX 대상에 없음: 970대   [명단 펼치기]</text>
<text x="386" y="164" font-weight="700">안내: 작업대상을 다시 확인하고 일치시킨 후</text>
<text x="386" y="182" font-weight="700">작업을 진행하시기 바랍니다.</text></g>
</svg>