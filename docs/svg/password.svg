<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2370" viewBox="0 0 1100 2370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4f63"/></marker>
    <style>
      .auto  { fill: #e7f0ff; stroke: #3a63c8; stroke-width: 1.6; }
      .input { fill: #fff1dc; stroke: #e08600; stroke-width: 2; }
      .stop  { fill: #ffe5e5; stroke: #d03030; stroke-width: 1.6; }
      .done  { fill: #e3f6e8; stroke: #2f9e57; stroke-width: 2; }
      .link  { fill: #f1ebff; stroke: #7650c8; stroke-width: 2; }
      .band  { fill: #eef0f5; }
      .note  { fill: #fbfbfb; stroke: #9aa0ad; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .ln    { stroke: #4a4f63; stroke-width: 1.7; fill: none; marker-end: url(#ah); }
      .lnd   { stroke: #4a4f63; stroke-width: 1.5; fill: none; marker-end: url(#ah); stroke-dasharray: 6 4; }
      .tie   { stroke: #9aa0ad; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .ti    { font-size: 24px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .sub   { font-size: 14px; fill: #4a4f63; text-anchor: middle; }
      .bt    { font-size: 16px; font-weight: bold; fill: #1d2140; }
      .h     { font-size: 15.5px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .b     { font-size: 13.5px; fill: #2b2f45; text-anchor: middle; }
      .s     { font-size: 11.5px; fill: #7a7f8f; text-anchor: middle; }
      .lb    { font-size: 13px; font-weight: bold; fill: #b04a00; text-anchor: middle; }
      .lg    { font-size: 13px; fill: #2b2f45; }
      .nl    { font-size: 12.5px; fill: #4a4f63; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1100" height="2370" fill="#ffffff"/>

  <!-- 제목 · 범례 -->
  <text class="ti" x="550" y="42">pwreset — 한눈에 보는 흐름 (pwreset-standalone)</text>
  <text class="sub" x="550" y="68">SSH 접속 시 비밀번호 변경 프롬프트가 뜨는 서버에 과거 비밀번호 후보를 차례로 넣어 새 비밀번호로 바꾸고 재접속까지 검증합니다. 주황색(⌨)은 작업자가 직접 하는 곳입니다.</text>
  <rect class="auto"  x="170" y="86" width="26" height="18" rx="4"/><text class="lg" x="203" y="100">자동 처리</text>
  <rect class="input" x="285" y="86" width="26" height="18" rx="4"/><text class="lg" x="318" y="100">⌨ 작업자 입력·실행</text>
  <rect class="stop"  x="465" y="86" width="26" height="18" rx="4"/><text class="lg" x="498" y="100">중단 · 주의</text>
  <rect class="done"  x="590" y="86" width="26" height="18" rx="4"/><text class="lg" x="623" y="100">완료</text>
  <rect class="note"  x="675" y="86" width="26" height="18" rx="4"/><text class="lg" x="708" y="100">보충 설명</text>
  <rect class="link"  x="795" y="86" width="26" height="18" rx="4"/><text class="lg" x="828" y="100">암호화 · 보안</text>

  <!-- ===================== 0단계 ===================== -->
  <rect class="band" x="20" y="124" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="147">0단계 · 준비 — 새 비밀번호 암호화 저장과 입력 파일 준비</text>
  <text class="nl" x="1064" y="146" style="text-anchor:end">cmd/pwreset/cryptutil.go (-pass)</text>

  <rect class="link" x="270" y="176" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="198">사전 암호화 : 새 비밀번호를 AES-256-GCM 으로 분리 저장</text>
  <text class="b" x="550" y="218">새 비밀번호를 평문으로 두지 않고 대칭키(key.bin)와 암호문(newpass.enc)으로 보관</text>
  <text class="s" x="550" y="238">./bin/pwreset -pass → key.bin (32B 난수 키 · 권한 0600) + newpass.enc (Nonce + Ciphertext)</text>
  <path class="tie" d="M270 215 H252"/>
  <rect class="note" x="20" y="172" width="232" height="86" rx="8"/>
  <text class="nl" x="136" y="194">필수 준비 파일 4종</text>
  <text class="nl" x="136" y="214">list.txt : 대상 IP · 호스트명</text>
  <text class="nl" x="136" y="232">old_password.txt : 과거 후보들</text>
  <text class="nl" x="136" y="250">newpass.enc · key.bin : 암호문·키</text>
  <path class="tie" d="M830 215 H848"/>
  <rect class="note" x="848" y="186" width="232" height="58" rx="8"/>
  <text class="nl" x="964" y="210">key.bin 이 이미 있으면 재사용</text>
  <text class="nl" x="964" y="230">없으면 crypto/rand 로 새로 생성</text>
  <path class="ln" d="M550 254 V324"/>

  <!-- ===================== 1단계 ===================== -->
  <rect class="band" x="20" y="272" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="295">1단계 · 로드 — 입력 파일 검증 · 복호화 · 대상 서버 병렬 분배</text>
  <text class="nl" x="1064" y="294" style="text-anchor:end">run.sh · main.go · targets.go</text>

  <rect class="auto" x="270" y="324" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="346">필수 파일 점검 및 새 비밀번호 메모리 복호화 (runReset)</text>
  <text class="b" x="550" y="366">run.sh 가 필수 파일 존재를 확인한 뒤, main.go 가 key.bin 으로 newpass.enc 복호화</text>
  <text class="s" x="550" y="386">loadKey("key.bin") → decrypt(newpass.enc) — 복호화된 새 비밀번호는 메모리에만 유지</text>
  <path class="ln" d="M550 402 V426"/>

  <rect class="auto" x="270" y="426" width="560" height="96" rx="10"/>
  <text class="h" x="550" y="448">대상 서버 · 과거 비밀번호 후보 · SSH 개인키 로드</text>
  <text class="b" x="550" y="468">list.txt 는 공백·빈 줄·주석(#)을 제거해 읽고, IP 와 도메인(Hostname) 모두 허용</text>
  <text class="b" x="550" y="487">old_password.txt 는 위쪽(최신 후보, 0번)부터 순서대로 읽되 비밀번호 내 공백은 보존</text>
  <text class="s" x="550" y="508">-i 옵션 지정 시 해당 SSH 개인키(loadSigners) 로드 · 미지정 시 ~/.ssh 기본 키 탐색</text>
  <path class="tie" d="M270 474 H252"/>
  <rect class="note" x="20" y="430" width="232" height="88" rx="8"/>
  <text class="nl" x="136" y="452">비밀번호 안에 공백이</text>
  <text class="nl" x="136" y="470">포함될 수 있으므로</text>
  <text class="nl" x="136" y="488">TrimSpace 대신 줄바꿈(\r)만</text>
  <text class="nl" x="136" y="506">제거해 원문 그대로 시도</text>
  <path class="ln" d="M550 522 V546"/>

  <rect class="auto" x="270" y="546" width="560" height="62" rx="10"/>
  <text class="h" x="550" y="568">대상 서버별 독립 고루틴(Goroutine) 동시 실행</text>
  <text class="b" x="550" y="588">서버마다 processHost 고루틴을 띄워 병렬 처리하고 sync.WaitGroup 으로 완료 대기</text>
  <text class="s" x="550" y="602">results[idx] 슬라이스에 서버 원래 순서 그대로 결과를 기록 (경합 없음)</text>
  <path class="tie" d="M830 577 H848"/>
  <rect class="note" x="848" y="548" width="232" height="58" rx="8"/>
  <text class="nl" x="964" y="572">특정 서버가 응답 지연·타임아웃</text>
  <text class="nl" x="964" y="590">이어도 다른 서버는 즉시 진행</text>
  <path class="ln" d="M550 608 V684"/>

  <!-- ===================== 2단계 ===================== -->
  <rect class="band" x="20" y="632" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="655">2단계 · 접속 — 후보 비밀번호 순차 대입과 2단계 SSH 세션 연결</text>
  <text class="nl" x="1064" y="654" style="text-anchor:end">sshclient.go (dial 8초 · read 8초 · 세션 30초)</text>

  <rect class="auto" x="270" y="684" width="560" height="96" rx="10"/>
  <text class="h" x="550" y="706">후보 비밀번호 0번부터 차례대로 SSH 접속 시도 (tryCandidate)</text>
  <text class="b" x="550" y="726">SSH 개인키 인증을 먼저 시도하고, Keyboard-Interactive · 후보 비밀번호 인증을 차례로 수행</text>
  <text class="b" x="550" y="745">1차 경로 : 인증 단계(Keyboard-Interactive 콜백)에서 프롬프트가 뜨면 즉시 응답</text>
  <text class="s" x="550" y="766">2차 경로 : 로그인 성공 후 아직 변경 전이면 가상 터미널(xterm 80×40) Shell 세션 시작</text>
  <path class="tie" d="M830 732 H848"/>
  <rect class="note" x="848" y="694" width="232" height="76" rx="8"/>
  <text class="nl" x="964" y="716">PasswordAuthentication no</text>
  <text class="nl" x="964" y="734">환경이어도 SSH 키로 접속 후</text>
  <text class="nl" x="964" y="752">PTY 셸에서 비밀번호 변경 가능</text>
  <path class="ln" d="M550 780 V804"/>

  <rect class="auto" x="270" y="804" width="560" height="80" rx="10"/>
  <text class="h" x="550" y="826">CONNECTED ? — SSH 인증(키 또는 후보 비밀번호)으로 연결됐나</text>
  <text class="b" x="550" y="847">연결 성공 시 connected = true 기록 (한 번이라도 연결되면 everConnected = true)</text>
  <text class="b" x="550" y="866">인증 중 또는 PTY 셸 스트림에서 나오는 출력 텍스트를 상태 머신(promptFSM)으로 전달</text>
  <path class="lnd" d="M270 844 H236 V732 H268"/>
  <text class="nl" x="180" y="780">아니오 :</text>
  <text class="nl" x="180" y="798">다음 후보 시도</text>
  <path class="ln" d="M830 844 H866"/>
  <rect class="stop" x="866" y="815" width="214" height="58" rx="8"/>
  <text class="b" x="973" y="839">8초 내 연결 불가·모든 후보 실패</text>
  <text class="b" x="973" y="858">→ '접속불가' 또는 '미적용'</text>
  <path class="tie" d="M830 874 H840 V928 H848"/>
  <rect class="note" x="848" y="886" width="232" height="86" rx="8"/>
  <text class="nl" x="964" y="908">한 번도 연결 못 했으면</text>
  <text class="nl" x="964" y="926">'접속불가' (네트워크·인증 실패)</text>
  <text class="nl" x="964" y="944">연결은 됐으나 변경 못 했으면</text>
  <text class="nl" x="964" y="962">'미적용'으로 구분해 기록</text>
  <path class="ln" d="M550 884 V1046"/><text class="lb" x="566" y="906">예</text>

  <!-- ===================== 3단계 ===================== -->
  <rect class="band" x="20" y="994" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1017">3단계 · 변경 — 프롬프트 상태 머신(promptFSM) 자동 응답</text>
  <text class="nl" x="1064" y="1016" style="text-anchor:end">promptfsm.go (정규식 감지 · 4단계 상태 전이)</text>

  <rect class="auto" x="270" y="1046" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1068">상태 0 (WaitCurrentOrNew) : 현재 비밀번호 프롬프트 감지</text>
  <text class="b" x="550" y="1088">(?i)current.*password 감지 시 현재 시도 중인 후보 비밀번호(cand) 전송 → 상태 1 로</text>
  <text class="b" x="550" y="1107">현재 비밀번호 질문 없이 바로 (?i)new.*password 가 뜨면 새 비밀번호 전송 → 상태 2 로</text>
  <path class="tie" d="M830 1085 H848"/>
  <rect class="note" x="848" y="1056" width="232" height="58" rx="8"/>
  <text class="nl" x="964" y="1080">접속 직후 바로 셸($ # &gt;)만 뜨면</text>
  <text class="nl" x="964" y="1098">만료 아님 → connected-but-not-applied</text>
  <path class="ln" d="M550 1124 V1148"/>

  <rect class="auto" x="270" y="1148" width="560" height="96" rx="10"/>
  <text class="h" x="550" y="1170">상태 1 (WaitNew) → 상태 2 (WaitRetype) : 새 비밀번호 입력 및 재입력</text>
  <text class="b" x="550" y="1190">상태 1 에서 (?i)new.*password 프롬프트 감지 → 복호화된 새 비밀번호(newPass) 전송</text>
  <text class="b" x="550" y="1209">상태 2 에서 (?i)(retype|re-?enter|again) 감지 → 새 비밀번호 한 번 더 전송 후 상태 3 으로</text>
  <text class="s" x="550" y="1230">PTY 셸 모드에서는 청크 내 연속 프롬프트도 feed() 루프로 빠짐없이 처리하고 \n 과 함께 전송</text>
  <path class="tie" d="M270 1196 H252"/>
  <rect class="note" x="20" y="1153" width="232" height="86" rx="8"/>
  <text class="nl" x="136" y="1175">Rocky Linux · RHEL · Ubuntu 등</text>
  <text class="nl" x="136" y="1193">배포판마다 조금씩 다른</text>
  <text class="nl" x="136" y="1211">PAM 프롬프트 문구를</text>
  <text class="nl" x="136" y="1229">대소문자 무시 정규식으로 통합</text>
  <path class="ln" d="M550 1244 V1268"/>

  <rect class="auto" x="270" y="1268" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1290">상태 3 (DoneOrClosed) : 비밀번호 토큰 업데이트 완료 판정</text>
  <text class="b" x="550" y="1310">(?i)all authentication tokens updated 문구 또는 정상 셸 프롬프트($ # &gt;) 감지</text>
  <text class="s" x="550" y="1330">감지 성공 시 fsm.success = true 로 표시 (셸 세션 종료까지 대기 후 검증 단계로 진행)</text>
  <path class="tie" d="M830 1307 H848"/>
  <rect class="note" x="848" y="1288" width="232" height="40" rx="8"/>
  <text class="nl" x="964" y="1313">틀린 후보면 다음 후보로 재시도</text>
  <path class="ln" d="M550 1346 V1422"/>

  <!-- ===================== 4단계 ===================== -->
  <rect class="band" x="20" y="1370" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1393">4단계 · 결과 — 새 비밀번호 재접속 검증과 CSV 리포트 저장</text>
  <text class="nl" x="1064" y="1392" style="text-anchor:end">sshclient.go · report.go → result.csv</text>

  <rect class="auto" x="270" y="1422" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1444">새 비밀번호로 실제 SSH 재접속 검증 (verifyLogin)</text>
  <text class="b" x="550" y="1464">변경 완료 후 기존 세션을 닫고, 새 비밀번호(newPass)로 다시 SSH 로그인을 시도해 검증</text>
  <text class="s" x="550" y="1484">재접속 성공 → verified · 실패해도 성공 문구를 봤으면 → updated-confirmed (둘 다 applied=true)</text>
  <path class="ln" d="M550 1500 V1524"/>

  <rect class="auto" x="270" y="1524" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1546">서버별 결과 확정 : 성공 시 남은 후보 비밀번호 순회 즉시 종료</text>
  <text class="b" x="550" y="1566">새 비밀번호 적용이 확인되면(applied = true) 나머지 후보 비밀번호는 더 시도하지 않음</text>
  <text class="b" x="550" y="1585">일치한 과거 비밀번호의 순번(0부터 시작, 미적용·접속불가는 -1)을 함께 기록</text>
  <path class="tie" d="M270 1563 H252"/>
  <rect class="note" x="20" y="1522" width="232" height="82" rx="8"/>
  <text class="nl" x="136" y="1544">변경 성공 문구만 떴어도</text>
  <text class="nl" x="136" y="1562">(재접속 검증 실패와 무관하게)</text>
  <text class="nl" x="136" y="1580">applied=true 로 확정</text>
  <text class="nl" x="136" y="1596">(detail=updated-confirmed)</text>
  <path class="ln" d="M550 1602 V1626"/>

  <rect class="done" x="410" y="1626" width="280" height="38" rx="19"/>
  <text class="h" x="550" y="1651">모두 완료 → result.csv 저장</text>
  <path class="tie" d="M690 1645 H848"/>
  <rect class="note" x="848" y="1616" width="232" height="58" rx="8"/>
  <text class="nl" x="964" y="1640">ip, found_password_index,</text>
  <text class="nl" x="964" y="1658">status, applied_new_password, detail</text>

  <!-- ===================== 참고: 서버별 결과 3분류 ===================== -->
  <rect class="band" x="20" y="1692" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1715">참고 · 서버별 최종 결과(result.csv)는 이렇게 3가지로 끝납니다</text>
  <text class="nl" x="1064" y="1714" style="text-anchor:end">status · applied_new_password · detail</text>

  <rect class="done" x="20" y="1744" width="340" height="100" rx="10"/>
  <text class="h" x="190" y="1768">성공 (applied = true)</text>
  <text class="b" x="190" y="1790">과거 비밀번호 일치 → 새 비밀번호 변경</text>
  <text class="b" x="190" y="1810">새 비밀번호로 실제 재접속 검증까지 완료</text>
  <text class="s" x="190" y="1832">found_password_index ≥ 0 · detail = verified/updated-confirmed</text>

  <rect class="done" x="380" y="1744" width="340" height="100" rx="10"/>
  <text class="h" x="550" y="1768">미적용 (연결은 됐으나 변경 안 됨)</text>
  <text class="b" x="550" y="1790">이미 정상이라 변경 프롬프트가 없거나</text>
  <text class="b" x="550" y="1810">모든 후보가 프롬프트 통과에 실패한 경우</text>
  <text class="s" x="550" y="1832">detail = connected-but-not-applied</text>

  <rect class="stop" x="740" y="1744" width="340" height="100" rx="10"/>
  <text class="h" x="910" y="1768">접속불가 (연결·인증 모두 실패)</text>
  <text class="b" x="910" y="1790">네트워크 단절(8초 타임아웃) 또는</text>
  <text class="b" x="910" y="1810">SSH 키·모든 과거 비밀번호로도 접속 실패</text>
  <text class="s" x="910" y="1832">found_password_index = -1 · 방화벽·계정 확인</text>

  <!-- ===================== 작업자 실행 및 옵션 ===================== -->
  <rect class="band" x="20" y="1872" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1895">언제든 · 작업자 실행 — 명령어 옵션과 입출력 파일 구성</text>
  <text class="nl" x="1064" y="1894" style="text-anchor:end">./run.sh · ./bin/pwreset [옵션]</text>

  <rect class="input" x="170" y="1924" width="760" height="62" rx="10"/>
  <text class="h" x="550" y="1946">⌨ 실행 진입점 : ./run.sh (권장 래퍼) 또는 ./bin/pwreset [플래그]</text>
  <text class="b" x="550" y="1967">-pass 새 비밀번호 암호화 · -list 대상파일(기본 list.txt) · -out 결과파일(기본 result.csv) · -i SSH 개인키 경로</text>
  <path class="ln" d="M450 1986 V1998 H295 V2014"/>
  <path class="ln" d="M650 1986 V1998 H805 V2014"/>

  <rect class="input" x="60" y="2014" width="470" height="96" rx="10"/>
  <text class="h" x="295" y="2036">⌨ ./bin/pwreset -pass (새 비밀번호 등록)</text>
  <text class="b" x="295" y="2056">터미널에 새 비밀번호 입력 → AES-256-GCM 암호화</text>
  <text class="b" x="295" y="2075">key.bin (32바이트 키, 0600) 과 newpass.enc 생성</text>
  <text class="s" x="295" y="2096">새 비밀번호가 바뀔 때 1회 실행해 두면 이후 반복 실행 가능</text>

  <rect class="input" x="570" y="2014" width="470" height="96" rx="10"/>
  <text class="h" x="805" y="2036">⌨ ./run.sh [추가옵션] (일괄 실행)</text>
  <text class="b" x="805" y="2056">list.txt · old_password.txt · newpass.enc · key.bin 확인</text>
  <text class="b" x="805" y="2075">필수 파일 4종이 모두 있으면 ./bin/pwreset 실행</text>
  <text class="s" x="805" y="2096">누락된 파일이 있으면 생성 방법을 안내하고 안전하게 중단</text>

  <rect class="input" x="60" y="2128" width="470" height="78" rx="10"/>
  <text class="h" x="295" y="2150">⌨ 입력 파일 작성 (list.txt · old_password.txt)</text>
  <text class="b" x="295" y="2170">list.txt : 서버 IP/호스트명 (# 주석·빈 줄 무시)</text>
  <text class="s" x="295" y="2190">old_password.txt : 과거 비밀번호 후보 (최신 후보를 맨 위에 배치)</text>

  <rect class="input" x="570" y="2128" width="470" height="78" rx="10"/>
  <text class="h" x="805" y="2150">⌨ 플래그 지정 실행 (-list · -out · -i)</text>
  <text class="b" x="805" y="2170">특정 서버 그룹 파일이나 별도 SSH 개인키를 지정할 때 사용</text>
  <text class="s" x="805" y="2190">예 : ./bin/pwreset -list groupA.txt -out groupA.csv -i ~/.ssh/id_rsa</text>

  <rect class="input" x="60" y="2224" width="470" height="62" rx="10"/>
  <text class="h" x="295" y="2246">⌨ 결과 리포트 확인 (result.csv)</text>
  <text class="b" x="295" y="2266">미적용 · 접속불가 서버만 추려 후보 비밀번호 보강 후 재실행</text>

  <rect class="link" x="570" y="2224" width="470" height="62" rx="10"/>
  <text class="h" x="805" y="2246">-pass 암호화 파일은 0단계 · 1단계로 이어짐</text>
  <text class="b" x="805" y="2266">.gitignore 로 key.bin · newpass.enc · list.txt · result.csv 커밋 방지</text>
  <path class="lnd" d="M1040 2062 H1062 V2255 H1042"/>

  <text class="s" x="1080" y="2328" style="text-anchor:end">※ 비밀번호가 실제로 변경된 서버(updated-confirmed)라도 작업 완료 후 임의의 서버 몇 대를 직접 확인하세요.</text>
  <text class="s" x="1080" y="2346" style="text-anchor:end">단계별 자세한 흐름은 step1~step4 SVG 및 WORKFLOW.md · ARCHITECTURE.md 를 참고하세요.</text>
