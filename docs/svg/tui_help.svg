<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 403" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TUI ? — 도움말">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="403" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">TUI ? — 도움말</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">키 · 어느 화면에서나</text>

  <rect x="40" y="56" width="450" height="30" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">?</text>
  <path d="M265 86 L265 114" class="ln"/>
  <rect x="40" y="114" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="134" class="t tb" text-anchor="middle">st.help = true</text>
  <text x="265" y="150" class="t" text-anchor="middle">renderHelp: 화면 1 · 2 키, 항목별 메뉴(h · w), m · s · x 설명, 색 · 막대</text>
  <text x="265" y="166" class="t" text-anchor="middle">· % 의미</text>
  <path d="M265 176 L265 204" class="ln"/>
  <rect x="40" y="204" width="450" height="46" rx="6" class="box"/>
  <text x="265" y="224" class="t tb" text-anchor="middle">폭에 맞춰 단어 단위 줄바꿈</text>
  <text x="265" y="240" class="t" text-anchor="middle">높이가 모자라면 아래를 자름</text>
  <path d="M265 250 L265 278" class="ln"/>
  <rect x="40" y="278" width="450" height="46" rx="6" class="sec"/>
  <text x="265" y="298" class="t tb" text-anchor="middle">아무 키나 누르면 닫힘</text>
  <text x="265" y="314" class="t" text-anchor="middle">그 키는 닫는 데만 쓰이고 다른 동작은 하지 않음</text>
  <text x="40" y="361" class="t tm">범례</text>
  <rect x="80" y="350" width="14" height="14" class="box"/>
  <text x="100" y="361" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="350" width="14" height="14" class="sec"/>
  <text x="237" y="361" class="t tm">기록 · 결과</text>
  <rect x="321" y="350" width="14" height="14" class="ext"/>
  <text x="341" y="361" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="378" class="t tm">코드: tui.go st.help · render.go renderHelp</text>
</svg>
