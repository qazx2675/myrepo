  <text x="265" y="330" class="t" text-anchor="middle">redhat-release 6 · 호스트 이름이 OS6_hostname</text>
  <rect x="560" y="278" width="310" height="62" rx="6" class="sec"/>
  <text x="715" y="298" class="t tb" text-anchor="middle">bin_os6/&lt;이름&gt;.gz 를 제자리에 풀기</text>
  <text x="715" y="314" class="t" text-anchor="middle">Go 1.20 정적 빌드 (build_os6.sh 로 만듦)</text>
  <text x="715" y="330" class="t" text-anchor="middle">[결과] 성공 N / 실패 N</text>
