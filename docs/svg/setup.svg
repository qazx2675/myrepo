  <text x="265" y="388" class="t tb" text-anchor="middle">사전 점검</text>
  <text x="265" y="404" class="t" text-anchor="middle">go 1.26.5 이상 · govendor/ 완전한가</text>
  <rect x="560" y="368" width="310" height="46" rx="6" class="ext"/>
  <text x="715" y="388" class="t tb" text-anchor="middle">[오류] 종료</text>
  <text x="715" y="404" class="t" text-anchor="middle">Go 를 설치하거나 V2 폴더 전체를 복사</text>
  <path d="M490 391 L560 391" class="ln"/>
  <text x="498" y="386" class="t tm">아니오</text>
  <path d="M265 414 L265 442" class="ln"/>
  <text x="273" y="431" class="t tm">예</text>
  <rect x="40" y="442" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="462" class="t tb" text-anchor="middle">오프라인 강제</text>
  <text x="265" y="478" class="t" text-anchor="middle">GOFLAGS=-mod=vendor · GOPROXY=off</text>
  <text x="265" y="494" class="t" text-anchor="middle">GOTOOLCHAIN=local · GOSUMDB=off · CGO_ENABLED=0</text>
  <path d="M265 504 L265 532" class="ln"/>
  <rect x="40" y="532" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="552" class="t tb" text-anchor="middle">도구마다 (cd &lt;폴더&gt; &amp;&amp; bash setup.sh)</text>
  <text x="265" y="568" class="t" text-anchor="middle">govendor 를 vendor 로 링크 → go build</text>
  <text x="265" y="584" class="t" text-anchor="middle">실패하면 로그 끝 8줄 출력</text>
  <path d="M265 594 L265 622" class="ln"/>
  <rect x="40" y="622" width="450" height="46" rx="6" class="sec"/>
  <text x="265" y="642" class="t tb" text-anchor="middle">[결과] 성공 N / 실패 N</text>
