  <rect width="900" height="747" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">bash setup.sh [도구…] · -l · -c · --os6</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">V2 전체 도구 빌드 (폐쇄망 · 오프라인) — OS6 는 빌드 대신 bin_os6 설치</text>

