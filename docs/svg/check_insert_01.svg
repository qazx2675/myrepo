  <rect width="900" height="673" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">01.vm_setting_check_insert.sh [-u user] [-specFolder] [-expectNo*] [-fromSetup] [-fix]</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">vm-param-check 를 -specRoot 로 실행하는 보조 스크립트 — 단독 실행은 vm_setup 기록과 분리</text>

