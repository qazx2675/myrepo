name: auto_setup CI (Standalone)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/HPC/auto_setup

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Go vet
        run: |
          go vet ./...

      - name: Go test
        run: |
          go test ./...

      - name: Go build
        run: |
          go build -o auto_setup .

      - name: Gofmt check
        run: |
          test -z "$(gofmt -l .)"

      - name: Bash syntax check
        run: |
          bash -n setup.sh
          bash -n build_os6.sh
          bash -n test/manual_check.sh
          bash -n test/run_e2e.sh

      - name: ShellCheck lint
        run: |
          shellcheck -S warning setup.sh build_os6.sh test/manual_check.sh test/run_e2e.sh
