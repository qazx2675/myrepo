<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 515" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="auto_setup done">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="515" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">auto_setup done</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">CLI · 호스트 수동 완료 처리 (부팅 시각 검증 없음)</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">auto_setup done &lt;host...&gt;</text>
  <text x="265" y="92" class="t" text-anchor="middle">auto_setup done --job &lt;jobid&gt; [--yml &lt;그룹&gt;]</text>
  <path d="M265 102 L265 162" class="ln"/>
  <rect x="40" y="162" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="182" class="t tb" text-anchor="middle">--job 으로 시작하는가?</text>
  <rect x="560" y="130" width="310" height="94" rx="6" class="box"/>
  <text x="715" y="150" class="t tb" text-anchor="middle">jobPendingHosts — 대상 호스트 계산</text>
  <text x="715" y="166" class="t" text-anchor="middle">진행 중 job(jobs/&lt;id&gt;.json)의 미완료(processed</text>
  <text x="715" y="182" class="t" text-anchor="middle">비어 있음) 호스트만</text>
  <text x="715" y="198" class="t" text-anchor="middle">--yml 이면 그 그룹만, 없으면 "[X] … 미완료</text>
  <text x="715" y="214" class="t" text-anchor="middle">호스트가 없습니다"</text>
  <path d="M490 177 L560 177" class="ln"/>
  <text x="498" y="172" class="t tm">예</text>
  <path d="M265 192 L265 252" class="ln"/>
  <text x="273" y="209" class="t tm">아니오(호스트 직접 지정)</text>
  <rect x="40" y="252" width="450" height="78" rx="6" class="box"/>
  <text x="265" y="272" class="t tb" text-anchor="middle">markDone(hosts, "manual")</text>
  <text x="265" y="288" class="t" text-anchor="middle">호스트명 검사(/ 공백 .. 거부) → done/&lt;host&gt; 에 한 줄 기록</text>
  <text x="265" y="304" class="t" text-anchor="middle">"epoch user - manual" (임시 파일 → rename 원자 기록)</text>
  <text x="265" y="320" class="t" text-anchor="middle">로그 "[!] 수동 완료 요청(manual, 시각 검증 없음)"</text>
  <path d="M265 330 L265 374" class="ln"/>
  <rect x="40" y="374" width="450" height="46" rx="6" class="sec"/>
  <text x="265" y="394" class="t tb" text-anchor="middle">[O] 완료 처리 요청: N대</text>
  <text x="265" y="410" class="t" text-anchor="middle">[!] 수동 완료는 부팅 시각 검증 없이 인정됩니다 (데몬이 5초 내 수거)</text>
  <rect x="560" y="358" width="310" height="78" rx="6" class="ext"/>
  <text x="715" y="378" class="t tb" text-anchor="middle">데몬 acceptDoneRecords (5초 주기)</text>
  <text x="715" y="394" class="t" text-anchor="middle">전달 이후 기록이면 인정 → 호스트 processed</text>
  <text x="715" y="410" class="t" text-anchor="middle">(done_src=manual)</text>
  <text x="715" y="426" class="t" text-anchor="middle">기록은 done/applied/ 로 이동, run 대상에서 제외</text>
  <path d="M560 397 L492 397" class="dash"/>
  <text x="40" y="473" class="t tm">범례</text>
  <rect x="80" y="462" width="14" height="14" class="box"/>
  <text x="100" y="473" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="462" width="14" height="14" class="dec"/>
  <text x="237" y="473" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="462" width="14" height="14" class="sec"/>
  <text x="395" y="473" class="t tm">기록 · 결과</text>
  <rect x="478" y="462" width="14" height="14" class="ext"/>
  <text x="498" y="473" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="490" class="t tm">코드: ctl.go cmdDone · ctl.go jobPendingHosts · done.go markDone · done.go acceptDoneRecords</text>
</svg>
