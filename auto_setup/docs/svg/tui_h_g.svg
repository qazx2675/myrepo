<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 619" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TUI h → g — 재확인 (서버 상태 수동 재확인)">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="619" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">TUI h → g — 재확인 (서버 상태 수동 재확인)</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">메뉴 항목 · 화면 2 · 단축키 g 와 같음 (전체 보기에서도 가능)</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">h → g  (또는 g)</text>
  <text x="265" y="92" class="t" text-anchor="middle">완료를 제외한 모든 호스트 (설치중 · 정체 · 실패 포함)</text>
  <path d="M265 102 L265 130" class="ln"/>
  <rect x="40" y="130" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="150" class="t tb" text-anchor="middle">마지막 재확인 요청 후 5초가 지났는가?</text>
  <rect x="560" y="130" width="310" height="30" rx="6" class="ext"/>
  <text x="715" y="150" class="t tb" text-anchor="middle">"방금 재확인을 요청했습니다" 안내</text>
  <path d="M490 145 L560 145" class="ln"/>
  <text x="498" y="140" class="t tm">아니오</text>
  <path d="M265 160 L265 188" class="ln"/>
  <text x="273" y="177" class="t tm">예</text>
  <rect x="40" y="188" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="208" class="t tb" text-anchor="middle">requestRecheck — Request(ReqRecheck, {jobid, yml})</text>
  <text x="265" y="224" class="t" text-anchor="middle">그룹 화면이면 그 그룹, 전체 보기면 job 전체 (yml=*)</text>
  <text x="265" y="240" class="t" text-anchor="middle">진행 창(renderRecheckSplit)이 열려 호스트표와 진행 줄을 함께 표시</text>
  <path d="M265 250 L265 278" class="ln"/>
  <rect x="40" y="278" width="450" height="62" rx="6" class="ldap"/>
  <text x="265" y="298" class="t tb" text-anchor="middle">1/3 os8_mgmt 에서 확인 (gossh 60초 제한)</text>
  <text x="265" y="314" class="t" text-anchor="middle">응답 → route=local, 준비확인 결과를 즉시 반영 (anaconda 가 보이면</text>
  <text x="265" y="330" class="t" text-anchor="middle">단계 대기 → 설치중)</text>
  <path d="M265 340 L265 368" class="ln"/>
  <rect x="40" y="368" width="450" height="46" rx="6" class="ldap"/>
  <text x="265" y="388" class="t tb" text-anchor="middle">2/3 무응답만 os6_mgmt 경유 (os6_mgmt · os6_gossh 설정 시)</text>
  <text x="265" y="404" class="t" text-anchor="middle">응답 → route=os6</text>
  <path d="M265 414 L265 442" class="ln"/>
  <rect x="40" y="442" width="450" height="78" rx="6" class="sec"/>
  <text x="265" y="462" class="t tb" text-anchor="middle">3/3 최종 결과표</text>
  <text x="265" y="478" class="t" text-anchor="middle">호스트별 os8 응답 / os6 경유 / 접속불가 + 어디서 안 됐는지 (SSH 접속</text>
  <text x="265" y="494" class="t" text-anchor="middle">실패 · 시간 초과(60초) · 출력 형식 불일치)</text>
  <text x="265" y="510" class="t" text-anchor="middle">창에서 g 로 다시 재확인, q / Esc 로 닫기</text>
  <text x="40" y="557" class="t tm">범례</text>
  <rect x="80" y="546" width="14" height="14" class="box"/>
  <text x="100" y="557" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="546" width="14" height="14" class="dec"/>
  <text x="237" y="557" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="546" width="14" height="14" class="ldap"/>
  <text x="395" y="557" class="t tm">외부 호출 (gossh · ssh · 01 · 엔진 · os_check)</text>
  <rect x="679" y="546" width="14" height="14" class="sec"/>
  <text x="699" y="557" class="t tm">기록 · 결과</text>
  <rect x="80" y="566" width="14" height="14" class="ext"/>
  <text x="100" y="577" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="594" class="t tm">코드: tui.go requestRecheck · view.go openRecheckView · requests.go recheckHosts · view.go renderRecheckSplit</text>
</svg>
