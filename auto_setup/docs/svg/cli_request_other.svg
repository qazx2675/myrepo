<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 667" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="auto_setup request cancel / refresh">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="667" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">auto_setup request cancel / refresh</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">CLI · 요청 파일만 남기는 나머지 두 요청</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">auto_setup request cancel &lt;jobid&gt;</text>
  <text x="265" y="92" class="t" text-anchor="middle">auto_setup request refresh</text>
  <path d="M265 102 L265 130" class="ln"/>
  <rect x="40" y="130" width="450" height="46" rx="6" class="dec"/>
  <text x="265" y="150" class="t tb" text-anchor="middle">요청 종류와 인자 개수가 맞는가?</text>
  <text x="265" y="166" class="t" text-anchor="middle">cancel: 인자 2개 · refresh: 인자 1개</text>
  <rect x="560" y="138" width="310" height="30" rx="6" class="ext"/>
  <text x="715" y="158" class="t tb" text-anchor="middle">사용법 출력, 종료코드 1</text>
  <path d="M490 153 L560 153" class="ln"/>
  <text x="498" y="148" class="t tm">아니오</text>
  <path d="M265 176 L265 204" class="ln"/>
  <text x="273" y="193" class="t tm">예</text>
  <rect x="40" y="204" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="224" class="t tb" text-anchor="middle">writeRequest(kind, payload)</text>
  <text x="265" y="240" class="t" text-anchor="middle">requests/&lt;epoch&gt;_cancel.req 또는 _refresh.req 원자 기록</text>
  <text x="265" y="256" class="t" text-anchor="middle">[O] 요청 등록: &lt;파일명&gt;</text>
  <path d="M265 266 L265 294" class="ln"/>
  <rect x="40" y="294" width="450" height="46" rx="6" class="ldap"/>
  <text x="265" y="314" class="t tb" text-anchor="middle">데몬 collectRequests (5초 주기)</text>
  <text x="265" y="330" class="t" text-anchor="middle">수거한 요청 파일을 종류별로 처리</text>
  <path d="M265 340 L265 400" class="ln"/>
  <rect x="40" y="400" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="420" class="t tb" text-anchor="middle">요청 종류는?</text>
  <rect x="560" y="368" width="310" height="94" rx="6" class="sec"/>
  <text x="715" y="388" class="t tb" text-anchor="middle">cancel</text>
  <text x="715" y="404" class="t" text-anchor="middle">auto_setup cancel 과 같음: jobs/&lt;id&gt;.json →</text>
  <text x="715" y="420" class="t" text-anchor="middle">jobs/done/</text>
  <text x="715" y="436" class="t" text-anchor="middle">데몬은 감시를 멈추고 이미 끝난 run 의</text>
  <text x="715" y="452" class="t" text-anchor="middle">결과(codes/)는 그대로 남음</text>
  <path d="M490 415 L560 415" class="ln"/>
  <text x="498" y="410" class="t tm">cancel</text>
  <path d="M265 430 L265 490" class="ln"/>
  <text x="273" y="447" class="t tm">refresh</text>
  <rect x="40" y="490" width="450" height="78" rx="6" class="sec"/>
  <text x="265" y="510" class="t tb" text-anchor="middle">refresh (TUI r 키와 같음)</text>
  <text x="265" y="526" class="t" text-anchor="middle">다음 step 에서 ping · 준비확인을 즉시 수행, os8 무응답은 os6_mgmt</text>
  <text x="265" y="542" class="t" text-anchor="middle">경유로 확인</text>
  <text x="265" y="558" class="t" text-anchor="middle">정체 호스트도 ping 상태와 무관하게 즉시 다시 확인</text>
  <text x="40" y="605" class="t tm">범례</text>
  <rect x="80" y="594" width="14" height="14" class="box"/>
  <text x="100" y="605" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="594" width="14" height="14" class="dec"/>
  <text x="237" y="605" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="594" width="14" height="14" class="ldap"/>
  <text x="395" y="605" class="t tm">외부 호출 (gossh · ssh · 01 · 엔진 · os_check)</text>
  <rect x="679" y="594" width="14" height="14" class="sec"/>
  <text x="699" y="605" class="t tm">기록 · 결과</text>
  <rect x="80" y="614" width="14" height="14" class="ext"/>
  <text x="100" y="625" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="642" class="t tm">코드: requests.go ReqCancel · requests.go ReqRefresh · ctl.go requestArgsOK · requests.go collectRequests</text>
</svg>
