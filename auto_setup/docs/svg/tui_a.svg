<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 525" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TUI a — 전체 그룹 보기">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="525" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">TUI a — 전체 그룹 보기</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">키 · 화면 1 / 화면 2</text>

  <rect x="40" y="56" width="450" height="30" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">a</text>
  <path d="M265 86 L265 138" class="ln"/>
  <rect x="40" y="138" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="158" class="t tb" text-anchor="middle">어느 화면인가?</text>
  <rect x="560" y="114" width="310" height="78" rx="6" class="box"/>
  <text x="715" y="134" class="t tb" text-anchor="middle">화면 1 (그룹 목록)</text>
  <text x="715" y="150" class="t" text-anchor="middle">선택한 job 의 모든 그룹(yml) 호스트를 한 표로</text>
  <text x="715" y="166" class="t" text-anchor="middle">→ 화면 2 (전체 보기 *)</text>
  <text x="715" y="182" class="t" text-anchor="middle">yml 열이 추가됨</text>
  <path d="M490 153 L560 153" class="ln"/>
  <text x="498" y="148" class="t tm">화면 1</text>
  <path d="M265 168 L265 220" class="ln"/>
  <rect x="40" y="220" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="240" class="t tb" text-anchor="middle">화면 2, 그룹별 보기</text>
  <text x="265" y="256" class="t" text-anchor="middle">sel.Yml = 전체(allView), 호스트 커서 0, 필터 꺼짐</text>
  <text x="265" y="272" class="t" text-anchor="middle">mergedGroup 이 그룹 순서대로 호스트를 이어 붙임</text>
  <path d="M265 282 L265 318" class="ln"/>
  <rect x="40" y="318" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="338" class="t tb" text-anchor="middle">이미 전체 보기인가? (화면 2 에서 a 를 한 번 더)</text>
  <rect x="560" y="310" width="310" height="46" rx="6" class="box"/>
  <text x="715" y="330" class="t tb" text-anchor="middle">화면 1 로 돌아감</text>
  <text x="715" y="346" class="t" text-anchor="middle">(Detail=false) 거기서 그룹을 골라 Enter</text>
  <path d="M490 333 L560 333" class="ln"/>
  <text x="498" y="328" class="t tm">예</text>
  <path d="M265 348 L265 384" class="ln"/>
  <text x="273" y="365" class="t tm">아니오</text>
  <rect x="40" y="384" width="450" height="62" rx="6" class="sec"/>
  <text x="265" y="404" class="t tb" text-anchor="middle">전체 보기에서의 제한</text>
  <text x="265" y="420" class="t" text-anchor="middle">c · t · v 는 "그룹별 화면에서 누르세요" 안내만, g · d 는 가능</text>
  <text x="265" y="436" class="t" text-anchor="middle">수동 실행은 그룹별 화면에서만</text>
  <text x="40" y="483" class="t tm">범례</text>
  <rect x="80" y="472" width="14" height="14" class="box"/>
  <text x="100" y="483" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="472" width="14" height="14" class="dec"/>
  <text x="237" y="483" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="472" width="14" height="14" class="sec"/>
  <text x="395" y="483" class="t tm">기록 · 결과</text>
  <rect x="478" y="472" width="14" height="14" class="ext"/>
  <text x="498" y="483" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="500" class="t tm">코드: tui.go handleOverview · tui.go handleDetail · render.go mergedGroup</text>
</svg>
