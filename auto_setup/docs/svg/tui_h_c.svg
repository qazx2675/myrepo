<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 635" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TUI h → c — 체크+수정 (설정체크 + 설정수정)">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="635" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">TUI h → c — 체크+수정 (설정체크 + 설정수정)</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">메뉴 항목 · 화면 2 · 단축키 c 와 같음</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">h → c  (또는 c)</text>
  <text x="265" y="92" class="t" text-anchor="middle">완료 여부와 상관없이 그룹 전체를 시도</text>
  <path d="M265 102 L265 130" class="ln"/>
  <rect x="40" y="130" width="450" height="62" rx="6" class="dec"/>
  <text x="265" y="150" class="t tb" text-anchor="middle">실행할 수 있는가?</text>
  <text x="265" y="166" class="t" text-anchor="middle">startManual: 전체 보기가 아님 · 이 그룹의 수동 run 이 대기·진행 중이</text>
  <text x="265" y="182" class="t" text-anchor="middle">아님 · 방금 요청하지 않음 (20초)</text>
  <rect x="560" y="138" width="310" height="46" rx="6" class="ext"/>
  <text x="715" y="158" class="t tb" text-anchor="middle">안내 메시지만 표시</text>
  <text x="715" y="174" class="t" text-anchor="middle">"전체 보기에서는 수동 실행을 할 수 없습니다" 등</text>
  <path d="M490 161 L560 161" class="ln"/>
  <text x="498" y="156" class="t tm">아니오</text>
  <path d="M265 192 L265 220" class="ln"/>
  <text x="273" y="209" class="t tm">예</text>
  <rect x="40" y="220" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="240" class="t tb" text-anchor="middle">확인 줄: 설정체크 + 설정수정 (빨강) y/n</text>
  <rect x="560" y="220" width="310" height="30" rx="6" class="ext"/>
  <text x="715" y="240" class="t tb" text-anchor="middle">"취소했습니다"</text>
  <path d="M490 235 L560 235" class="ln"/>
  <text x="498" y="230" class="t tm">n</text>
  <path d="M265 250 L265 278" class="ln"/>
  <text x="273" y="267" class="t tm">y</text>
  <rect x="40" y="278" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="298" class="t tb" text-anchor="middle">requestManual — manual-run 요청</text>
  <text x="265" y="314" class="t" text-anchor="middle">requests/&lt;epoch&gt;_manual-run.req (원격이면 gossh 로)</text>
  <text x="265" y="330" class="t" text-anchor="middle">전체 화면 결과 창이 열려 요청 전달 → 대기 → 실행 중을 표시</text>
  <path d="M265 340 L265 368" class="ln"/>
  <rect x="40" y="368" width="450" height="62" rx="6" class="ldap"/>
  <text x="265" y="388" class="t tb" text-anchor="middle">데몬: 수락 → active/ → 경로 재확인 → os_check -auto</text>
  <text x="265" y="404" class="t" text-anchor="middle">배포 → 완료 자동 흐름과 같은 모드 (체크 → 수정 → 재점검), run 큐 동시</text>
  <text x="265" y="420" class="t" text-anchor="middle">1개</text>
  <path d="M265 430 L265 458" class="ln"/>
  <rect x="40" y="458" width="450" height="78" rx="6" class="sec"/>
  <text x="265" y="478" class="t tb" text-anchor="middle">결과 창에 결과 출력 · 정상 실행된 호스트는 완료 처리</text>
  <text x="265" y="494" class="t" text-anchor="middle">결과 리포트 · FAIL 줄 · NO FAIL · LDAP/SPLUNK/커널 요약 / ↑↓</text>
  <text x="265" y="510" class="t" text-anchor="middle">Space b r 로 스크롤·새로고침, q 로 닫아도 데몬은 계속</text>
  <text x="265" y="526" class="t" text-anchor="middle">v 로 나중에 다시 봄</text>
  <text x="40" y="573" class="t tm">범례</text>
  <rect x="80" y="562" width="14" height="14" class="box"/>
  <text x="100" y="573" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="562" width="14" height="14" class="dec"/>
  <text x="237" y="573" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="562" width="14" height="14" class="ldap"/>
  <text x="395" y="573" class="t tm">외부 호출 (gossh · ssh · 01 · 엔진 · os_check)</text>
  <rect x="679" y="562" width="14" height="14" class="sec"/>
  <text x="699" y="573" class="t tm">기록 · 결과</text>
  <rect x="80" y="582" width="14" height="14" class="ext"/>
  <text x="100" y="593" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="610" class="t tm">코드: tui.go startManual · tui.go requestManual · view.go openRunView · requests.go scheduleManual</text>
</svg>
