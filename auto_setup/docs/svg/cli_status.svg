<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 545" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="auto_setup status">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="545" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">auto_setup status</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">CLI · 진행 중인 작업을 한 줄 단위로 요약 (읽기 전용)</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">auto_setup status</text>
  <text x="265" y="92" class="t" text-anchor="middle">인자는 받지 않음</text>
  <path d="M265 102 L265 154" class="ln"/>
  <rect x="40" y="154" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="174" class="t tb" text-anchor="middle">원격 클라이언트인가? (os8_mgmt 변수가 채워짐)</text>
  <rect x="560" y="130" width="310" height="78" rx="6" class="ldap"/>
  <text x="715" y="150" class="t tb" text-anchor="middle">relayRemote — os8_mgmt 에 중계</text>
  <text x="715" y="166" class="t" text-anchor="middle">gossh -pm -script -w &lt;목록&gt; "&lt;os8_autosetup&gt;</text>
  <text x="715" y="182" class="t" text-anchor="middle">status"</text>
  <text x="715" y="198" class="t" text-anchor="middle">출력·종료코드를 그대로 복원해 출력</text>
  <path d="M490 169 L560 169" class="ln"/>
  <text x="498" y="164" class="t tm">예</text>
  <path d="M265 184 L265 236" class="ln"/>
  <text x="273" y="201" class="t tm">아니오(로컬)</text>
  <rect x="40" y="236" width="450" height="46" rx="6" class="box"/>
  <text x="265" y="256" class="t tb" text-anchor="middle">loadJobs()</text>
  <text x="265" y="272" class="t" text-anchor="middle">jobs/*.json 읽기 (진행 중 작업만, jobs/done 은 제외)</text>
  <path d="M265 282 L265 318" class="ln"/>
  <rect x="40" y="318" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="338" class="t tb" text-anchor="middle">작업이 있는가?</text>
  <rect x="560" y="310" width="310" height="46" rx="6" class="sec"/>
  <text x="715" y="330" class="t tb" text-anchor="middle">"진행 중인 작업 없음" 출력</text>
  <text x="715" y="346" class="t" text-anchor="middle">종료코드 0</text>
  <path d="M490 333 L560 333" class="ln"/>
  <text x="498" y="328" class="t tm">없음</text>
  <path d="M265 348 L265 384" class="ln"/>
  <text x="273" y="365" class="t tm">예</text>
  <rect x="40" y="384" width="450" height="62" rx="6" class="sec"/>
  <text x="265" y="404" class="t tb" text-anchor="middle">formatJobStatus() — 작업마다 출력</text>
  <text x="265" y="420" class="t" text-anchor="middle">jobid, user, 호스트 상태별 대수, 남은 호스트를 가로로 나열</text>
  <text x="265" y="436" class="t" text-anchor="middle">종료코드 0</text>
  <text x="40" y="483" class="t tm">범례</text>
  <rect x="80" y="472" width="14" height="14" class="box"/>
  <text x="100" y="483" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="472" width="14" height="14" class="dec"/>
  <text x="237" y="483" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="472" width="14" height="14" class="ldap"/>
  <text x="395" y="483" class="t tm">외부 호출 (gossh · ssh · 01 · 엔진 · os_check)</text>
  <rect x="679" y="472" width="14" height="14" class="sec"/>
  <text x="699" y="483" class="t tm">기록 · 결과</text>
  <rect x="80" y="492" width="14" height="14" class="ext"/>
  <text x="100" y="503" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="520" class="t tm">코드: main.go runStatus · state.go formatJobStatus · client.go relayRemote</text>
</svg>
