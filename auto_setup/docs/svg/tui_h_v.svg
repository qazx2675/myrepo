<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 435" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TUI h → v — 최근 수동 실행 결과 보기">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="435" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">TUI h → v — 최근 수동 실행 결과 보기</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">메뉴 항목 · 화면 2 · 단축키 v 와 같음</text>

  <rect x="40" y="56" width="450" height="30" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">h → v  (또는 v)</text>
  <path d="M265 86 L265 122" class="ln"/>
  <rect x="40" y="122" width="450" height="46" rx="6" class="dec"/>
  <text x="265" y="142" class="t tb" text-anchor="middle">그룹별 화면이고, 이 그룹의 수동 실행 기록이 있는가?</text>
  <text x="265" y="158" class="t" text-anchor="middle">openLatestResult → lastManualRun(job, yml)</text>
  <rect x="560" y="114" width="310" height="62" rx="6" class="ext"/>
  <text x="715" y="134" class="t tb" text-anchor="middle">안내 메시지만 표시</text>
  <text x="715" y="150" class="t" text-anchor="middle">"그룹별 화면에서 v 를 누르세요" / "수동 실행</text>
  <text x="715" y="166" class="t" text-anchor="middle">결과가 아직 없습니다 (c 또는 t 로 실행)"</text>
  <path d="M490 145 L560 145" class="ln"/>
  <text x="498" y="140" class="t tm">아니오</text>
  <path d="M265 168 L265 204" class="ln"/>
  <text x="273" y="185" class="t tm">예</text>
  <rect x="40" y="204" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="224" class="t tb" text-anchor="middle">viewRun 창 열기 — fillRunResult</text>
  <text x="265" y="240" class="t" text-anchor="middle">가장 최근 수동 run 의 code 본문(codes/&lt;code&gt;.txt)을 읽어 표시</text>
  <text x="265" y="256" class="t" text-anchor="middle">제목: 최근 수동 실행 결과 [모드] - &lt;yml&gt;</text>
  <path d="M265 266 L265 294" class="ln"/>
  <rect x="40" y="294" width="450" height="62" rx="6" class="sec"/>
  <text x="265" y="314" class="t tb" text-anchor="middle">결과 창</text>
  <text x="265" y="330" class="t" text-anchor="middle">↑↓ PgUp/PgDn Space b 스크롤, r 새로고침, q / Esc 로 닫기</text>
  <text x="265" y="346" class="t" text-anchor="middle">결과 리포트 · FAIL 줄 · NO FAIL · LDAP/SPLUNK/커널 요약</text>
  <text x="40" y="393" class="t tm">범례</text>
  <rect x="80" y="382" width="14" height="14" class="box"/>
  <text x="100" y="393" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="382" width="14" height="14" class="dec"/>
  <text x="237" y="393" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="382" width="14" height="14" class="sec"/>
  <text x="395" y="393" class="t tm">기록 · 결과</text>
  <rect x="478" y="382" width="14" height="14" class="ext"/>
  <text x="498" y="393" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="410" class="t tm">코드: view.go openLatestResult · view.go lastManualRun · view.go fillRunResult</text>
</svg>
