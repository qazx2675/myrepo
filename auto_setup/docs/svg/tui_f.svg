  <text x="265" y="182" class="t" text-anchor="middle">호스트 커서는 맨 위(0)로</text>
  <path d="M265 192 L265 228" class="ln"/>
  <rect x="40" y="228" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="248" class="t tb" text-anchor="middle">보일 호스트가 있는가?</text>
  <rect x="560" y="220" width="310" height="46" rx="6" class="sec"/>
  <text x="715" y="240" class="t tb" text-anchor="middle">"(정체·실패 호스트 없음)" 표시</text>
  <text x="715" y="256" class="t" text-anchor="middle">f 를 다시 누르면 전체 표로 돌아감</text>
  <path d="M490 243 L560 243" class="ln"/>
  <text x="498" y="238" class="t tm">없음</text>
  <path d="M265 258 L265 294" class="ln"/>
  <text x="273" y="275" class="t tm">있음</text>
  <rect x="40" y="294" width="450" height="62" rx="6" class="sec"/>
  <text x="265" y="314" class="t tb" text-anchor="middle">정체·실패 호스트만 표로 표시</text>
  <text x="265" y="330" class="t" text-anchor="middle">안내 줄은 "f 정체·실패만" 그대로 (토글)</text>
  <text x="265" y="346" class="t" text-anchor="middle">a 로 전체 보기로 바꾸면 필터는 꺼짐</text>
  <text x="40" y="393" class="t tm">범례</text>
  <rect x="80" y="382" width="14" height="14" class="box"/>
  <text x="100" y="393" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="382" width="14" height="14" class="dec"/>
  <text x="237" y="393" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="382" width="14" height="14" class="sec"/>
  <text x="395" y="393" class="t tm">기록 · 결과</text>
  <rect x="478" y="382" width="14" height="14" class="ext"/>
  <text x="498" y="393" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="410" class="t tm">코드: tui.go handleDetail · render.go visibleHosts</text>
</svg>
