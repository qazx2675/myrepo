<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 693" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="auto_setup ensure / daemon">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="693" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">auto_setup ensure / daemon</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">CLI · cron 매분 ensure → 데몬 기동, daemon 은 포그라운드 루프 — os8_mgmt 에서만</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">[cron 매분] auto_setup ensure</text>
  <text x="265" y="92" class="t" text-anchor="middle">setup.sh 가 crontab 에 등록 (중복 방지), 원격 클라이언트에서는 거부</text>
  <path d="M265 102 L265 130" class="ln"/>
  <rect x="40" y="130" width="450" height="30" rx="6" class="box"/>
  <text x="265" y="150" class="t tb" text-anchor="middle">ensureDirs → tryLock (flock auto_setup.lock)</text>
  <path d="M265 160 L265 196" class="ln"/>
  <rect x="40" y="196" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="216" class="t tb" text-anchor="middle">lock 을 잡았는가? (= 데몬이 없음)</text>
  <rect x="560" y="188" width="310" height="46" rx="6" class="ext"/>
  <text x="715" y="208" class="t tb" text-anchor="middle">이미 데몬이 살아 있음</text>
  <text x="715" y="224" class="t" text-anchor="middle">아무것도 안 하고 종료코드 0</text>
  <path d="M490 211 L560 211" class="ln"/>
  <text x="498" y="206" class="t tm">못 잡음</text>
  <path d="M265 226 L265 262" class="ln"/>
  <text x="273" y="243" class="t tm">예</text>
  <rect x="40" y="262" width="450" height="46" rx="6" class="ldap"/>
  <text x="265" y="282" class="t tb" text-anchor="middle">lock 해제 후 auto_setup daemon 을 setsid 로 기동</text>
  <text x="265" y="298" class="t" text-anchor="middle">로그 "ensure: 데몬 기동 pid=N"</text>
  <path d="M265 308 L265 336" class="ln"/>
  <rect x="40" y="336" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="356" class="t tb" text-anchor="middle">daemon (runDaemon): lock 보유 · pid 파일 기록 · PATH 에 표준</text>
  <text x="265" y="372" class="t tb" text-anchor="middle">경로 보강</text>
  <text x="265" y="388" class="t" text-anchor="middle">SIGTERM / SIGINT 를 받으면 루프를 마치고 종료 (pid 파일 삭제)</text>
  <path d="M265 398 L265 426" class="ln"/>
  <rect x="40" y="426" width="450" height="78" rx="6" class="box"/>
  <text x="265" y="446" class="t tb" text-anchor="middle">loop — 5초마다 step</text>
  <text x="265" y="462" class="t" text-anchor="middle">queue 수거 · 요청(.req) 수거 · 취소 반영 · ping 10초 · 준비확인 30초 ·</text>
  <text x="265" y="478" class="t" text-anchor="middle">LDAP 백업 · 완료기록 수거</text>
  <text x="265" y="494" class="t" text-anchor="middle">단계 갱신 · 스케줄(7분/3분) · 수동 run · 끝난 작업 정리 · 상태 저장</text>
  <path d="M265 504 L265 532" class="ln"/>
  <rect x="40" y="532" width="450" height="62" rx="6" class="sec"/>
  <text x="265" y="552" class="t tb" text-anchor="middle">하루 한 번 workCleanAll</text>
  <text x="265" y="568" class="t" text-anchor="middle">gossh 작업 기록 정리: 전체 출력 7일 · user 당 200MB · /tmp/&lt;3자리&gt;</text>
  <text x="265" y="584" class="t" text-anchor="middle">파일 7일 (요약은 영구 보관)</text>
  <text x="40" y="631" class="t tm">범례</text>
  <rect x="80" y="620" width="14" height="14" class="box"/>
  <text x="100" y="631" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="620" width="14" height="14" class="dec"/>
  <text x="237" y="631" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="620" width="14" height="14" class="ldap"/>
  <text x="395" y="631" class="t tm">외부 호출 (gossh · ssh · 01 · 엔진 · os_check)</text>
  <rect x="679" y="620" width="14" height="14" class="sec"/>
  <text x="699" y="631" class="t tm">기록 · 결과</text>
  <rect x="80" y="640" width="14" height="14" class="ext"/>
  <text x="100" y="651" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="668" class="t tm">코드: ensure.go runEnsure · daemon.go runDaemon · daemon.go workCleanAll · ensure.go tryLock</text>
</svg>
