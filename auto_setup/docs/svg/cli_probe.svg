<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 599" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="auto_setup probe [-i 10s]">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="599" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">auto_setup probe [-i 10s]</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">CLI · (os6_mgmt 쪽) 호스트 목록 ping 감시 — 데몬이 ssh 장기 세션으로 호출</text>

  <rect x="40" y="56" width="450" height="78" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">ssh -o BatchMode=yes &lt;os6_mgmt&gt; "&lt;os6_autosetup&gt;/auto_setup</text>
  <text x="265" y="92" class="t tb" text-anchor="middle">probe -i 10s"</text>
  <text x="265" y="108" class="t" text-anchor="middle">데몬(os8_mgmt)이 route=os6 호스트를 위해 상시 유지, 끊기면 자동</text>
  <text x="265" y="124" class="t" text-anchor="middle">재시작</text>
  <path d="M265 134 L265 162" class="ln"/>
  <rect x="40" y="162" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="182" class="t tb" text-anchor="middle">옵션이 올바른가? (-i 는 0 보다 큰 시간)</text>
  <rect x="560" y="162" width="310" height="30" rx="6" class="ext"/>
  <text x="715" y="182" class="t tb" text-anchor="middle">사용법 출력, 종료코드 1</text>
  <path d="M490 177 L560 177" class="ln"/>
  <text x="498" y="172" class="t tm">아니오</text>
  <path d="M265 192 L265 220" class="ln"/>
  <text x="273" y="209" class="t tm">예</text>
  <rect x="40" y="220" width="450" height="46" rx="6" class="box"/>
  <text x="265" y="240" class="t tb" text-anchor="middle">raw ICMP 소켓 열기 (root 필요)</text>
  <text x="265" y="256" class="t" text-anchor="middle">실패하면 [X] 사유 출력, 종료코드 1</text>
  <path d="M265 266 L265 294" class="ln"/>
  <rect x="40" y="294" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="314" class="t tb" text-anchor="middle">stdin 에서 호스트 목록 읽기 (readProbeList)</text>
  <text x="265" y="330" class="t" text-anchor="middle">줄마다 host 또는 "host ip", 빈 줄 또는 EOF 로 목록 끝</text>
  <text x="265" y="346" class="t" text-anchor="middle">이후 stdin 은 EOF 까지 버림 — ssh 가 끊기면 EOF 로 종료</text>
  <path d="M265 356 L265 384" class="ln"/>
  <rect x="40" y="384" width="450" height="46" rx="6" class="box"/>
  <text x="265" y="404" class="t tb" text-anchor="middle">probeLoop — 주기(-i)마다 ping</text>
  <text x="265" y="420" class="t" text-anchor="middle">이름 해석 → echo id+seq 로 호스트 매핑 → 연속 무응답 판정</text>
  <path d="M265 430 L265 458" class="ln"/>
  <rect x="40" y="458" width="450" height="62" rx="6" class="sec"/>
  <text x="265" y="478" class="t tb" text-anchor="middle">stdout 출력</text>
  <text x="265" y="494" class="t" text-anchor="middle">첫 결과는 전체를 "host up|down", 이후에는 변화만 출력</text>
  <text x="265" y="510" class="t" text-anchor="middle">데몬이 이 출력으로 route=os6 호스트의 ping 상태를 갱신</text>
  <text x="40" y="557" class="t tm">범례</text>
  <rect x="80" y="546" width="14" height="14" class="box"/>
  <text x="100" y="557" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="546" width="14" height="14" class="dec"/>
  <text x="237" y="557" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="546" width="14" height="14" class="sec"/>
  <text x="395" y="557" class="t tm">기록 · 결과</text>
  <rect x="478" y="546" width="14" height="14" class="ext"/>
  <text x="498" y="557" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="574" class="t tm">코드: probe.go runProbe · probe.go readProbeList · probe.go probeLoop</text>
</svg>
