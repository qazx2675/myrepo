<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 599" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="auto_setup --start / --stop / --restart">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="599" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">auto_setup --start / --stop / --restart</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">CLI · 데몬 제어 (start · stop · restart 도 같음) — os8_mgmt 에서만</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">auto_setup --start | --stop | --restart</text>
  <text x="265" y="92" class="t" text-anchor="middle">인자가 더 있으면 사용법 출력 후 종료코드 1</text>
  <path d="M265 102 L265 138" class="ln"/>
  <rect x="40" y="138" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="158" class="t tb" text-anchor="middle">로컬 모드인가? (os8_mgmt 변수가 비어 있음)</text>
  <rect x="560" y="130" width="310" height="46" rx="6" class="ext"/>
  <text x="715" y="150" class="t tb" text-anchor="middle">[X] 데몬은 os8_mgmt 에서만 실행합니다</text>
  <text x="715" y="166" class="t" text-anchor="middle">원격 클라이언트에서는 거부, 종료코드 1</text>
  <path d="M490 153 L560 153" class="ln"/>
  <text x="498" y="148" class="t tm">아니오</text>
  <path d="M265 168 L265 204" class="ln"/>
  <text x="273" y="185" class="t tm">예</text>
  <rect x="40" y="204" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="224" class="t tb" text-anchor="middle">stop · restart : 데몬 종료 (stopDaemonCmd)</text>
  <text x="265" y="240" class="t" text-anchor="middle">auto_setup.pid 로 실행 중인지 확인</text>
  <text x="265" y="256" class="t" text-anchor="middle">SIGTERM 보내고 최대 10초 대기 → [O] 데몬 종료 (pid N)</text>
  <rect x="560" y="204" width="310" height="62" rx="6" class="ext"/>
  <text x="715" y="224" class="t tb" text-anchor="middle">실행 중이 아니면</text>
  <text x="715" y="240" class="t" text-anchor="middle">[!] 데몬이 실행 중이 아닙니다 (실패 아님)</text>
  <text x="715" y="256" class="t" text-anchor="middle">restart 는 이어서 기동으로</text>
  <path d="M490 235 L560 235" class="ln"/>
  <text x="498" y="230" class="t tm">안 돌고 있음</text>
  <path d="M265 266 L265 294" class="ln"/>
  <rect x="40" y="294" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="314" class="t tb" text-anchor="middle">restart 에서 종료가 실패했는가?</text>
  <rect x="560" y="294" width="310" height="30" rx="6" class="ext"/>
  <text x="715" y="314" class="t tb" text-anchor="middle">기동하지 않고 종료코드 1</text>
  <path d="M490 309 L560 309" class="ln"/>
  <text x="498" y="304" class="t tm">예</text>
  <path d="M265 324 L265 352" class="ln"/>
  <text x="273" y="341" class="t tm">아니오</text>
  <rect x="40" y="352" width="450" height="78" rx="6" class="box"/>
  <text x="265" y="372" class="t tb" text-anchor="middle">start · restart : 데몬 기동 (startDaemon)</text>
  <text x="265" y="388" class="t" text-anchor="middle">이미 실행 중이면 [O] 이미 실행 중 (pid N) 으로 끝</text>
  <text x="265" y="404" class="t" text-anchor="middle">ensureDirs → auto_setup daemon 을 setsid 로 띄움 (cron 의 ensure 와</text>
  <text x="265" y="420" class="t" text-anchor="middle">같은 방식)</text>
  <path d="M265 430 L265 458" class="ln"/>
  <rect x="40" y="458" width="450" height="62" rx="6" class="sec"/>
  <text x="265" y="478" class="t tb" text-anchor="middle">pid 파일이 보일 때까지 최대 5초 대기</text>
  <text x="265" y="494" class="t" text-anchor="middle">[O] 데몬 기동 (pid N)  /  실패하면 [X] 데몬 기동을 확인하지 못했습니다</text>
  <text x="265" y="510" class="t" text-anchor="middle">(로그 경로 안내)</text>
  <rect x="560" y="458" width="310" height="62" rx="6" class="ext"/>
  <text x="715" y="478" class="t tb" text-anchor="middle">설정 파일을 바꿨다면</text>
  <text x="715" y="494" class="t" text-anchor="middle">auto_setup.conf 는 데몬 기동 때 한 번만</text>
  <text x="715" y="510" class="t" text-anchor="middle">읽으므로 --restart 가 필요합니다</text>
  <path d="M560 489 L492 489" class="dash"/>
  <text x="40" y="557" class="t tm">범례</text>
  <rect x="80" y="546" width="14" height="14" class="box"/>
  <text x="100" y="557" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="546" width="14" height="14" class="dec"/>
  <text x="237" y="557" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="546" width="14" height="14" class="sec"/>
  <text x="395" y="557" class="t tm">기록 · 결과</text>
  <rect x="478" y="546" width="14" height="14" class="ext"/>
  <text x="498" y="557" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="574" class="t tm">코드: ctl.go cmdDaemonCtl · ctl.go startDaemon · ctl.go stopDaemonCmd · main.go remoteOnlyMsg</text>
</svg>
