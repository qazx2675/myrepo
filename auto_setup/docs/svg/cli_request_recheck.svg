<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 693" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="auto_setup request recheck &lt;jobid&gt; &lt;yml|*&gt;">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="693" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">auto_setup request recheck &lt;jobid&gt; &lt;yml|*&gt;</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">CLI · 서버 상태 재확인 요청 — TUI h→g 와 같음</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">auto_setup request recheck &lt;jobid&gt; &lt;그룹.yml 또는 *&gt;</text>
  <text x="265" y="92" class="t" text-anchor="middle">* = 그 job 의 모든 그룹</text>
  <path d="M265 102 L265 130" class="ln"/>
  <rect x="40" y="130" width="450" height="46" rx="6" class="box"/>
  <text x="265" y="150" class="t tb" text-anchor="middle">writeRequest("recheck", {jobid, yml})</text>
  <text x="265" y="166" class="t" text-anchor="middle">requests/&lt;epoch&gt;_recheck.req 원자 기록 → [O] 요청 등록</text>
  <path d="M265 176 L265 204" class="ln"/>
  <rect x="40" y="204" width="450" height="46" rx="6" class="ldap"/>
  <text x="265" y="224" class="t tb" text-anchor="middle">데몬 recheckHosts — 후보 = 완료(processed) 제외 전부 (단계 무관)</text>
  <text x="265" y="240" class="t" text-anchor="middle">job 이 없으면 recheck 기록에 "job 을 찾을 수 없습니다"</text>
  <path d="M265 250 L265 278" class="ln"/>
  <rect x="40" y="278" width="450" height="62" rx="6" class="ldap"/>
  <text x="265" y="298" class="t tb" text-anchor="middle">1/3 os8_mgmt 에서 직접 확인 (gossh, 전체 60초 제한)</text>
  <text x="265" y="314" class="t" text-anchor="middle">응답한 호스트: route=local, 준비확인 결과(설치중 · 부팅확인 · READY)</text>
  <text x="265" y="330" class="t" text-anchor="middle">즉시 반영</text>
  <rect x="560" y="278" width="310" height="62" rx="6" class="box"/>
  <text x="715" y="298" class="t tb" text-anchor="middle">무응답 호스트만 다음 단계로</text>
  <text x="715" y="314" class="t" text-anchor="middle">사유 보존: SSH 접속 실패 · 시간 초과(60초) ·</text>
  <text x="715" y="330" class="t" text-anchor="middle">출력 형식 불일치</text>
  <path d="M490 309 L560 309" class="ln"/>
  <text x="498" y="304" class="t tm">무응답</text>
  <path d="M265 340 L265 368" class="ln"/>
  <rect x="40" y="368" width="450" height="46" rx="6" class="ldap"/>
  <text x="265" y="388" class="t tb" text-anchor="middle">2/3 os6_mgmt 경유로 확인 (os6_mgmt · os6_gossh 설정 시)</text>
  <text x="265" y="404" class="t" text-anchor="middle">응답: route=os6 로 전환 (bash -c 로 감싼 원격 명령)</text>
  <path d="M265 414 L265 450" class="ln"/>
  <rect x="40" y="450" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="470" class="t tb" text-anchor="middle">3/3 둘 다 무응답인가?</text>
  <rect x="560" y="442" width="310" height="46" rx="6" class="ext"/>
  <text x="715" y="462" class="t tb" text-anchor="middle">접속불가: 상태는 그대로</text>
  <text x="715" y="478" class="t" text-anchor="middle">로그 [!] 재확인(g) 접속불가·미응답 N대</text>
  <path d="M490 465 L560 465" class="ln"/>
  <text x="498" y="460" class="t tm">예</text>
  <path d="M265 480 L265 516" class="ln"/>
  <text x="273" y="497" class="t tm">아니오</text>
  <rect x="40" y="516" width="450" height="78" rx="6" class="sec"/>
  <text x="265" y="536" class="t tb" text-anchor="middle">recheck/&lt;jobid&gt;.json 에 진행 기록 (줄 단위 갱신)</text>
  <text x="265" y="552" class="t" text-anchor="middle">TUI g 진행 창이 이 기록을 실시간으로 읽음. CLI 만 썼다면 snapshot 의</text>
  <text x="265" y="568" class="t" text-anchor="middle">recheck 항목에서 확인</text>
  <text x="265" y="584" class="t" text-anchor="middle">호스트별 결과: os8 응답 / os6 경유 / 접속불가 + 사유</text>
  <text x="40" y="631" class="t tm">범례</text>
  <rect x="80" y="620" width="14" height="14" class="box"/>
  <text x="100" y="631" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="620" width="14" height="14" class="dec"/>
  <text x="237" y="631" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="620" width="14" height="14" class="ldap"/>
  <text x="395" y="631" class="t tm">외부 호출 (gossh · ssh · 01 · 엔진 · os_check)</text>
  <rect x="679" y="620" width="14" height="14" class="sec"/>
  <text x="699" y="631" class="t tm">기록 · 결과</text>
  <rect x="80" y="640" width="14" height="14" class="ext"/>
  <text x="100" y="651" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="668" class="t tm">코드: requests.go recheckHosts · requests.go ReqRecheck · check.go checkTimeout · requests.go writeRecheck</text>
</svg>
