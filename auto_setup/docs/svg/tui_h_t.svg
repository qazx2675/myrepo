<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 603" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TUI h → t — 체크만 (설정체크만)">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="603" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">TUI h → t — 체크만 (설정체크만)</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">메뉴 항목 · 화면 2 · 단축키 t 와 같음</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">h → t  (또는 t)</text>
  <text x="265" y="92" class="t" text-anchor="middle">환경설정은 수정하지 않고 점검 결과만 보고 싶을 때</text>
  <path d="M265 102 L265 130" class="ln"/>
  <rect x="40" y="130" width="450" height="46" rx="6" class="dec"/>
  <text x="265" y="150" class="t tb" text-anchor="middle">실행할 수 있는가?</text>
  <text x="265" y="166" class="t" text-anchor="middle">전체 보기 아님 · 대기·진행 중인 수동 run 없음 · 방금 요청하지 않음</text>
  <rect x="560" y="138" width="310" height="30" rx="6" class="ext"/>
  <text x="715" y="158" class="t tb" text-anchor="middle">안내 메시지만 표시</text>
  <path d="M490 153 L560 153" class="ln"/>
  <text x="498" y="148" class="t tm">아니오</text>
  <path d="M265 176 L265 204" class="ln"/>
  <text x="273" y="193" class="t tm">예</text>
  <rect x="40" y="204" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="224" class="t tb" text-anchor="middle">확인 줄: 설정체크만 (설정 수정 안 함) y/n</text>
  <rect x="560" y="204" width="310" height="30" rx="6" class="ext"/>
  <text x="715" y="224" class="t tb" text-anchor="middle">"취소했습니다"</text>
  <path d="M490 219 L560 219" class="ln"/>
  <text x="498" y="214" class="t tm">n</text>
  <path d="M265 234 L265 262" class="ln"/>
  <text x="273" y="251" class="t tm">y</text>
  <rect x="40" y="262" width="450" height="46" rx="6" class="box"/>
  <text x="265" y="282" class="t tb" text-anchor="middle">requestManual — manual-run 요청 (mode=check)</text>
  <text x="265" y="298" class="t" text-anchor="middle">requests/&lt;epoch&gt;_manual-run.req 에 mode=check</text>
  <path d="M265 308 L265 336" class="ln"/>
  <rect x="40" y="336" width="450" height="78" rx="6" class="ldap"/>
  <text x="265" y="356" class="t tb" text-anchor="middle">데몬: os_check -auto-check &lt;user&gt; targets.txt</text>
  <text x="265" y="372" class="t" text-anchor="middle">-auto 와 같되 환경설정 수정 질문에 n. 현장 os_check 사본에도</text>
  <text x="265" y="388" class="t" text-anchor="middle">-auto-check 옵션이 있어야 함</text>
  <text x="265" y="404" class="t" text-anchor="middle">없으면 t 는 비정상 종료로 기록됨 (c 와 자동 흐름은 영향 없음)</text>
  <path d="M265 414 L265 442" class="ln"/>
  <rect x="40" y="442" width="450" height="62" rx="6" class="sec"/>
  <text x="265" y="462" class="t tb" text-anchor="middle">결과 창에 점검 결과만 출력</text>
  <text x="265" y="478" class="t" text-anchor="middle">code 첫 줄: "작업 : 설정체크만 (설정 수정 안 함)"</text>
  <text x="265" y="494" class="t" text-anchor="middle">호스트 완료 처리 · 단계 · 실패 횟수 · 2차 체크는 그대로</text>
  <text x="40" y="541" class="t tm">범례</text>
  <rect x="80" y="530" width="14" height="14" class="box"/>
  <text x="100" y="541" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="530" width="14" height="14" class="dec"/>
  <text x="237" y="541" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="530" width="14" height="14" class="ldap"/>
  <text x="395" y="541" class="t tm">외부 호출 (gossh · ssh · 01 · 엔진 · os_check)</text>
  <rect x="679" y="530" width="14" height="14" class="sec"/>
  <text x="699" y="541" class="t tm">기록 · 결과</text>
  <rect x="80" y="550" width="14" height="14" class="ext"/>
  <text x="100" y="561" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="578" class="t tm">코드: mode_test.go · requests.go ModeCheck · runner.go modeLabel · tui.go startManual</text>
</svg>
