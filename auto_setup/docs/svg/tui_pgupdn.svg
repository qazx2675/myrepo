<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 435" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TUI PgUp / PgDn">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="435" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">TUI PgUp / PgDn</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">키 · 터미널의 ESC[5~ / ESC[6~</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">PageUp / PageDown</text>
  <text x="265" y="92" class="t" text-anchor="middle">parseKeys 가 ESC [ 5 ~ , ESC [ 6 ~ 를 kPgUp / kPgDn 으로 인식</text>
  <path d="M265 102 L265 154" class="ln"/>
  <rect x="40" y="154" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="174" class="t tb" text-anchor="middle">어느 화면인가?</text>
  <rect x="560" y="130" width="310" height="78" rx="6" class="box"/>
  <text x="715" y="150" class="t tb" text-anchor="middle">화면 1 · 화면 2</text>
  <text x="715" y="166" class="t" text-anchor="middle">그룹 행 / 호스트 행을 pageRows 만큼 이동</text>
  <text x="715" y="182" class="t" text-anchor="middle">pageRows = 화면 높이 − 8 (최소 1), 끝에서</text>
  <text x="715" y="198" class="t" text-anchor="middle">멈춤</text>
  <path d="M490 169 L560 169" class="ln"/>
  <text x="498" y="164" class="t tm">목록</text>
  <path d="M265 184 L265 236" class="ln"/>
  <rect x="40" y="236" width="450" height="46" rx="6" class="box"/>
  <text x="265" y="256" class="t tb" text-anchor="middle">결과 창 · 변경 화면(미리보기·결과) · 신규 설치 양식 본문</text>
  <text x="265" y="272" class="t" text-anchor="middle">Space / b 와 같이 쪽 단위 스크롤 (flowScroll)</text>
  <rect x="560" y="236" width="310" height="46" rx="6" class="box"/>
  <text x="715" y="256" class="t tb" text-anchor="middle">gossh 작업 화면</text>
  <text x="715" y="272" class="t" text-anchor="middle">작업 목록 · 검색 결과 커서를 쪽 단위로</text>
  <path d="M490 259 L560 259" class="ln"/>
  <text x="498" y="254" class="t tm">s</text>
  <path d="M265 282 L265 310" class="ln"/>
  <rect x="40" y="310" width="450" height="46" rx="6" class="sec"/>
  <text x="265" y="330" class="t tb" text-anchor="middle">도움말(?)과 결과 창 안내 줄에 "PgUp/PgDn" 표시</text>
  <text x="265" y="346" class="t" text-anchor="middle">입력 줄이 있는 화면은 입력 중에도 본문 스크롤만 함</text>
  <text x="40" y="393" class="t tm">범례</text>
  <rect x="80" y="382" width="14" height="14" class="box"/>
  <text x="100" y="393" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="382" width="14" height="14" class="dec"/>
  <text x="237" y="393" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="382" width="14" height="14" class="sec"/>
  <text x="395" y="393" class="t tm">기록 · 결과</text>
  <rect x="478" y="382" width="14" height="14" class="ext"/>
  <text x="498" y="393" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="410" class="t tm">코드: tui.go parseKeys · tui.go pageRows · flow_tui.go flowScroll · pgkeys_test.go</text>
</svg>
