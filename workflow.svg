<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg-light { fill: #1e1e1e; }
        .text-dark { fill: #e0e0e0; }
        .box-fill { fill: #2a2a2a; stroke: #4a9eff; }
        .decision-fill { fill: #2a3a3a; stroke: #4a9eff; }
      }
      @media (prefers-color-scheme: light) {
        .bg-light { fill: #ffffff; }
        .text-dark { fill: #333333; }
        .box-fill { fill: #e8f4ff; stroke: #0066cc; }
        .decision-fill { fill: #fff3e0; stroke: #ff8800; }
      }
      @media not (prefers-color-scheme) {
        .bg-light { fill: #ffffff; }
        .text-dark { fill: #333333; }
        .box-fill { fill: #e8f4ff; stroke: #0066cc; }
        .decision-fill { fill: #fff3e0; stroke: #ff8800; }
      }
      .text-mono { font-family: monospace; font-size: 12px; }
      .text-bold { font-weight: bold; font-size: 13px; }
      .arrow { stroke-width: 2; marker-end: url(#arrowhead); }
      .label { font-size: 11px; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" class="text-dark" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" class="bg-light"/>

  <!-- Title -->
  <text x="400" y="30" class="text-bold text-dark" text-anchor="middle" font-size="18">
    auto_setup 데몬 실행 흐름
  </text>

  <!-- Step 1: 01 → queue -->
  <rect x="200" y="60" width="400" height="60" rx="5" class="box-fill" stroke-width="2"/>
  <text x="400" y="85" class="text-bold text-dark" text-anchor="middle">[01] 02 성공</text>
  <text x="400" y="105" class="text-mono text-dark" text-anchor="middle">queue/&lt;epoch&gt;_&lt;user&gt;_&lt;pid&gt;.job</text>

  <!-- Arrow -->
  <path d="M 400 120 L 400 150" class="arrow text-dark"/>

  <!-- Step 2: Daemon ensure -->
  <rect x="200" y="150" width="400" height="60" rx="5" class="box-fill" stroke-width="2"/>
  <text x="400" y="175" class="text-bold text-dark" text-anchor="middle">[cron 매분] auto_setup ensure</text>
  <text x="400" y="195" class="text-mono text-dark" text-anchor="middle">flock → setsid daemon 백그라운드</text>

  <!-- Arrow -->
  <path d="M 400 210 L 400 240" class="arrow text-dark"/>

  <!-- Step 3: Queue poll -->
  <rect x="200" y="240" width="400" height="60" rx="5" class="box-fill" stroke-width="2"/>
  <text x="400" y="265" class="text-bold text-dark" text-anchor="middle">[데몬] 5초 주기 queue 수거</text>
  <text x="400" y="285" class="text-mono text-dark" text-anchor="middle">DNS 조회 (동시 32) → IP 매핑</text>

  <!-- Arrow -->
  <path d="M 400 300 L 400 330" class="arrow text-dark"/>

  <!-- Step 4: Route decision -->
  <polygon points="400,330 500,380 400,430 300,380" class="decision-fill" stroke-width="2"/>
  <text x="400" y="378" class="text-bold text-dark" text-anchor="middle">로컬 ping</text>
  <text x="400" y="395" class="text-bold text-dark" text-anchor="middle">응답?</text>

  <!-- Left path: local -->
  <text x="280" y="390" class="text-dark" font-size="11">Yes: local</text>
  <path d="M 300 380 L 150 380 L 150 460" class="arrow text-dark"/>

  <!-- Right path: os6 -->
  <text x="520" y="390" class="text-dark" font-size="11">No: os6</text>
  <path d="M 500 380 L 650 380 L 650 460" class="arrow text-dark"/>

  <!-- Step 5: jobs/<jobid>.json -->
  <rect x="200" y="460" width="400" height="60" rx="5" class="box-fill" stroke-width="2"/>
  <text x="400" y="485" class="text-bold text-dark" text-anchor="middle">jobs/&lt;jobid&gt;.json 생성</text>
  <text x="400" y="505" class="text-mono text-dark" text-anchor="middle">route: local|os6, seen_down, READY 추적</text>

  <!-- Arrow -->
  <path d="M 400 520 L 400 550" class="arrow text-dark"/>

  <!-- Step 6: ICMP loop -->
  <rect x="200" y="550" width="400" height="70" rx="5" class="box-fill" stroke-width="2"/>
  <text x="400" y="575" class="text-bold text-dark" text-anchor="middle">[루프 ①] 10초 주기 ping 감시</text>
  <text x="400" y="595" class="text-mono text-dark" text-anchor="middle">raw ICMP (local) / ssh probe (os6)</text>
  <text x="400" y="610" class="text-mono text-dark" text-anchor="middle">무응답 2회 연속 → seen_down=true</text>

  <!-- Arrow -->
  <path d="M 400 620 L 400 650" class="arrow text-dark"/>

  <!-- Step 7: Check loop -->
  <rect x="200" y="650" width="400" height="80" rx="5" class="box-fill" stroke-width="2"/>
  <text x="400" y="675" class="text-bold text-dark" text-anchor="middle">[루프 ②] 30초 주기 준비확인</text>
  <text x="400" y="695" class="text-mono text-dark" text-anchor="middle">후보: 미처리 && ping up && seen_down</text>
  <text x="400" y="710" class="text-mono text-dark" text-anchor="middle">gossh -pm uptime → uptime &lt; 경과시간?</text>
  <text x="400" y="725" class="text-mono text-dark" text-anchor="middle">anaconda 아님? → READY</text>

  <!-- Arrow -->
  <path d="M 400 730 L 400 760" class="arrow text-dark"/>

  <!-- Step 8: Schedule decision -->
  <polygon points="400,760 500,820 400,880 300,820" class="decision-fill" stroke-width="2"/>
  <text x="400" y="815" class="text-bold text-dark" text-anchor="middle">스케줄</text>
  <text x="400" y="835" class="text-bold text-dark" text-anchor="middle">run 시점?</text>

  <!-- Paths from schedule -->
  <text x="150" y="830" class="text-dark" font-size="11">즉시 or 7분</text>
  <path d="M 300 820 L 100 820 L 100 900" class="arrow text-dark"/>

  <text x="600" y="830" class="text-dark" font-size="11">늦은 +3분</text>
  <path d="M 500 820 L 700 820 L 700 900" class="arrow text-dark"/>

  <!-- Step 9: os_check run -->
  <rect x="50" y="900" width="250" height="80" rx="5" class="box-fill" stroke-width="2"/>
  <text x="175" y="925" class="text-bold text-dark" text-anchor="middle">1차 run</text>
  <text x="175" y="945" class="text-mono text-dark" text-anchor="middle">전체 목록</text>
  <text x="175" y="960" class="text-mono text-dark" text-anchor="middle">bash os_check_sh</text>
  <text x="175" y="975" class="text-mono text-dark" text-anchor="middle">-auto &lt;user&gt;</text>

  <rect x="500" y="900" width="250" height="80" rx="5" class="box-fill" stroke-width="2"/>
  <text x="625" y="925" class="text-bold text-dark" text-anchor="middle">재실행 run</text>
  <text x="625" y="945" class="text-mono text-dark" text-anchor="middle">미처리 호스트만</text>
  <text x="625" y="960" class="text-mono text-dark" text-anchor="middle">bash os_check_sh</text>
  <text x="625" y="975" class="text-mono text-dark" text-anchor="middle">-auto &lt;user&gt;</text>

  <!-- Arrow down from both -->
  <path d="M 175 980 L 175 1020" class="arrow text-dark"/>
  <path d="M 625 980 L 625 1020" class="arrow text-dark"/>

  <!-- Merge -->
  <path d="M 175 1020 L 400 1020 L 625 1020" class="arrow text-dark"/>

  <!-- Step 10: Code generation -->
  <rect x="150" y="1020" width="500" height="80" rx="5" class="box-fill" stroke-width="2"/>
  <text x="400" y="1045" class="text-bold text-dark" text-anchor="middle">codes/&lt;code&gt;.txt 생성 &amp; wall 발송</text>
  <text x="400" y="1063" class="text-mono text-dark" text-anchor="middle">① 결과 리포트  ② FAIL/NO FAIL</text>
  <text x="400" y="1078" class="text-mono text-dark" text-anchor="middle">③ LDAP·Splunk·커널 요약  ④ 원본경로</text>
  <text x="400" y="1093" class="text-mono text-dark" text-anchor="middle">→ wall: 완료 호스트(가로) + code</text>

  <!-- Legend -->
  <text x="20" y="1180" class="text-dark" font-size="11" font-weight="bold">흐름: 01 → queue → 데몬 경로판별 → ping 감시 → 준비확인 → 7분/3분 스케줄 → os_check → code/wall → 무기한 감시</text>
</svg>
