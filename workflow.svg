<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2192" viewBox="0 0 1100 2192" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4f63"/></marker>
    <style>
      .auto  { fill: #e7f0ff; stroke: #3a63c8; stroke-width: 1.6; }
      .input { fill: #fff1dc; stroke: #e08600; stroke-width: 2; }
      .stop  { fill: #ffe5e5; stroke: #d03030; stroke-width: 1.6; }
      .done  { fill: #e3f6e8; stroke: #2f9e57; stroke-width: 2; }
      .link  { fill: #f1ebff; stroke: #7650c8; stroke-width: 2; }
      .band  { fill: #eef0f5; }
      .note  { fill: #fbfbfb; stroke: #9aa0ad; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .ln    { stroke: #4a4f63; stroke-width: 1.7; fill: none; marker-end: url(#ah); }
      .lnd   { stroke: #4a4f63; stroke-width: 1.5; fill: none; marker-end: url(#ah); stroke-dasharray: 6 4; }
      .tie   { stroke: #9aa0ad; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .ti    { font-size: 24px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .sub   { font-size: 14px; fill: #4a4f63; text-anchor: middle; }
      .bt    { font-size: 16px; font-weight: bold; fill: #1d2140; }
      .h     { font-size: 15.5px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .b     { font-size: 13.5px; fill: #2b2f45; text-anchor: middle; }
      .s     { font-size: 11.5px; fill: #7a7f8f; text-anchor: middle; }
      .lb    { font-size: 13px; font-weight: bold; fill: #b04a00; text-anchor: middle; }
      .lg    { font-size: 13px; fill: #2b2f45; }
      .nl    { font-size: 12.5px; fill: #4a4f63; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1100" height="2192" fill="#ffffff"/>

  <path class="ln" d="M550 300 V324"/>
  <path class="ln" d="M550 402 V426"/>
  <path class="ln" d="M550 524 V606"/>
  <path class="ln" d="M550 684 V708"/>
  <path class="ln" d="M550 806 V830"/>
  <path class="ln" d="M550 908 V932"/>
  <path class="ln" d="M830 971 H866"/>
  <path class="ln" d="M550 1010 V1092"/>
  <path class="ln" d="M550 1170 V1194"/>
  <path class="ln" d="M550 1292 V1316"/>
  <path class="ln" d="M550 1434 V1458"/>
  <path class="ln" d="M830 1497 H866"/>
  <path class="ln" d="M550 1536 V1618"/>
  <path class="ln" d="M550 1716 V1740"/>
  <text class="ti" x="550" y="42">V2 — 한눈에 보는 흐름 (VMsetup + vm-param-check)</text>
  <text class="sub" x="550" y="68">BM 목록과 스펙(SPEC_DIR)을 정하면 VM 생성·설정 → 스펙 체크까지 이어집니다. 주황색(⌨)은 작업자가 직접 하는 곳입니다.</text>
  <text class="sub" x="550" y="88">두 도구는 같은 스펙 폴더 SPEC_DIR 을 읽습니다 (스펙 해석은 vm-param-check -specExport 하나).</text>
  <rect class="auto" x="167" y="106" width="26" height="18" rx="4"/><text class="lg" x="200" y="120">자동 처리</text>
  <rect class="input" x="282" y="106" width="26" height="18" rx="4"/><text class="lg" x="315" y="120">⌨ 작업자 입력·선택</text>
  <rect class="stop" x="461" y="106" width="26" height="18" rx="4"/><text class="lg" x="494" y="120">중단 · 주의</text>
  <rect class="done" x="587" y="106" width="26" height="18" rx="4"/><text class="lg" x="620" y="120">완료</text>
  <rect class="note" x="672" y="106" width="26" height="18" rx="4"/><text class="lg" x="705" y="120">보충 설명</text>
  <rect class="link" x="787" y="106" width="26" height="18" rx="4"/><text class="lg" x="820" y="120">다른 흐름도와 연결</text>

  <rect class="band" x="20" y="150" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="173">0단계 · 준비 — 처음 한 번 (또는 비밀번호·도구가 바뀔 때)</text>
  <text class="nl" x="1064" y="172" style="text-anchor:end">setup.sh · passwd_update.sh</text>
  <rect class="input" x="270" y="202" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="224">⌨ V2 폴더를 서버에 배치 → bash setup.sh</text>
  <text class="b" x="550" y="244">OS8 : govendor 로 13개 도구 오프라인 빌드 (GOPROXY=off)</text>
  <text class="b" x="550" y="264">OS6 : bin_os6/*.gz (Go 1.20 빌드) 를 제자리에 설치</text>
  <text class="s" x="550" y="284">bash setup.sh -l 목록 · -c 정리 · --os6 강제</text>
  <path class="tie" d="M830 251 H848"/>
  <rect class="note" x="848" y="215" width="232" height="72" rx="8"/>
  <text class="nl" x="964" y="237">OS6 판단 : 커널 2.6 ·</text>
  <text class="nl" x="964" y="255">redhat-release 6 · OS6_hostname</text>
  <text class="nl" x="964" y="273">· --os6 · VMSETUP_OS6=1</text>
  <rect class="input" x="270" y="324" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="346">⌨ ./passwd_update.sh (vCenter) · -esxi (ESXi)</text>
  <text class="b" x="550" y="366">비밀번호를 secret/ 에 암호화 저장 — 이후 환경변수 없이 실행</text>
  <text class="b" x="550" y="386">비밀번호가 바뀌면 다시 등록 · -list 로 풀리는지 확인</text>
  <rect class="input" x="270" y="426" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="448">⌨ 작업 파일 준비 (VMsetup/)</text>
  <text class="b" x="550" y="468">&lt;user&gt;.txt = BM 목록 · vswitch_&lt;user&gt;.txt = BM 포트그룹 VLAN</text>
  <text class="b" x="550" y="488">vcenter.txt = vCenter 목록 · SPEC_DIR/&lt;폴더&gt;/&lt;폴더&gt;_spec.txt</text>
  <text class="s" x="550" y="508">스펙: cpu/mem/disk/cores/numa/affinity-evNN · pci-evNN · tag-* · *_del_* 키</text>
  <path class="tie" d="M830 475 H848"/>
  <rect class="note" x="848" y="439" width="232" height="72" rx="8"/>
  <text class="nl" x="964" y="461">포트그룹 칸이 IP 면</text>
  <text class="nl" x="964" y="479">vm_setup.sh 가 vswitch_pgname.sh</text>
  <text class="nl" x="964" y="497">로 &lt;폴더명&gt;-cae-a-b-c-0 변환</text>

  <rect class="band" x="20" y="554" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="577">1단계 · 입력 — ./vm_setup.sh (실행 전 모든 것을 정함)</text>
  <text class="nl" x="1064" y="576" style="text-anchor:end">VMsetup/workflow.svg 에 자세히</text>
  <rect class="input" x="270" y="606" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="628">⌨ 설치 정보 · user 선택</text>
  <text class="b" x="550" y="648">OS 버전(예: 8.10) · 인프라 — 매번 물음 (MAC 목록에 들어감)</text>
  <text class="b" x="550" y="668">-u 없으면 user 번호 메뉴 (0 = 직접 입력)</text>
  <rect class="auto" x="270" y="708" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="730">스펙 할당 — 포트그룹 폴더명 → SPEC_DIR 자동 매칭</text>
  <text class="b" x="550" y="750">CAE 번호는 무시하고 폴더명으로 매칭</text>
  <text class="b" x="550" y="770">못 정한 BM 만 ⌨ 번호 선택 / 0 → vim 으로 새 스펙</text>
  <text class="s" x="550" y="790">affinity-evNN 이 없는 스펙 → 지금 골라 추가할지 물음</text>
  <path class="tie" d="M270 757 H252"/>
  <rect class="note" x="20" y="703" width="232" height="108" rx="8"/>
  <text class="nl" x="136" y="725">스펙 제외 키</text>
  <text class="nl" x="136" y="743">all_del_affinity=y · all_del_lpage=y</text>
  <text class="nl" x="136" y="761">evNN_del_affinity=y</text>
  <text class="nl" x="136" y="779">evNN_del_lpage=y</text>
  <text class="nl" x="136" y="797">→ 그 ev 만 설정 제외</text>
  <rect class="input" x="270" y="830" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="852">⌨ VM 표 확인 · CAE 번호 · vCenter 선택</text>
  <text class="b" x="550" y="872">VM → 스펙 / 포트그룹 표 (y/n) · CAE 번호 변경?</text>
  <text class="b" x="550" y="892">vcenter.txt 번호 (Enter = 이 user 의 이전 실행)</text>
  <rect class="input" x="270" y="932" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="954">⌨ 실행 계획 확인 (y/n)</text>
  <text class="b" x="550" y="974">VM 사양 · affinity 값 · MAC 디스크 · 제외(스펙) ev 를 모두 보여줌</text>
  <text class="s" x="550" y="994">-n 이면 계획만 보고 종료</text>
  <text class="lb" x="848" y="964">n</text>
  <rect class="stop" x="866" y="942" width="214" height="58" rx="8"/>
  <text class="b" x="973" y="966">n → 종료</text>
  <text class="b" x="973" y="985">(vCenter 변경 없음)</text>

  <rect class="band" x="20" y="1040" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1063">2단계 · 실행 — vCenter 변경 (진행 모니터 : ↑↓ 이동 · Enter 로그)</text>
  <text class="nl" x="1064" y="1062" style="text-anchor:end">run_&lt;user&gt;/logs/</text>
  <text class="lb" x="566" y="1032">y</text>
  <rect class="auto" x="270" y="1092" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1114">호스트 등록 → 포트그룹 생성 (BM 전체 1회)</text>
  <text class="b" x="550" y="1134">main_conn : BM 을 vCenter 의 Task 폴더에 등록</text>
  <text class="b" x="550" y="1154">vswitch_setting : BM 포트그룹 생성 (호스트 병렬)</text>
  <rect class="auto" x="270" y="1194" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="1216">스펙마다 : VM 생성 → MAC 조사 → 전원 고성능</text>
  <text class="b" x="550" y="1236">vm_create : ev01~ev99 생성 (이미 있으면 건너뜀)</text>
  <text class="b" x="550" y="1256">mac_info : MAC/IP 조사 · 디스크 용량 자동 매칭</text>
  <text class="b" x="550" y="1276">power_setting : BM 전원 정책 고성능</text>
  <rect class="auto" x="270" y="1316" width="560" height="118" rx="10"/>
  <text class="h" x="550" y="1338">스펙마다 : affinity → lpage → PCI 패스스루</text>
  <text class="b" x="550" y="1358">affinity_setting : ev 별 affinity 파일 적용</text>
  <text class="b" x="550" y="1378">lpage_setting : HugePage + CPU 토폴로지</text>
  <text class="b" x="550" y="1398">pci_passthrough : 스펙에 pci-evNN 이 있을 때만</text>
  <text class="s" x="550" y="1418">제외된 ev 는 설정 대신 삭제 (-del_* = 전체, 스펙 키 = 그 ev 만)</text>
  <path class="tie" d="M830 1375 H848"/>
  <rect class="note" x="848" y="1330" width="232" height="90" rx="8"/>
  <text class="nl" x="964" y="1352">PCI 는 호스트 재부팅이</text>
  <text class="nl" x="964" y="1370">필요하면 경고 후 계속</text>
  <text class="nl" x="964" y="1388">→ 재부팅 뒤</text>
  <text class="nl" x="964" y="1406">run_&lt;user&gt;/pci_resume_N.sh</text>
  <rect class="input" x="270" y="1458" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1480">⌨ 라이선스 할당 (평가판 호스트만) → 태그 설정</text>
  <text class="b" x="550" y="1500">license_assign : 라이선스 번호 선택 (q = 취소)</text>
  <text class="b" x="550" y="1520">tag_setting : 스펙 tag-* (없으면 건너뜀, 실패는 경고만)</text>
  <text class="lb" x="848" y="1490">실패</text>
  <rect class="stop" x="866" y="1458" width="214" height="77" rx="8"/>
  <text class="b" x="973" y="1482">단계 실패 → 그 자리에서</text>
  <text class="b" x="973" y="1502">멈춤 · 고친 뒤 재실행</text>
  <text class="b" x="973" y="1520">(이미 만든 것은 건너뜀)</text>

  <rect class="band" x="20" y="1566" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1589">3단계 · 체크 — 만든 VM 이 스펙과 같은지</text>
  <text class="nl" x="1064" y="1588" style="text-anchor:end">vm-param-check -specFolder</text>
  <rect class="auto" x="270" y="1618" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="1640">스펙 체크 — 방금 만든 VM 만, 실행한 스펙으로</text>
  <text class="b" x="550" y="1660">제외된 항목은 &quot;값이 없어야 OK&quot; (-del_* 전체 / 스펙 키 ev 별)</text>
  <text class="b" x="550" y="1680">run_&lt;user&gt;/check_N.log · .csv · check_specs.txt</text>
  <text class="s" x="550" y="1700">결과가 달라도 VM 은 이미 만들어졌으므로 실패로 치지 않음</text>
  <rect class="done" x="270" y="1740" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1762">MAC 목록 복사 → [완료]</text>
  <text class="b" x="550" y="1782">mac_all.txt 의 IP 를 DNS 로 채움 → awx_route/&lt;user&gt;.txt 로 복사</text>
  <text class="b" x="550" y="1802">awx_route 가 비어 있으면 run_&lt;user&gt;/ 에만 남김</text>
  <path class="tie" d="M830 1779 H848"/>
  <rect class="note" x="848" y="1752" width="232" height="54" rx="8"/>
  <text class="nl" x="964" y="1774">차이가 있으면</text>
  <text class="nl" x="964" y="1792">4단계 교정으로</text>

  <rect class="band" x="20" y="1848" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1871">4단계 · 교정 · 단독 체크 — vm-param-check</text>
  <text class="nl" x="1064" y="1870" style="text-anchor:end">vm-param-check-usability-improvement/workflow.svg</text>
  <rect class="input" x="60" y="1900" width="470" height="98" rx="10"/>
  <text class="h" x="295" y="1922">⌨ 01.vm_setting_check_insert.sh -fromSetup</text>
  <text class="b" x="295" y="1942">vm_setup 직후 : run_&lt;user&gt;/check_specs.txt 그대로 체크</text>
  <text class="b" x="295" y="1962">스펙 폴더 · 대상 목록 · vCenter 추가 입력 없음</text>
  <text class="s" x="295" y="1982">-fix 를 붙이면 교정까지</text>
  <rect class="input" x="570" y="1900" width="470" height="98" rx="10"/>
  <text class="h" x="805" y="1922">⌨ 01.vm_setting_check_insert.sh (단독)</text>
  <text class="b" x="805" y="1942">&lt;user&gt;.txt 목록 + 스펙 폴더명 (Enter = 자동 매칭)</text>
  <text class="b" x="805" y="1962">run_&lt;user&gt;/ 기록은 보지 않음 (이전 실행과 분리)</text>
  <text class="s" x="805" y="1982">-specFolder · -expectNoLpage · -expectNoAffinity</text>
  <rect class="auto" x="60" y="2016" width="470" height="98" rx="10"/>
  <text class="h" x="295" y="2038">vm-param-check -fix</text>
  <text class="b" x="295" y="2058">게이트 (스펙별 동질성 + 전원 OFF) → dry-run</text>
  <text class="b" x="295" y="2078">⌨ y/N → VM 당 Reconfigure 1회 → 재검증</text>
  <text class="s" x="295" y="2098">_recheck_&lt;시각&gt;.csv</text>
  <rect class="link" x="570" y="2016" width="470" height="98" rx="10"/>
  <text class="h" x="805" y="2038">배포 · 갱신</text>
  <text class="b" x="805" y="2058">update_deploy.sh (인터넷) · update.sh (폐쇄망)</text>
  <text class="b" x="805" y="2078">사용자 파일(01.*, vcenter.txt, SPEC_DIR) 보존</text>
  <text class="s" x="805" y="2098">workflow-deploy.svg</text>
  <text class="s" x="1080" y="2150" style="text-anchor:end">※ 설정이 실제로 바뀌는 작업(vm_setup 실행 · -fix)은 끝난 뒤 임의의 VM 몇 대를 직접 확인하세요.</text>
  <text class="s" x="1080" y="2168" style="text-anchor:end">명령별 자세한 흐름은 docs/svg/ 를 참고하세요.</text>
</svg>
