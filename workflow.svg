<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2020" viewBox="0 0 1100 2020" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4f63"/></marker>
    <style>
      .auto  { fill: #e7f0ff; stroke: #3a63c8; stroke-width: 1.6; }
      .input { fill: #fff1dc; stroke: #e08600; stroke-width: 2; }
      .stop  { fill: #ffe5e5; stroke: #d03030; stroke-width: 1.6; }
      .done  { fill: #e3f6e8; stroke: #2f9e57; stroke-width: 2; }
      .link  { fill: #f1ebff; stroke: #7650c8; stroke-width: 2; }
      .band  { fill: #eef0f5; }
      .note  { fill: #fbfbfb; stroke: #9aa0ad; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .ln    { stroke: #4a4f63; stroke-width: 1.7; fill: none; marker-end: url(#ah); }
      .lnd   { stroke: #4a4f63; stroke-width: 1.5; fill: none; marker-end: url(#ah); stroke-dasharray: 6 4; }
      .tie   { stroke: #9aa0ad; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .ti    { font-size: 24px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .sub   { font-size: 14px; fill: #4a4f63; text-anchor: middle; }
      .bt    { font-size: 16px; font-weight: bold; fill: #1d2140; }
      .h     { font-size: 15.5px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .b     { font-size: 13.5px; fill: #2b2f45; text-anchor: middle; }
      .s     { font-size: 11.5px; fill: #7a7f8f; text-anchor: middle; }
      .lb    { font-size: 13px; font-weight: bold; fill: #b04a00; text-anchor: middle; }
      .lg    { font-size: 13px; fill: #2b2f45; }
      .nl    { font-size: 12.5px; fill: #4a4f63; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1100" height="2020" fill="#ffffff"/>

  <!-- 제목 · 범례 -->
  <text class="ti" x="550" y="42">auto_setup — 한눈에 보는 흐름</text>
  <text class="sub" x="550" y="68">AWX 노드정보 등록이 끝나면 넘어와, OS 설치 완료를 기다렸다가 설정 체크까지 자동으로 진행합니다. 주황색(⌨)은 작업자가 직접 하는 곳입니다.</text>
  <rect class="auto"  x="170" y="86" width="26" height="18" rx="4"/><text class="lg" x="203" y="100">자동 처리</text>
  <rect class="input" x="285" y="86" width="26" height="18" rx="4"/><text class="lg" x="318" y="100">⌨ 작업자 입력·선택</text>
  <rect class="stop"  x="465" y="86" width="26" height="18" rx="4"/><text class="lg" x="498" y="100">중단 · 주의</text>
  <rect class="done"  x="590" y="86" width="26" height="18" rx="4"/><text class="lg" x="623" y="100">완료</text>
  <rect class="note"  x="675" y="86" width="26" height="18" rx="4"/><text class="lg" x="708" y="100">보충 설명</text>
  <rect class="link"  x="795" y="86" width="26" height="18" rx="4"/><text class="lg" x="828" y="100">AWX 흐름도와 연결</text>

  <!-- ===================== 0단계 ===================== -->
  <rect class="band" x="20" y="124" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="147">0단계 · 연결 — AWX 노드정보 등록이 끝나면 자동으로 넘어옴</text>
  <text class="nl" x="1064" y="146" style="text-anchor:end">awx_script/workflow.svg 4단계 [14-1]</text>

  <rect class="link" x="270" y="176" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="198">AWX 01 : 등록이 성공하면 작업(job)을 auto_setup 에 전달</text>
  <text class="b" x="550" y="218">작업자(user) · 시각 · 호스트 목록 · 그룹(yml) 정보를 파일 하나로 남김</text>
  <text class="s" x="550" y="238">[14-1] 01.AWX_nodeinfo_V2.sh → os8_mgmt 의 queue/&lt;시각&gt;_&lt;user&gt;_&lt;pid&gt;.job</text>
  <path class="tie" d="M270 215 H252"/>
  <rect class="note" x="20" y="172" width="232" height="86" rx="8"/>
  <text class="nl" x="136" y="194">01 을 어디서 돌렸나</text>
  <text class="nl" x="136" y="214">os8_mgmt : 로컬 queue 에 바로</text>
  <text class="nl" x="136" y="232">os6_mgmt : gossh 로 os8_mgmt</text>
  <text class="nl" x="136" y="250">queue 에 전송 (auto_setup_host)</text>
  <path class="tie" d="M830 215 H848"/>
  <rect class="note" x="848" y="186" width="232" height="58" rx="8"/>
  <text class="nl" x="964" y="210">전달이 실패해도 AWX 등록</text>
  <text class="nl" x="964" y="230">결과에는 영향 없음 (경고만)</text>
  <path class="ln" d="M550 254 V324"/>

  <!-- ===================== 1단계 ===================== -->
  <rect class="band" x="20" y="272" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="295">1단계 · 접수 — 데몬이 작업을 받아 감시 준비</text>
  <text class="nl" x="1064" y="294" style="text-anchor:end">auto_setup 데몬 (os8_mgmt 에만 상주)</text>

  <rect class="auto" x="270" y="324" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="346">데몬이 queue 를 5초마다 수거 → 작업(job) 만들기</text>
  <text class="b" x="550" y="366">jobs/&lt;jobid&gt;.json 에 서버별 진행 단계를 기록하며 감시 시작</text>
  <text class="s" x="550" y="386">cron 이 매분 auto_setup ensure 로 데몬이 살아 있는지 확인 (죽어 있으면 다시 띄움)</text>
  <path class="ln" d="M550 402 V426"/>

  <rect class="auto" x="270" y="426" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="448">DNS 조회 · 경로 정하기</text>
  <text class="b" x="550" y="468">os8_mgmt 에서 ping 이 되면 local, 안 되면 os6_mgmt 경유(os6)</text>
  <text class="b" x="550" y="487">설치 중 os8 은 무응답 · os6 는 응답하면 그때 os6 로 자동 전환</text>
  <path class="tie" d="M270 465 H252"/>
  <rect class="note" x="20" y="430" width="232" height="70" rx="8"/>
  <text class="nl" x="136" y="452">os6 경유 = os6_mgmt 가</text>
  <text class="nl" x="136" y="470">대신 ping · 준비확인 ·</text>
  <text class="nl" x="136" y="488">체크를 해 줌</text>
  <path class="ln" d="M550 504 V528"/>

  <rect class="auto" x="270" y="528" width="560" height="62" rx="10"/>
  <text class="h" x="550" y="550">LDAP 설정 백업 (지금 응답하는 서버만)</text>
  <text class="b" x="550" y="570">설치 전 LDAP 설정을 백업 → 설치가 끝난 뒤 비교에 사용</text>
  <text class="s" x="550" y="584">ldapbak/&lt;jobid&gt;/&lt;host&gt;/ (0700 / 0600)</text>
  <path class="ln" d="M550 590 V666"/>

  <!-- ===================== 2단계 ===================== -->
  <rect class="band" x="20" y="614" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="637">2단계 · 감시 — OS 설치가 끝날 때까지 기다리기</text>
  <text class="nl" x="1064" y="636" style="text-anchor:end">ping 10초 · 준비확인 30초</text>

  <rect class="auto" x="270" y="666" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="688">ping 10초마다 → 응답이 끊기면 '설치 시작'으로 표시</text>
  <text class="b" x="550" y="708">준비확인 30초마다 : gossh -pm 으로 uptime 조회 (한 번에 최대 60초)</text>
  <text class="s" x="550" y="728">anaconda(설치 화면)가 보이면 '설치중' · os8 무응답이면 os6_mgmt 경유로 다시 확인</text>
  <path class="ln" d="M550 744 V768"/>

  <rect class="auto" x="270" y="768" width="560" height="62" rx="10"/>
  <text class="h" x="550" y="790">READY ? — 설치가 끝나고 새로 부팅됐나</text>
  <text class="b" x="550" y="811">응답함 · anaconda 아님 · 부팅 후 시간(uptime) &lt; 전달 후 지난 시간</text>
  <path class="lnd" d="M270 799 H236 V705 H268"/>
  <text class="nl" x="180" y="744">아니오 :</text>
  <text class="nl" x="180" y="762">계속 감시</text>
  <path class="ln" d="M830 799 H866"/>
  <rect class="stop" x="866" y="770" width="214" height="58" rx="8"/>
  <text class="b" x="973" y="794">60분 넘게 READY 안 됨</text>
  <text class="b" x="973" y="813">→ '정체' 표시 (감시는 계속)</text>
  <path class="ln" d="M550 830 V922"/><text class="lb" x="566" y="852">예</text>

  <!-- ===================== 3단계 ===================== -->
  <rect class="band" x="20" y="870" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="893">3단계 · 체크 — 설정 체크스크립트 자동 실행</text>
  <text class="nl" x="1064" y="892" style="text-anchor:end">config_check.sh -auto</text>

  <rect class="auto" x="270" y="922" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="944">LDAP 비교 · 다르면 복원</text>
  <text class="b" x="550" y="964">새 OS 의 LDAP 설정(binddn)을 1단계 백업과 비교</text>
  <text class="b" x="550" y="983">다르면 공유 경로를 통해 백업을 복원하고 LDAP 서비스 재시작</text>
  <path class="tie" d="M830 961 H848"/>
  <rect class="note" x="848" y="932" width="232" height="58" rx="8"/>
  <text class="nl" x="964" y="956">같거나 백업이 없으면</text>
  <text class="nl" x="964" y="974">건드리지 않고 다음으로</text>
  <path class="ln" d="M550 1000 V1024"/>

  <rect class="auto" x="270" y="1024" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1046">서버를 묶어서 체크 실행 (한 번에 한 작업씩)</text>
  <text class="b" x="550" y="1066">모두 READY 면 바로 · 아니면 7분 대기, 늦게 온 서버는 3분 묶음</text>
  <text class="s" x="550" y="1086">os_check_sh -auto &lt;user&gt; &lt;목록&gt; → runs/&lt;code&gt;/</text>
  <path class="tie" d="M270 1063 H252"/>
  <rect class="note" x="20" y="1020" width="232" height="86" rx="8"/>
  <text class="nl" x="136" y="1042">config_check.sh 가 -auto 로</text>
  <text class="nl" x="136" y="1060">질문 없이 설정 체크</text>
  <text class="nl" x="136" y="1078">→ 설정 수정 → 다시 체크</text>
  <text class="nl" x="136" y="1096">(작업자 입력 없음)</text>
  <path class="ln" d="M550 1102 V1126"/>

  <rect class="auto" x="270" y="1126" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1148">2차 체크 (os6_mgmt 를 설정한 경우)</text>
  <text class="b" x="550" y="1168">os8 에서 접속이 안 됐거나 FAIL 인 서버만 os6_mgmt 에서 한 번 더</text>
  <text class="s" x="550" y="1188">결과를 runs/&lt;code&gt;/second/ 로 회수</text>
  <path class="tie" d="M830 1165 H848"/>
  <rect class="note" x="848" y="1146" width="232" height="40" rx="8"/>
  <text class="nl" x="964" y="1171">대상이 없으면 건너뜀</text>
  <path class="ln" d="M550 1204 V1280"/>

  <!-- ===================== 4단계 ===================== -->
  <rect class="band" x="20" y="1228" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1251">4단계 · 결과 — 결과 코드와 완료 처리</text>
  <text class="nl" x="1064" y="1250" style="text-anchor:end">codes/&lt;code&gt;.txt</text>

  <rect class="auto" x="270" y="1280" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1302">결과 코드(code) 파일 만들기</text>
  <text class="b" x="550" y="1322">결과 리포트 · FAIL / NO FAIL · LDAP · Splunk · 커널 요약 · 2차 결과</text>
  <text class="s" x="550" y="1342">리포트가 없으면 원인 안내와 체크스크립트 출력의 마지막 줄을 함께 표시</text>
  <path class="ln" d="M550 1358 V1382"/>

  <rect class="auto" x="270" y="1382" width="560" height="62" rx="10"/>
  <text class="h" x="550" y="1404">완료 처리 : 1차 OK 또는 2차 OK 인 서버</text>
  <text class="b" x="550" y="1424">완료되지 않은 서버는 2단계 감시로 돌아감 (wall 알림은 기본 꺼짐)</text>
  <path class="tie" d="M270 1413 H252"/>
  <rect class="note" x="20" y="1372" width="232" height="82" rx="8"/>
  <text class="nl" x="136" y="1394">config_check 를 따로 돌려</text>
  <text class="nl" x="136" y="1412">먼저 끝난 서버도 완료기록</text>
  <text class="nl" x="136" y="1430">(done/&lt;host&gt;)으로 인정</text>
  <text class="nl" x="136" y="1446">수동 : auto_setup done</text>
  <path class="ln" d="M550 1444 V1468"/>

  <rect class="done" x="410" y="1468" width="280" height="38" rx="19"/>
  <text class="h" x="550" y="1493">모두 완료 → jobs/done 으로 이동</text>
  <path class="tie" d="M690 1487 H848"/>
  <rect class="note" x="848" y="1458" width="232" height="58" rx="8"/>
  <text class="nl" x="964" y="1482">남은 서버가 있으면 무기한 감시</text>
  <text class="nl" x="964" y="1500">(auto_setup cancel 로 종료)</text>

  <!-- ===================== 작업자 화면 ===================== -->
  <rect class="band" x="20" y="1534" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1557">언제든 · 작업자 화면 — 진행 상황 보기와 수동 작업</text>
  <text class="nl" x="1064" y="1556" style="text-anchor:end">auto_setup [-user 이름] · os6_mgmt 에서도 같은 화면</text>

  <rect class="input" x="170" y="1586" width="760" height="62" rx="10"/>
  <text class="h" x="550" y="1608">⌨ 상태 화면 : 화면 1 작업·그룹 → Enter → 화면 2 서버 표</text>
  <text class="b" x="550" y="1629">r 새로고침 · f 정체·실패만 · a 전체 보기 (-user 일 때는 전체 user 보기) · ? 도움말 · q 종료</text>
  <path class="ln" d="M450 1648 V1660 H295 V1676"/>
  <path class="ln" d="M650 1648 V1660 H805 V1676"/>

  <rect class="input" x="60" y="1676" width="470" height="96" rx="10"/>
  <text class="h" x="295" y="1698">⌨ h 호스트 작업 (화면 2)</text>
  <text class="b" x="295" y="1718">c 체크+수정 · t 체크만 · g 재확인</text>
  <text class="b" x="295" y="1737">d 수동 완료 · v 결과 보기</text>
  <text class="s" x="295" y="1758">요청을 남기면 데몬이 5초 안에 수거해 3단계와 같은 순서로 실행</text>

  <rect class="input" x="570" y="1676" width="470" height="96" rx="10"/>
  <text class="h" x="805" y="1698">⌨ w AWX</text>
  <text class="b" x="805" y="1718">1 AWX 실행 : 01 을 이 터미널에서 실행 (프로파일 선택)</text>
  <text class="b" x="805" y="1737">2 신규 설치 양식 : hostname ip mac → 템플릿 → DNS 점검</text>
  <text class="s" x="805" y="1758">저장 후 01 실행 — 프로파일을 고르면 nodeinfo N, 안 고르면 일반 실행</text>

  <rect class="input" x="60" y="1790" width="470" height="78" rx="10"/>
  <text class="h" x="295" y="1812">⌨ m 변경 작업</text>
  <text class="b" x="295" y="1832">IP 변경 · LDAP 변경 · IP+LDAP · 원복 · auto.appl 원복</text>
  <text class="s" x="295" y="1852">conf enable_* 또는 --admin 일 때 · 미리보기 후 yes 로 확인</text>

  <rect class="input" x="570" y="1790" width="470" height="78" rx="10"/>
  <text class="h" x="805" y="1812">⌨ s gossh 작업 기록</text>
  <text class="b" x="805" y="1832">호스트 붙여넣기 → /tmp/auto_setup/lists/&lt;3자리&gt; → gossh</text>
  <text class="s" x="805" y="1852">user 별 기록·검색·재실행 · 1000대 이하는 os8 → 접속불가만 os6</text>

  <rect class="input" x="60" y="1886" width="470" height="62" rx="10"/>
  <text class="h" x="295" y="1908">⌨ x 체크스크립트 단독 실행</text>
  <text class="b" x="295" y="1928">user · 서버 입력 → t / c 선택 → 결과 (기록은 남기지 않음)</text>

  <rect class="link" x="570" y="1886" width="470" height="62" rx="10"/>
  <text class="h" x="805" y="1908">w 의 1 · 2 는 AWX 흐름도 1단계로 이어짐</text>
  <text class="b" x="805" y="1928">awx_script/workflow.svg — 등록이 끝나면 다시 0단계로</text>
  <path class="lnd" d="M1040 1724 H1062 V1917 H1042"/>

  <text class="s" x="1080" y="1990" style="text-anchor:end">※ 설정이 실제로 바뀌는 작업(c 체크+수정 · m 변경)은 완료 후 임의의 서버 몇 대를 직접 확인하세요.</text>
  <text class="s" x="1080" y="2008" style="text-anchor:end">명령·키별 자세한 흐름은 docs/svg/ 를 참고하세요.</text>
</svg>
