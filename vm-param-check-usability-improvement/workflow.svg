<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1509" viewBox="0 0 1100 1509" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4f63"/></marker>
    <style>
      .auto  { fill: #e7f0ff; stroke: #3a63c8; stroke-width: 1.6; }
      .input { fill: #fff1dc; stroke: #e08600; stroke-width: 2; }
      .stop  { fill: #ffe5e5; stroke: #d03030; stroke-width: 1.6; }
      .done  { fill: #e3f6e8; stroke: #2f9e57; stroke-width: 2; }
      .link  { fill: #f1ebff; stroke: #7650c8; stroke-width: 2; }
      .band  { fill: #eef0f5; }
      .note  { fill: #fbfbfb; stroke: #9aa0ad; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .ln    { stroke: #4a4f63; stroke-width: 1.7; fill: none; marker-end: url(#ah); }
      .lnd   { stroke: #4a4f63; stroke-width: 1.5; fill: none; marker-end: url(#ah); stroke-dasharray: 6 4; }
      .tie   { stroke: #9aa0ad; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .ti    { font-size: 24px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .sub   { font-size: 14px; fill: #4a4f63; text-anchor: middle; }
      .bt    { font-size: 16px; font-weight: bold; fill: #1d2140; }
      .h     { font-size: 15.5px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .b     { font-size: 13.5px; fill: #2b2f45; text-anchor: middle; }
      .s     { font-size: 11.5px; fill: #7a7f8f; text-anchor: middle; }
      .lb    { font-size: 13px; font-weight: bold; fill: #b04a00; text-anchor: middle; }
      .lg    { font-size: 13px; fill: #2b2f45; }
      .nl    { font-size: 12.5px; fill: #4a4f63; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1100" height="1509" fill="#ffffff"/>

  <path class="ln" d="M550 280 V304"/>
  <path class="ln" d="M550 422 V446"/>
  <path class="ln" d="M550 504 V586"/>
  <path class="ln" d="M550 664 V688"/>
  <path class="ln" d="M550 786 V810"/>
  <path class="ln" d="M550 888 V970"/>
  <path class="ln" d="M550 1068 V1092"/>
  <path class="ln" d="M830 1121 H866"/>
  <path class="ln" d="M550 1150 V1183"/>
  <path class="ln" d="M830 1222 H866"/>
  <path class="ln" d="M550 1261 V1285"/>
  <path class="ln" d="M550 1343 V1367"/>
  <text class="ti" x="550" y="42">vm-param-check — 체크 → 교정 → 재검증</text>
  <text class="sub" x="550" y="68">VM 설정값이 스펙(기대값)과 같은지 체크하고, -fix 면 게이트·확인을 거쳐 고친 뒤 다시 체크합니다.</text>
  <rect class="auto" x="167" y="86" width="26" height="18" rx="4"/><text class="lg" x="200" y="100">자동 처리</text>
  <rect class="input" x="282" y="86" width="26" height="18" rx="4"/><text class="lg" x="315" y="100">⌨ 작업자 입력·선택</text>
  <rect class="stop" x="461" y="86" width="26" height="18" rx="4"/><text class="lg" x="494" y="100">중단 · 주의</text>
  <rect class="done" x="587" y="86" width="26" height="18" rx="4"/><text class="lg" x="620" y="100">완료</text>
  <rect class="note" x="672" y="86" width="26" height="18" rx="4"/><text class="lg" x="705" y="100">보충 설명</text>
  <rect class="link" x="787" y="86" width="26" height="18" rx="4"/><text class="lg" x="820" y="100">다른 흐름도와 연결</text>

  <rect class="band" x="20" y="130" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="153">1단계 · 실행과 기대값</text>
  <text class="nl" x="1064" y="152" style="text-anchor:end">01.vm_setting_check_insert.sh 또는 직접 실행</text>
  <rect class="input" x="270" y="182" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="204">⌨ 01.vm_setting_check_insert.sh [-u user] 또는 ./vm-param-check</text>
  <text class="b" x="550" y="224">비밀번호 : ../../secret 암호 파일 → 직접 입력</text>
  <text class="b" x="550" y="244">-fromSetup : vm_setup 의 run_&lt;user&gt;/check_specs.txt 그대로</text>
  <text class="s" x="550" y="264">단독 실행은 &lt;user&gt;.txt + 스펙 폴더명 (run_&lt;user&gt;/ 기록은 보지 않음)</text>
  <rect class="auto" x="270" y="304" width="560" height="118" rx="10"/>
  <text class="h" x="550" y="326">기대값 정하기 — 직접 준 옵션이 항상 우선</text>
  <text class="b" x="550" y="346">옵션 직접 : -cpu -mem -disk -cores -numa -shares-ev01 …</text>
  <text class="b" x="550" y="366">-specRoot + -specFolder : 대상 VM 전부에 그 스펙</text>
  <text class="b" x="550" y="386">-specRoot 만 : VM 의 vCenter 폴더명 → 스펙 자동 매칭</text>
  <text class="s" x="550" y="406">Task 폴더 등 CAE 규칙이 아니면 포트그룹 이름으로 추정 → 실패 시 입력</text>
  <path class="tie" d="M270 363 H252"/>
  <rect class="note" x="20" y="309" width="232" height="108" rx="8"/>
  <text class="nl" x="136" y="331">스펙 제외 키 (ev 별)</text>
  <text class="nl" x="136" y="349">all_del_* / evNN_del_*</text>
  <text class="nl" x="136" y="367">→ DelGroups 로</text>
  <text class="nl" x="136" y="385">제외 ev 목록 만들어</text>
  <text class="nl" x="136" y="403">[스펙적용] 제외: 줄 출력</text>
  <rect class="input" x="270" y="446" width="560" height="58" rx="10"/>
  <text class="h" x="550" y="468">⌨ 매칭 결과 확인 (y/N)</text>
  <text class="b" x="550" y="488">-yes 면 생략 · N 이면 아무것도 안 하고 종료</text>

  <rect class="band" x="20" y="534" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="557">2단계 · 조회와 체크</text>
  <rect class="auto" x="270" y="586" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="608">2단계 조회 — vCenter 마다 동시에</text>
  <text class="b" x="550" y="628">① 전체 VM 이름만 가볍게 → ② 대상 VM 만 무거운 속성</text>
  <text class="b" x="550" y="648">못 찾은 대상 · 접속 실패 vCenter 는 시작과 끝에 경고</text>
  <rect class="auto" x="270" y="688" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="710">항목별 체크 (evaluateVM) — VM 이름의 evNN 으로 그룹</text>
  <text class="b" x="550" y="730">HugePage 고정값 · 토폴로지 · preferHT · 하드웨어 · PCI</text>
  <text class="b" x="550" y="750">호스트 전원정책 · 네트워크 · affinity</text>
  <text class="s" x="550" y="770">스펙의 tag-* 는 체크하지 않음</text>
  <path class="tie" d="M830 737 H848"/>
  <rect class="note" x="848" y="683" width="232" height="108" rx="8"/>
  <text class="nl" x="964" y="705">값이 없어야 OK (없음)</text>
  <text class="nl" x="964" y="723">-expectNoLpage / -NoAffinity</text>
  <text class="nl" x="964" y="741">= 모든 VM</text>
  <text class="nl" x="964" y="759">스펙 제외 키</text>
  <text class="nl" x="964" y="777">= 그 ev 의 VM 만</text>
  <rect class="done" x="270" y="810" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="832">콘솔 요약 + CSV 2종</text>
  <text class="b" x="550" y="852">상세 (-onlyFail 이면 문제 VM 만) · _summary (PASS 포함 전부)</text>
  <text class="b" x="550" y="872">-user 접미사 · -out 이름</text>

  <rect class="band" x="20" y="918" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="941">3단계 · 교정 (-fix 일 때만)</text>
  <text class="nl" x="1064" y="940" style="text-anchor:end">runFix</text>
  <rect class="auto" x="270" y="970" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="992">교정 계획 (BuildPlan)</text>
  <text class="b" x="550" y="1012">자동 교정 : CPU · 토폴로지 · affinity · HugePage · preferHT 등</text>
  <text class="b" x="550" y="1032">수동 조치 : 메모리 · 디스크 · Shares · 네트워크 · 전원정책</text>
  <text class="s" x="550" y="1052">&quot;(없음)&quot; 기대값 (제외 항목) 도 수동 조치로 분류</text>
  <rect class="auto" x="270" y="1092" width="560" height="58" rx="10"/>
  <text class="h" x="550" y="1114">게이트 — 스펙별 그룹 동질성 + 대상 전원 OFF</text>
  <text class="b" x="550" y="1134">ev 짝(VM 대수)이 안 맞으면 경고만</text>
  <text class="lb" x="848" y="1114">실패</text>
  <rect class="stop" x="866" y="1082" width="214" height="77" rx="8"/>
  <text class="b" x="973" y="1106">게이트 실패 →</text>
  <text class="b" x="973" y="1126">아무것도 바꾸지 않고</text>
  <text class="b" x="973" y="1144">중단</text>
  <rect class="input" x="270" y="1183" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1205">⌨ dry-run 출력 → y/N</text>
  <text class="b" x="550" y="1225">VM 별 변경 내역 · 수동 조치는 개수만</text>
  <text class="b" x="550" y="1245">-yes 여도 -fix 확인은 항상 물음</text>
  <text class="lb" x="848" y="1215">N</text>
  <rect class="stop" x="866" y="1193" width="214" height="58" rx="8"/>
  <text class="b" x="973" y="1217">N → 취소</text>
  <text class="b" x="973" y="1236">(변경 없음)</text>
  <rect class="auto" x="270" y="1285" width="560" height="58" rx="10"/>
  <text class="h" x="550" y="1307">적용 — VM 당 Reconfigure 1회, 워커풀 병렬</text>
  <text class="b" x="550" y="1327">-fixConcurrency (기본 20) · 실패한 VM 이 있으면 재검증 생략</text>
  <rect class="done" x="270" y="1367" width="560" height="58" rx="10"/>
  <text class="h" x="550" y="1389">재검증 — 교정한 VM 만 다시 조회해 같은 판정</text>
  <text class="b" x="550" y="1409">_recheck_&lt;시각&gt;.csv (상세 · 요약) · 남은 FAIL 수 안내</text>
  <text class="s" x="1080" y="1467" style="text-anchor:end">※ -fix 로 바꾼 뒤에는 임의의 VM 몇 대를 직접 확인하세요.</text>
  <text class="s" x="1080" y="1485" style="text-anchor:end">자세한 흐름 : ../docs/svg/ (check_insert_01 · vm_param_check · vm_param_check_fix)</text>
</svg>
