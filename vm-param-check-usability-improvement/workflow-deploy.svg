<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="976" viewBox="0 0 1100 976" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4f63"/></marker>
    <style>
      .auto  { fill: #e7f0ff; stroke: #3a63c8; stroke-width: 1.6; }
      .input { fill: #fff1dc; stroke: #e08600; stroke-width: 2; }
      .stop  { fill: #ffe5e5; stroke: #d03030; stroke-width: 1.6; }
      .done  { fill: #e3f6e8; stroke: #2f9e57; stroke-width: 2; }
      .link  { fill: #f1ebff; stroke: #7650c8; stroke-width: 2; }
      .band  { fill: #eef0f5; }
      .note  { fill: #fbfbfb; stroke: #9aa0ad; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .ln    { stroke: #4a4f63; stroke-width: 1.7; fill: none; marker-end: url(#ah); }
      .lnd   { stroke: #4a4f63; stroke-width: 1.5; fill: none; marker-end: url(#ah); stroke-dasharray: 6 4; }
      .tie   { stroke: #9aa0ad; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .ti    { font-size: 24px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .sub   { font-size: 14px; fill: #4a4f63; text-anchor: middle; }
      .bt    { font-size: 16px; font-weight: bold; fill: #1d2140; }
      .h     { font-size: 15.5px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .b     { font-size: 13.5px; fill: #2b2f45; text-anchor: middle; }
      .s     { font-size: 11.5px; fill: #7a7f8f; text-anchor: middle; }
      .lb    { font-size: 13px; font-weight: bold; fill: #b04a00; text-anchor: middle; }
      .lg    { font-size: 13px; fill: #2b2f45; }
      .nl    { font-size: 12.5px; fill: #4a4f63; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1100" height="976" fill="#ffffff"/>

  <path class="ln" d="M550 240 V264"/>
  <path class="ln" d="M830 313 H866"/>
  <path class="ln" d="M550 362 V386"/>
  <path class="ln" d="M550 644 V668"/>
  <path class="ln" d="M550 726 V750"/>
  <path class="ln" d="M830 789 H866"/>
  <path class="ln" d="M550 828 V852"/>
  <text class="ti" x="550" y="42">vm-param-check — 배포 · 갱신</text>
  <text class="sub" x="550" y="68">인터넷이 되는 서버는 update_deploy.sh, 폐쇄망 서버는 업데이트 패키지(update.sh)로 실행 파일만 바꿉니다.</text>
  <rect class="auto" x="253" y="86" width="26" height="18" rx="4"/><text class="lg" x="286" y="100">자동 처리</text>
  <rect class="input" x="368" y="86" width="26" height="18" rx="4"/><text class="lg" x="401" y="100">⌨ 작업자 실행</text>
  <rect class="stop" x="513" y="86" width="26" height="18" rx="4"/><text class="lg" x="546" y="100">중단 (변경 없음)</text>
  <rect class="done" x="673" y="86" width="26" height="18" rx="4"/><text class="lg" x="706" y="100">완료</text>
  <rect class="note" x="758" y="86" width="26" height="18" rx="4"/><text class="lg" x="791" y="100">보충 설명</text>

  <rect class="band" x="20" y="130" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="153">A · 인터넷 되는 서버 — 제자리 갱신</text>
  <text class="nl" x="1064" y="152" style="text-anchor:end">update_deploy.sh</text>
  <rect class="input" x="270" y="182" width="560" height="58" rx="10"/>
  <text class="h" x="550" y="204">⌨ git clone --branch vm-param-check-standalone</text>
  <text class="b" x="550" y="224">도구 폴더만 담은 독립 브랜치 (vendor/ 가 실제 파일로 들어 있음)</text>
  <path class="tie" d="M830 211 H848"/>
  <rect class="note" x="848" y="166" width="232" height="90" rx="8"/>
  <text class="nl" x="964" y="188">master 는 vendor 를 공유</text>
  <text class="nl" x="964" y="206">폴더에 두고 링크하므로</text>
  <text class="nl" x="964" y="224">도구 폴더만 복사하면</text>
  <text class="nl" x="964" y="242">빌드가 안 됨</text>
  <rect class="input" x="270" y="264" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="286">⌨ bash update_deploy.sh -n [경로] → bash update_deploy.sh [경로]</text>
  <text class="b" x="550" y="306">[1/5] 새 버전 받기 → [2/5] 임시 폴더에서 빌드 확인</text>
  <text class="b" x="550" y="326">[3/5] 바뀔 내용 → [4/5] 백업 → [5/5] 반영</text>
  <text class="s" x="550" y="346">-n (dry-run) 은 3단계까지만 보여주고 종료</text>
  <text class="lb" x="848" y="306">실패</text>
  <rect class="stop" x="866" y="284" width="214" height="58" rx="8"/>
  <text class="b" x="973" y="308">빌드 실패 →</text>
  <text class="b" x="973" y="327">배포 경로는 그대로</text>
  <rect class="done" x="270" y="386" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="408">반영 완료 — 사용자 파일 보존</text>
  <text class="b" x="550" y="428">01.* · vcenter.txt · SPEC_DIR/ · *.csv · *.log 는 덮어쓰지 않음</text>
  <text class="b" x="550" y="448">템플릿이 다르면 &lt;이름&gt;.new 로 옆에 둠</text>
  <text class="s" x="550" y="468">이전 파일 : &lt;배포경로&gt;.update_backup.&lt;시각&gt;/</text>

  <rect class="band" x="20" y="514" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="537">B · 폐쇄망 서버 — 업데이트 패키지</text>
  <text class="nl" x="1064" y="536" style="text-anchor:end">make_update_package.sh → update.sh</text>
  <rect class="input" x="270" y="566" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="588">⌨ (빌드 서버) bash make_update_package.sh</text>
  <text class="b" x="550" y="608">정적 빌드 (CGO_ENABLED=0) → payload/ + SHA256SUMS + VERSION.txt</text>
  <text class="b" x="550" y="628">dist/vm-param-check-update-&lt;날짜&gt;.tar.gz</text>
  <rect class="input" x="270" y="668" width="560" height="58" rx="10"/>
  <text class="h" x="550" y="690">⌨ USB / nfs 로 옮겨 tar xzf → bash update.sh -n &lt;디렉토리&gt;</text>
  <text class="b" x="550" y="710">미리보기 : 바뀌는 파일만 보여줌</text>
  <rect class="auto" x="270" y="750" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="772">bash update.sh &lt;디렉토리&gt;</text>
  <text class="b" x="550" y="792">① SHA256SUMS 확인 → ② 다른 파일만 고름</text>
  <text class="b" x="550" y="812">③ 새 실행 파일 -demo 시험 → ④ 백업 후 교체</text>
  <text class="lb" x="848" y="782">실패</text>
  <rect class="stop" x="866" y="760" width="214" height="58" rx="8"/>
  <text class="b" x="973" y="784">체크섬 · -demo 실패 →</text>
  <text class="b" x="973" y="803">아무것도 바꾸지 않음</text>
  <rect class="done" x="270" y="852" width="560" height="58" rx="10"/>
  <text class="h" x="550" y="874">교체 완료 — 01.* · vcenter.txt · SPEC_DIR/ 는 건너뜀</text>
  <text class="b" x="550" y="894">백업 : &lt;디렉토리&gt;.update_backup.&lt;시각&gt;/</text>
  <text class="s" x="1080" y="952" style="text-anchor:end">자세한 흐름 : ../docs/svg/update_deploy.svg · update_package.svg</text>
</svg>
