{{define "content"}}
<h1>Phase 2 — vSwitch / 포트그룹 생성</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/phase2">
  <label>vCenter 자격증명
    <select name="credential_id" required>
      {{range .Credentials}}<option value="{{.ID}}">{{.Name}} ({{.VCenterIP}})</option>{{end}}
    </select>
  </label>
  <label>대상 vSwitch<input type="text" name="target_vswitch" value="vSwitch0" required></label>
  <label>포트그룹 설정 (한 줄에 "호스트 포트그룹명 VLAN번호")
    <textarea name="entries" rows="6" required placeholder="esxi01.lab.local PG-App 100&#10;esxi02.lab.local PG-App 100"></textarea>
  </label>
  <button type="submit">생성 실행</button>
</form>
{{end}}
