<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1240" width="960" height="1240" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <!-- HP 서버 관리망(iLO) USB 자동설정 흐름도 — 꽂고 → 파란불 → 뽑고 → 다음 서버 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.6}
      .usb{fill:#e0f2fe;stroke:#0369a1;stroke-width:1.6}
      .ilo{fill:#dcfce7;stroke:#15803d;stroke-width:1.6}
      .dec{fill:#fef9c3;stroke:#a16207;stroke-width:1.6}
      .warn{fill:#fee2e2;stroke:#b91c1c;stroke-width:1.6}
      .menu{fill:#ede9fe;stroke:#6d28d9;stroke-width:1.6}
      .uid{fill:#1d4ed8;stroke:#1e3a8a;stroke-width:1.6}
      .tb{font-size:15px;fill:#0f172a;text-anchor:middle;font-weight:700}
      .s{font-size:12.5px;fill:#334155;text-anchor:middle}
      .l{font-size:12.5px;fill:#475569}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .num{font-size:13px;fill:#ffffff;text-anchor:middle;font-weight:700}
    </style>
  </defs>
  <rect width="960" height="1240" fill="#f8fafc"/>
  <text x="480" y="38" class="tb" style="font-size:21px">HP 서버 관리망(iLO) IP·VLAN — USB 자동설정 흐름</text>
  <text x="480" y="62" class="s">키 입력 없음 · 꽂고 전원 ON → 파란불(UID) 켜지면 뽑고 다음 서버 · 나머지는 서버가 혼자 진행</text>

  <!-- 범례 -->
  <g transform="translate(40,82)">
    <rect x="0" y="0" width="16" height="12" class="usb"/><text x="22" y="11" class="l">USB 필요 구간</text>
    <rect x="130" y="0" width="16" height="12" class="ilo"/><text x="152" y="11" class="l">USB 없이 RAM에서 진행</text>
    <rect x="320" y="0" width="16" height="12" class="dec"/><text x="342" y="11" class="l">판단</text>
    <rect x="390" y="0" width="16" height="12" class="menu"/><text x="412" y="11" class="l">관리 메뉴(선택)</text>
    <rect x="530" y="0" width="16" height="12" class="warn"/><text x="552" y="11" class="l">오류</text>
    <rect x="600" y="0" width="16" height="12" class="uid"/><text x="622" y="11" class="l">작업자 신호(UID 파란불)</text>
  </g>

  <!-- USB 꽂힌 구간 -->
  <rect x="310" y="110" width="340" height="590" rx="14" fill="none" stroke="#0369a1" stroke-dasharray="6 5"/>
  <text x="662" y="128" class="l" style="fill:#0369a1;font-weight:700">USB 꽂혀 있는 구간</text>
  <text x="662" y="146" class="l" style="fill:#0369a1">(POST 2~5분 + 30초~1분)</text>

  <!-- 1 -->
  <rect x="330" y="120" width="300" height="56" rx="10" class="usb"/>
  <circle cx="346" cy="136" r="11" fill="#0369a1"/><text x="346" y="141" class="num">1</text>
  <text x="480" y="145" class="tb">USB 꽂고 전원 ON</text>
  <text x="480" y="165" class="s">F11 없이 부팅 순서대로 USB 자동 부팅</text>
  <line x1="480" y1="176" x2="480" y2="202" class="ln"/>

  <!-- 2 -->
  <rect x="330" y="204" width="300" height="56" rx="10" class="usb"/>
  <circle cx="346" cy="220" r="11" fill="#0369a1"/><text x="346" y="225" class="num">2</text>
  <text x="480" y="229" class="tb">부팅 이미지 전체를 RAM에 적재</text>
  <text x="480" y="249" class="s">이후 USB가 없어도 동작 (toram)</text>
  <line x1="480" y1="260" x2="480" y2="286" class="ln"/>

  <!-- 3 -->
  <rect x="330" y="288" width="300" height="56" rx="10" class="usb"/>
  <circle cx="346" cy="304" r="11" fill="#0369a1"/><text x="346" y="309" class="num">3</text>
  <text x="480" y="313" class="tb">3초 대기 → 입력 없으면 자동 진행</text>
  <text x="480" y="333" class="s">시리얼 읽기 · pool.csv 로드</text>
  <path d="M330,316 H252" class="ln"/>
  <text x="288" y="336" class="l" style="text-anchor:middle">아무 키</text>
  <rect x="40" y="290" width="208" height="72" rx="10" class="menu"/>
  <text x="144" y="314" class="tb">관리 메뉴 (선택)</text>
  <text x="144" y="334" class="s">[U] 취소 [G] 순번 이동</text>
  <text x="144" y="352" class="s">[L] 목록</text>
  <line x1="480" y1="344" x2="480" y2="370" class="ln"/>

  <!-- 4 decision -->
  <polygon points="480,372 600,414 480,456 360,414" class="dec"/>
  <circle cx="400" cy="400" r="11" fill="#a16207"/><text x="400" y="405" class="num">4</text>
  <text x="484" y="410" class="tb">이 시리얼이</text>
  <text x="484" y="428" class="tb">이미 USED?</text>
  <path d="M600,414 H790 V663 H632" class="ln"/>
  <text x="612" y="404" class="l">예</text>
  <text x="800" y="560" class="l">같은 값</text>
  <text x="800" y="578" class="l">자동 재적용</text>
  <text x="800" y="596" class="l">(순번 소모 없음,</text>
  <text x="800" y="614" class="l">6단계 건너뜀)</text>
  <line x1="480" y1="456" x2="480" y2="482" class="ln"/>
  <text x="488" y="474" class="l">아니오</text>

  <!-- 5 -->
  <rect x="330" y="484" width="300" height="48" rx="10" class="usb"/>
  <circle cx="346" cy="500" r="11" fill="#0369a1"/><text x="346" y="505" class="num">5</text>
  <text x="480" y="513" class="tb">다음 FREE 항목 선택</text>
  <line x1="480" y1="532" x2="480" y2="552" class="ln"/>
  <path d="M330,508 H150 V534" class="ln"/>
  <text x="190" y="500" class="l">FREE 없음</text>
  <rect x="50" y="536" width="200" height="46" rx="10" class="warn"/>
  <text x="150" y="556" class="tb">풀 소진 → 중단</text>
  <text x="150" y="574" class="s">UID 파란불 유지</text>

  <!-- 6 -->
  <rect x="330" y="554" width="300" height="62" rx="10" class="usb"/>
  <circle cx="346" cy="570" r="11" fill="#0369a1"/><text x="346" y="575" class="num">6</text>
  <text x="480" y="578" class="tb">USB에 먼저 기록 (예약)</text>
  <text x="480" y="598" class="s">USED + 시리얼 + 시각 · pointer+1</text>
  <text x="480" y="612" class="s" style="font-size:11.5px">history.log · .bak · sync → USB 쓰기 끝</text>
  <line x1="480" y1="616" x2="480" y2="636" class="ln"/>

  <!-- 7 UID -->
  <rect x="330" y="638" width="300" height="50" rx="10" class="uid"/>
  <circle cx="346" cy="654" r="11" fill="#ffffff"/><text x="346" y="659" class="num" style="fill:#1d4ed8">7</text>
  <text x="480" y="661" class="tb" style="fill:#ffffff">UID 파란불 ON = USB 빼세요</text>
  <text x="480" y="680" class="s" style="fill:#dbeafe">작업자: 뽑아서 다음 서버로 이동</text>
  <path d="M330,676 H270 V650 H252" class="ln" style="stroke:#1d4ed8;stroke-width:2.2"/>
  <rect x="40" y="624" width="208" height="54" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="144" y="647" class="tb" style="font-size:14px">다음 서버에서 1단계</text>
  <text x="144" y="666" class="s">USB 꽂고 전원 ON</text>
  <line x1="480" y1="688" x2="480" y2="724" class="ln"/>

  <!-- 서버 혼자 진행 구간 -->
  <rect x="310" y="712" width="340" height="250" rx="14" fill="none" stroke="#15803d" stroke-dasharray="6 5"/>
  <text x="662" y="980" class="l" style="fill:#15803d;font-weight:700">USB 없이 서버 혼자 진행</text>
  <text x="662" y="998" class="l" style="fill:#15803d">(작업자 대기 불필요)</text>

  <!-- 8 -->
  <rect x="330" y="726" width="300" height="62" rx="10" class="ilo"/>
  <circle cx="346" cy="742" r="11" fill="#15803d"/><text x="346" y="747" class="num">8</text>
  <text x="480" y="751" class="tb">iLO에 IP·VLAN 기록</text>
  <text x="480" y="771" class="s">hponcfg (MOD_NETWORK_SETTINGS)</text>
  <text x="480" y="785" class="s" style="font-size:11.5px">또는 ilorest EthernetInterface</text>
  <line x1="480" y1="788" x2="480" y2="812" class="ln"/>

  <!-- 9 -->
  <rect x="330" y="814" width="300" height="50" rx="10" class="ilo"/>
  <circle cx="346" cy="830" r="11" fill="#15803d"/><text x="346" y="835" class="num">9</text>
  <text x="480" y="838" class="tb">iLO 리셋 → 값 재조회 검증</text>
  <text x="480" y="856" class="s">IP / VLAN 일치 여부</text>
  <line x1="480" y1="864" x2="480" y2="892" class="ln"/>
  <text x="488" y="882" class="l">성공</text>

  <path d="M330,839 H150 V880" class="ln"/>
  <text x="190" y="831" class="l">실패</text>
  <rect x="40" y="882" width="220" height="66" rx="10" class="warn"/>
  <text x="150" y="904" class="tb">파란불 유지 + 화면 오류</text>
  <text x="150" y="923" class="s">재부팅 안 함</text>
  <text x="150" y="940" class="s">USB 다시 꽂으면 같은 값 재적용</text>

  <rect x="330" y="894" width="300" height="56" rx="10" class="box"/>
  <text x="480" y="918" class="tb">파란불 OFF → 서버 재부팅</text>
  <text x="480" y="938" class="s">USB 없으므로 정상 부팅 (반복 없음)</text>

  <!-- 10 -->
  <rect x="40" y="1024" width="880" height="80" rx="10" fill="#fef9c3" stroke="#a16207"/>
  <text x="60" y="1050" class="l" style="font-weight:700;fill:#0f172a;font-size:14px">10. 한 바퀴 끝난 뒤 점검</text>
  <text x="60" y="1074" class="l">• 파란불이 남은 서버 = 실패 → 그 서버에 USB 다시 꽂기</text>
  <text x="60" y="1094" class="l">• 노트북에 USB 꽂고 ilocfg.sh verify (USED IP 전체 ping) · ilocfg.sh list (순번·랙위치·시리얼 → 서버 앞 시리얼 태그와 대조)</text>

  <!-- 하단 요약 -->
  <rect x="40" y="1118" width="880" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="1144" class="l" style="font-weight:700;fill:#0f172a;font-size:14px">핵심 원칙</text>
  <text x="60" y="1168" class="l">• 기록(6) 먼저, 적용(8) 나중 → 파란불 이후 USB를 뽑아도 기록 손실 없음. 파란불 전에 뽑았으면 그 서버에 다시 꽂으면 됨</text>
  <text x="60" y="1190" class="l">• 사용한 항목은 지우지 않고 USED 표시 → 재할당 불가. 순서 착오는 점검(10)에서 찾아 undo / goto로 복구</text>
  <text x="60" y="1212" class="l">• F11 없는 자동 부팅은 부팅 순서에 달림: 빈 디스크 신규 서버는 대부분 가능, OS 설치 서버는 부팅 순서 변경 필요 (계획서 8장)</text>
</svg>
