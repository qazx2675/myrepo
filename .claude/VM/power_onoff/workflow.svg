<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .b{fill:#eef4ff;stroke:#4a6fa5;stroke-width:1.5}
      .g{fill:#fff4d6;stroke:#c08a00;stroke-width:1.5}
      .r{fill:#ffe5e5;stroke:#c0392b;stroke-width:1.5}
      .o{fill:#e6f6e6;stroke:#2e8b3d;stroke-width:1.5}
      .d{fill:#fff;stroke:#555;stroke-width:1.5}
      text{fill:#222} .s{font-size:12px;fill:#444}
      line,path.l{stroke:#555;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="900" height="1010" fill="#fff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">vm_power_onoff 작업 흐름</text>

  <rect class="b" x="300" y="45" width="300" height="38" rx="8"/><text x="450" y="69" text-anchor="middle">시작: vm_power_onoff</text>
  <line x1="450" y1="83" x2="450" y2="105" marker-end="url(#a)"/>
  <rect class="b" x="260" y="105" width="380" height="50" rx="8"/><text x="450" y="127" text-anchor="middle">conf 읽기 + 권한 검사</text><text x="450" y="145" text-anchor="middle" class="s">허용 경로(allowed_dir) 확인</text>
  <path class="l" d="M640 130 H780 V975" marker-end="url(#a)"/><text x="700" y="124" class="s">위반 → 오류(exit 1)</text>
  <line x1="450" y1="155" x2="450" y2="177" marker-end="url(#a)"/>
  <rect class="b" x="260" y="177" width="380" height="38" rx="8"/><text x="450" y="201" text-anchor="middle">user 선택 → on_off_&lt;user&gt;.txt 읽기</text>
  <line x1="450" y1="215" x2="450" y2="237" marker-end="url(#a)"/>
  <rect class="b" x="260" y="237" width="380" height="38" rx="8"/><text x="450" y="261" text-anchor="middle">vCenter 선택 → 비밀번호</text>
  <line x1="450" y1="275" x2="450" y2="297" marker-end="url(#a)"/>
  <rect class="b" x="220" y="297" width="460" height="38" rx="8"/><text x="450" y="321" text-anchor="middle">기능 선택: 1 Off / 2 순차 On / 3 일괄 On / 4 재부팅</text>
  <line x1="450" y1="335" x2="450" y2="357" marker-end="url(#a)"/>
  <rect class="b" x="260" y="357" width="380" height="38" rx="8"/><text x="450" y="381" text-anchor="middle">vCenter 에서 대상 VM 조회 (없음/중복 → 종료)</text>
  <line x1="450" y1="395" x2="450" y2="417" marker-end="url(#a)"/>
  <rect class="b" x="260" y="417" width="380" height="38" rx="8"/><text x="450" y="441" text-anchor="middle">계획표 출력 (-n 이면 여기서 종료)</text>
  <line x1="450" y1="455" x2="450" y2="477" marker-end="url(#a)"/>
  <path class="d" d="M450 477 L560 505 L450 533 L340 505 Z"/><text x="450" y="509" text-anchor="middle">VWP 해당 VM?</text>
  <path class="l" d="M340 505 H150 V560" marker-end="url(#a)"/><text x="245" y="498" class="s">예</text>
  <rect class="g" x="40" y="560" width="220" height="62" rx="8"/><text x="150" y="585" text-anchor="middle">경고 배너 + 6자리 코드</text><text x="150" y="604" text-anchor="middle" class="s">불일치 → 취소</text>
  <path class="l" d="M150 622 V660 H350" marker-end="url(#a)"/>
  <path class="l" d="M560 505 H600 V660 H550" marker-end="url(#a)"/><text x="570" y="498" class="s">아니오</text>
  <rect class="g" x="250" y="640" width="400" height="76" rx="8" transform="translate(0,20)"/>
  <text x="450" y="680" text-anchor="middle" font-weight="bold">안전장치 1~5단계</text>
  <text x="450" y="699" text-anchor="middle" class="s">코드 → Enter → 60초 VM 이름 입력 → YeS → 10초 카운트다운</text>
  <text x="450" y="717" text-anchor="middle" class="s">틀리거나 Ctrl+C → 취소(exit 1)</text>
  <path class="l" d="M650 700 H780" /><text x="700" y="694" class="s">취소</text>
  <line x1="450" y1="736" x2="450" y2="765" marker-end="url(#a)"/>

  <rect class="r" x="30" y="765" width="190" height="86" rx="8"/><text x="125" y="788" text-anchor="middle" font-weight="bold">1 Power Off</text><text x="125" y="807" text-anchor="middle" class="s">Guest 종료 (대상 전체 동시)</text><text x="125" y="823" text-anchor="middle" class="s">미종료 → YeS 확인 후</text><text x="125" y="839" text-anchor="middle" class="s">강제 PowerOff</text>
  <rect class="o" x="240" y="765" width="190" height="86" rx="8"/><text x="335" y="788" text-anchor="middle" font-weight="bold">3 일괄 Power On</text><text x="335" y="810" text-anchor="middle" class="s">대상 전체 동시 PowerOn</text><text x="335" y="826" text-anchor="middle" class="s">(OS 설치용)</text>
  <rect class="o" x="450" y="765" width="190" height="86" rx="8"/><text x="545" y="788" text-anchor="middle" font-weight="bold">4 재부팅</text><text x="545" y="810" text-anchor="middle" class="s">Off 완료 확인 →</text><text x="545" y="826" text-anchor="middle" class="s">대상 전체 동시 PowerOn</text>
  <rect class="g" x="660" y="765" width="210" height="86" rx="8"/><text x="765" y="788" text-anchor="middle" font-weight="bold">2 Power On (순차)</text><text x="765" y="808" text-anchor="middle" class="s">lpage BM: ev 단계별</text><text x="765" y="824" text-anchor="middle" class="s">같은 ev 번호 전체 동시 PowerOn</text><text x="765" y="840" text-anchor="middle" class="s">전부 부팅 완료 후 다음 ev</text>
  <text x="765" y="868" text-anchor="middle" class="s">lpage 미사용 BM: 안내 후 한 번에</text>
  <text x="765" y="884" text-anchor="middle" class="s">지연 시 단계당 c/s/q 한 번</text>
  <path class="l" d="M450 765 H125 V765"/>
  <line x1="125" y1="851" x2="125" y2="910"/><line x1="335" y1="851" x2="335" y2="910"/><line x1="545" y1="851" x2="545" y2="910"/><line x1="765" y1="890" x2="765" y2="910"/>
  <path class="l" d="M125 910 H765"/>
  <line x1="450" y1="910" x2="450" y2="935" marker-end="url(#a)"/>
  <rect class="b" x="230" y="935" width="440" height="38" rx="8"/><text x="450" y="959" text-anchor="middle">결과 표 + 실행 기록(run_&lt;user&gt;/) → 실패 있으면 exit 1</text>
  <rect class="r" x="690" y="975" width="180" height="26" rx="6"/><text x="780" y="993" text-anchor="middle" class="s">취소/오류 종료 (exit 1)</text>
</svg>
