<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="2572" viewBox="0 0 1100 2572" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4f63"/></marker>
    <style>
      .auto  { fill: #e7f0ff; stroke: #3a63c8; stroke-width: 1.6; }
      .input { fill: #fff1dc; stroke: #e08600; stroke-width: 2; }
      .stop  { fill: #ffe5e5; stroke: #d03030; stroke-width: 1.6; }
      .done  { fill: #e3f6e8; stroke: #2f9e57; stroke-width: 2; }
      .link  { fill: #f1ebff; stroke: #7650c8; stroke-width: 2; }
      .band  { fill: #eef0f5; }
      .note  { fill: #fbfbfb; stroke: #9aa0ad; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .ln    { stroke: #4a4f63; stroke-width: 1.7; fill: none; marker-end: url(#ah); }
      .lnd   { stroke: #4a4f63; stroke-width: 1.5; fill: none; marker-end: url(#ah); stroke-dasharray: 6 4; }
      .tie   { stroke: #9aa0ad; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .ti    { font-size: 24px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .sub   { font-size: 14px; fill: #4a4f63; text-anchor: middle; }
      .bt    { font-size: 16px; font-weight: bold; fill: #1d2140; }
      .h     { font-size: 15.5px; font-weight: bold; fill: #1d2140; text-anchor: middle; }
      .b     { font-size: 13.5px; fill: #2b2f45; text-anchor: middle; }
      .s     { font-size: 11.5px; fill: #7a7f8f; text-anchor: middle; }
      .lb    { font-size: 13px; font-weight: bold; fill: #b04a00; text-anchor: middle; }
      .lg    { font-size: 13px; fill: #2b2f45; }
      .nl    { font-size: 12.5px; fill: #4a4f63; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1100" height="2572" fill="#ffffff"/>

  <path class="ln" d="M550 260 V284"/>
  <path class="ln" d="M550 362 V386"/>
  <path class="ln" d="M550 464 V546"/>
  <path class="ln" d="M550 644 V668"/>
  <path class="ln" d="M550 766 V790"/>
  <path class="ln" d="M550 868 V892"/>
  <path class="ln" d="M550 990 V1014"/>
  <path class="ln" d="M830 1063 H866"/>
  <path class="ln" d="M550 1112 V1194"/>
  <path class="ln" d="M550 1272 V1354"/>
  <path class="ln" d="M550 1452 V1476"/>
  <path class="ln" d="M550 1534 V1558"/>
  <path class="ln" d="M550 1656 V1680"/>
  <path class="ln" d="M550 1778 V1802"/>
  <path class="ln" d="M830 1841 H866"/>
  <path class="ln" d="M550 1880 V1962"/>
  <path class="ln" d="M550 2040 V2064"/>
  <path class="ln" d="M830 2103 H866"/>
  <path class="ln" d="M550 2142 V2166"/>
  <path class="ln" d="M550 2284 V2308"/>
  <path class="ln" d="M550 2386 V2410"/>
  <text class="ti" x="550" y="42">vm_setup.sh — 스펙으로 VM 만들고 설정하기</text>
  <text class="sub" x="550" y="68">입력을 모두 받은 뒤 실행 계획을 확인하고, 그다음에만 vCenter 를 바꿉니다. 실패하면 그 단계에서 멈춥니다.</text>
  <rect class="auto" x="167" y="86" width="26" height="18" rx="4"/><text class="lg" x="200" y="100">자동 처리</text>
  <rect class="input" x="282" y="86" width="26" height="18" rx="4"/><text class="lg" x="315" y="100">⌨ 작업자 입력·선택</text>
  <rect class="stop" x="461" y="86" width="26" height="18" rx="4"/><text class="lg" x="494" y="100">중단 · 주의</text>
  <rect class="done" x="587" y="86" width="26" height="18" rx="4"/><text class="lg" x="620" y="100">완료</text>
  <rect class="note" x="672" y="86" width="26" height="18" rx="4"/><text class="lg" x="705" y="100">보충 설명</text>
  <rect class="link" x="787" y="86" width="26" height="18" rx="4"/><text class="lg" x="820" y="100">다른 흐름도와 연결</text>

  <rect class="band" x="20" y="130" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="153">입력 1 · 시작</text>
  <text class="nl" x="1064" y="152" style="text-anchor:end">unset VC_PASSWORD · MAC_ARGSTR · MAC_ARG1</text>
  <rect class="input" x="270" y="182" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="204">⌨ ./vm_setup.sh [-u] [-v] [-del_affinity] [-del_lpage] [-n]</text>
  <text class="b" x="550" y="224">-u 없으면 user 번호 메뉴 (lsh · ljh · dhk · 0 = 직접 입력)</text>
  <text class="b" x="550" y="244">&lt;user&gt;.txt (BM) · vswitch_&lt;user&gt;.txt (포트그룹 VLAN) 확인</text>
  <path class="tie" d="M270 221 H252"/>
  <rect class="note" x="20" y="185" width="232" height="72" rx="8"/>
  <text class="nl" x="136" y="207">남아 있던 VC_PASSWORD</text>
  <text class="nl" x="136" y="225">환경변수는 매번 지움</text>
  <text class="nl" x="136" y="243">→ 암호 파일 → 직접 입력</text>
  <rect class="input" x="270" y="284" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="306">⌨ 설치 정보 — OS 버전 · 인프라</text>
  <text class="b" x="550" y="326">OS 버전 : 숫자와 점 (예: 8.10) · 인프라 : 공백 없는 값</text>
  <text class="b" x="550" y="346">mac_info 목록의 argStr / arg1 로 들어감</text>
  <rect class="auto" x="270" y="386" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="408">실행파일 확인 → 포트그룹 이름 변환</text>
  <text class="b" x="550" y="428">없으면 ../setup.sh &lt;도구&gt; (OS6 는 bin_os6 설치)</text>
  <text class="b" x="550" y="448">포트그룹 칸이 IP 면 vswitch_pgname.sh (원본 .bak)</text>

  <rect class="band" x="20" y="494" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="517">입력 2 · 스펙과 포트그룹 할당</text>
  <text class="nl" x="1064" y="516" style="text-anchor:end">vm-param-check -specExport 로 스펙 해석</text>
  <rect class="auto" x="270" y="546" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="568">스펙 자동 할당 (auto_assign_specs)</text>
  <text class="b" x="550" y="588">포트그룹 &lt;폴더명&gt;-cae-a-b-c-d 의 폴더명 → SPEC_DIR 매칭</text>
  <text class="b" x="550" y="608">후보가 하나일 때만 자동 · CAE 번호 무시</text>
  <text class="s" x="550" y="628">build_flags 로 값 검증 (정수 · cpu ÷ cores · affinity 파일)</text>
  <path class="tie" d="M270 595 H252"/>
  <rect class="note" x="20" y="541" width="232" height="108" rx="8"/>
  <text class="nl" x="136" y="563">제외 키는 -specExport 가</text>
  <text class="nl" x="136" y="581">del_affinity-evNN=y</text>
  <text class="nl" x="136" y="599">del_lpage-evNN=y 로 펼침</text>
  <text class="nl" x="136" y="617">→ build_flags 가</text>
  <text class="nl" x="136" y="635">DEL_AFF_EVS / DEL_LP_EVS</text>
  <rect class="input" x="270" y="668" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="690">⌨ 못 정한 BM 만 스펙 선택</text>
  <text class="b" x="550" y="710">번호 선택 (Enter = 이전 선택) / 0 → vim 새 스펙 + ev 별 affinity</text>
  <text class="b" x="550" y="730">affinity-evNN 이 없는 스펙 → 지금 골라 스펙에 추가?</text>
  <text class="s" x="550" y="750">제외된 ev(스펙 키 · -del_affinity)는 affinity 파일이 없어도 됨</text>
  <path class="tie" d="M830 717 H848"/>
  <rect class="note" x="848" y="663" width="232" height="108" rx="8"/>
  <text class="nl" x="964" y="685">스펙 키 형식 (값은 y 만)</text>
  <text class="nl" x="964" y="703">all_del_affinity=y</text>
  <text class="nl" x="964" y="721">all_del_lpage=y</text>
  <text class="nl" x="964" y="739">ev01_del_affinity=y</text>
  <text class="nl" x="964" y="757">ev03_del_lpage=y</text>
  <rect class="input" x="270" y="790" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="812">⌨ VM → 스펙 / 포트그룹 표 (y/n)</text>
  <text class="b" x="550" y="832">VM(evNN)별 네트워크 어댑터 1 포트그룹 자동 할당</text>
  <text class="b" x="550" y="852">n / 미정 → 번호 선택, 0 → vim</text>
  <rect class="input" x="270" y="892" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="914">⌨ CAE 번호 변경? · vCenter 선택</text>
  <text class="b" x="550" y="934">y → 이번에 만드는 포트그룹 이름에 새 번호</text>
  <text class="b" x="550" y="954">vcenter.txt 번호 · Enter = run_&lt;user&gt;/last_vcenter</text>
  <text class="s" x="550" y="974">비밀번호 : ../secret 암호 파일 → 직접 입력</text>
  <rect class="input" x="270" y="1014" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="1036">⌨ 실행 계획 확인 (y/n)</text>
  <text class="b" x="550" y="1056">스펙별 VM 사양 · affinity 값 · MAC 디스크 자동 매칭</text>
  <text class="b" x="550" y="1076">&quot;제외(스펙): affinity=ev01 / lpage=ev03&quot; 줄</text>
  <text class="s" x="550" y="1096">plan.txt 에 저장</text>
  <text class="lb" x="848" y="1056">n</text>
  <rect class="stop" x="866" y="1034" width="214" height="58" rx="8"/>
  <text class="b" x="973" y="1058">n 또는 -n →</text>
  <text class="b" x="973" y="1077">종료 (변경 없음)</text>

  <rect class="band" x="20" y="1142" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1165">실행 · BM 전체</text>
  <text class="nl" x="1064" y="1164" style="text-anchor:end">진행 모니터 (터미널) / 줄줄이 출력 (VMSETUP_MONITOR=0)</text>
  <text class="lb" x="566" y="1134">y</text>
  <rect class="auto" x="270" y="1194" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1216">호스트 등록 (main_conn) → 포트그룹 생성 (vswitch_setting)</text>
  <text class="b" x="550" y="1236">BM 을 vCenter Task 폴더에 등록 · 포트그룹은 호스트 병렬</text>
  <text class="b" x="550" y="1256">만들 포트그룹이 없으면 건너뜀</text>

  <rect class="band" x="20" y="1302" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1325">실행 · 스펙마다 (스펙 1/N, 2/N …)</text>
  <text class="nl" x="1064" y="1324" style="text-anchor:end">worklist_N.txt · vmbase_N.txt</text>
  <rect class="auto" x="270" y="1354" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="1376">VM 생성 (vm_create) → MAC 조사 (mac_info)</text>
  <text class="b" x="550" y="1396">ev01~ev99 생성, 이미 있는 VM 은 건너뜀</text>
  <text class="b" x="550" y="1416">MAC/IP 조사 · sda5 디스크 = 가장 가까운 고정 용량</text>
  <text class="s" x="550" y="1436">480 / 600 / 960 / 1200 / 1900 / 7600</text>
  <rect class="auto" x="270" y="1476" width="560" height="58" rx="10"/>
  <text class="h" x="550" y="1498">전원 고성능 (power_setting)</text>
  <text class="b" x="550" y="1518">BM 전원 정책을 고성능으로 (이미 고성능이면 건너뜀)</text>
  <rect class="auto" x="270" y="1558" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="1580">affinity (affinity_setting)</text>
  <text class="b" x="550" y="1600">평소 : ev 별 affinity 파일 값 적용</text>
  <text class="b" x="550" y="1620">-del_affinity_evs=ev01 : 그 ev 만 affinity 값 삭제</text>
  <text class="s" x="550" y="1640">-del_affinity (명령줄) 이면 모든 ev 삭제 — 스펙 키보다 우선</text>
  <path class="tie" d="M830 1607 H848"/>
  <rect class="note" x="848" y="1571" width="232" height="72" rx="8"/>
  <text class="nl" x="964" y="1593">affinity 키</text>
  <text class="nl" x="964" y="1611">sched.cpu.affinity</text>
  <text class="nl" x="964" y="1629">sched.vcpuN.affinity</text>
  <rect class="auto" x="270" y="1680" width="560" height="98" rx="10"/>
  <text class="h" x="550" y="1702">lpage (lpage_setting)</text>
  <text class="b" x="550" y="1722">평소 : HugePage 5개 키 + CPU 토폴로지 (cores/socket · NUMA)</text>
  <text class="b" x="550" y="1742">-del_lpage_evs=ev03 : 그 ev 만 HugePage 삭제, 토폴로지는 적용</text>
  <text class="s" x="550" y="1762">스펙에 cores 가 없으면 건너뜀 · -del_lpage 면 모든 ev</text>
  <path class="tie" d="M830 1729 H848"/>
  <rect class="note" x="848" y="1675" width="232" height="108" rx="8"/>
  <text class="nl" x="964" y="1697">HugePage 5개 키</text>
  <text class="nl" x="964" y="1715">lpage.enable1GPage · mem.pin</text>
  <text class="nl" x="964" y="1733">mem.prealloc</text>
  <text class="nl" x="964" y="1751">prealloc.pinnedMainMem</text>
  <text class="nl" x="964" y="1769">swap.vmxSwapEnabled</text>
  <rect class="auto" x="270" y="1802" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1824">PCI 패스스루 (pci_passthrough) — pci-evNN 이 있을 때만</text>
  <text class="b" x="550" y="1844">ev 마다 장치 1개 배분 → 패스스루 활성화 → VM 연결</text>
  <text class="b" x="550" y="1864">메모리 100% 예약 · 64bit MMIO → 전원 ON (켜 둠)</text>
  <text class="lb" x="848" y="1834">3</text>
  <rect class="stop" x="866" y="1802" width="214" height="77" rx="8"/>
  <text class="b" x="973" y="1826">종료코드 3 = 재부팅 필요</text>
  <text class="b" x="973" y="1846">→ 경고 후 계속</text>
  <text class="b" x="973" y="1864">pci_resume_N.sh 남김</text>

  <rect class="band" x="20" y="1910" width="1060" height="34" rx="6"/>
  <text class="bt" x="36" y="1933">실행 · 마무리</text>
  <rect class="input" x="270" y="1962" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="1984">⌨ 라이선스 할당 (license_assign) — 모든 BM 1회</text>
  <text class="b" x="550" y="2004">평가판 호스트만 라이선스 번호 선택 (모니터를 잠시 닫음)</text>
  <text class="b" x="550" y="2024">q = 취소하고 다음 단계로</text>
  <rect class="auto" x="270" y="2064" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="2086">태그 설정 (tag_setting) — 스펙마다</text>
  <text class="b" x="550" y="2106">스펙 tag-DEPT_NAME / tag-PURPOSE / tag-VM_TYPE</text>
  <text class="b" x="550" y="2126">없으면 건너뜀 · 실패해도 경고 후 계속</text>
  <text class="lb" x="848" y="2096">실패</text>
  <rect class="stop" x="866" y="2064" width="214" height="77" rx="8"/>
  <text class="b" x="973" y="2088">어느 단계든 실패 →</text>
  <text class="b" x="973" y="2108">그 자리에서 멈춤 ·</text>
  <text class="b" x="973" y="2126">고친 뒤 처음부터 재실행</text>
  <rect class="auto" x="270" y="2166" width="560" height="118" rx="10"/>
  <text class="h" x="550" y="2188">스펙 체크 (vm-param-check -specFolder -onlyFail)</text>
  <text class="b" x="550" y="2208">방금 만든 VM 만 (check_targets_N.txt), 실행한 스펙으로</text>
  <text class="b" x="550" y="2228">-del_* → -expectNoLpage / -expectNoAffinity (+ 표시 파일)</text>
  <text class="b" x="550" y="2248">스펙 제외 키는 vm-param-check 가 스펙에서 직접 읽어 ev 별 판정</text>
  <text class="s" x="550" y="2268">check_N.log · check_N.csv · check_specs.txt · check_summary.txt</text>
  <rect class="auto" x="270" y="2308" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="2330">MAC 목록 복사</text>
  <text class="b" x="550" y="2350">mac_all.txt 의 IP 칸을 DNS · /etc/hosts 로 채움 (MAC_DOMAIN)</text>
  <text class="b" x="550" y="2370">awx_route 가 있으면 awx_route/&lt;user&gt;.txt 로 복사</text>
  <rect class="done" x="270" y="2410" width="560" height="78" rx="10"/>
  <text class="h" x="550" y="2432">[완료] — 단계별 시간 · 스펙 체크 결과 · MAC 목록 요약</text>
  <text class="b" x="550" y="2452">FAIL 이 있으면 vm-param-check -fix 명령을 안내</text>
  <text class="s" x="550" y="2472">단계별 로그 run_&lt;user&gt;/logs/ · 전체 로그 run.log</text>
  <text class="s" x="1080" y="2530" style="text-anchor:end">※ 끝난 뒤 임의의 VM 몇 대를 vCenter 에서 직접 확인하세요.</text>
  <text class="s" x="1080" y="2548" style="text-anchor:end">자세한 흐름 : ../docs/svg/ (vm_setup_input · vm_setup_run · spec_del · affinity_setting · lpage_setting …)</text>
</svg>
