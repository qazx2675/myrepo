 class="basic label-container" style="" rx="0" ry="0" x="-274.8671875" y="-40.5" width="549.734375" height="81"></rect><g class="label" style="" transform="translate(0, -28.5)"><rect></rect><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">JSON 저장</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">dumps/벤더/모델/BIOS버전/호스트/redfish/v1/... 와 dump_meta.json</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">index.tsv 에 한 줄 (OK · PARTIAL · SAVE_FAIL · 오류 코드)</tspan></text></g></g><g class="node default default flowchart-label" id="flowchart-SM-128" data-node="true" data-id="SM" transform="translate(327.0859375, 745.5)"><rect class="basic label-container" style="" rx="0" ry="0" x="-306.265625" y="-40.5" width="612.53125" height="81"></rect><g class="label" style="" transform="translate(0, -28.5)"><rect></rect><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">터미널 요약</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">호스트 헤더 1줄 + 표준 4항목 후보 속성(허용값 · ReadOnly) + pending 여부</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">--compact 는 호스트당 1줄</tspan></text></g></g><g class="node default default flowchart-label" id="flowchart-HU-130" data-node="true" data-id="HU" transform="translate(327.0859375, 863)"><rect class="basic label-container" style="" rx="0" ry="0" x="-139.96875" y="-32" width="279.9375" height="64"></rect><g class="label" style="" transform="translate(0, -20)"><rect></rect><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">사람이 요약을 읽고 전달</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">폐쇄망이라 파일은 반출하지 않음</tspan></text></g></g><g class="node default default flowchart-label" id="flowchart-PR-132" data-node="true" data-id="PR" transform="translate(327.0859375, 972)"><rect class="basic label-container" style="" rx="0" ry="0" x="-122.5625" y="-32" width="245.125" height="64"></rect><g class="label" style="" transform="translate(0, -20)"><rect></rect><text styl