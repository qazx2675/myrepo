<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 2132" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="설정 체크(프로파일 점검) 내부 처리 흐름">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="2132" class="bg"/>
  <text x="450" y="30" class="t ttl" text-anchor="middle">설정 체크 (프로파일 점검) 내부 처리 흐름 — bash bios.sh</text>

  <!-- 01 진입 -->
  <rect x="60" y="52" width="480" height="68" rx="6" class="box"/>
  <text x="300" y="74" class="t tb" text-anchor="middle">01 bash bios.sh 진입</text>
  <text x="300" y="90" class="t" text-anchor="middle">select_bin: 커널 3 미만이면 bin/biostool_os6, 그 외 bin/biostool</text>
  <text x="300" y="106" class="t" text-anchor="middle">필요한 파일 확인 (bios.conf · pass.enc · key.bin · 대상) 후 biostool bios 실행</text>
  <!-- 02 모드 -->
  <rect x="60" y="142" width="480" height="84" rx="6" class="dec"/>
  <text x="300" y="164" class="t tb" text-anchor="middle">02 실행 모드 판별 (cmdBios) — 이후 점검 엔진은 모두 같음</text>
  <text x="300" y="180" class="t" text-anchor="middle">-auto / -auto-check &lt;user&gt; &lt;targets.txt&gt; → 비대화형 (묻지 않고 점검만)</text>
  <text x="300" y="196" class="t" text-anchor="middle">터미널 출력 + -plain 없음 → TUI (대상 · 프로파일을 화면에서 선택)</text>
  <text x="300" y="212" class="t" text-anchor="middle">-plain 이거나 터미널이 아님 → 평문 출력 (설정 질문 없음)</text>
  <!-- 03 로드 -->
  <rect x="60" y="248" width="480" height="68" rx="6" class="box"/>
  <text x="300" y="270" class="t tb" text-anchor="middle">03 설정 · 대상 목록 로드 (prepare)</text>
  <text x="300" y="286" class="t" text-anchor="middle">bios.conf: user · concurrency · timeout · auth_fail_stop · xml_host_prefix</text>
  <text x="300" y="302" class="t" text-anchor="middle">대상: user.txt / TUI 입력 / targets.txt (Cisco 는 -user-xml 목록도)</text>
  <rect x="60" y="338" width="480" height="68" rx="6" class="sec"/>
  <text x="300" y="360" class="t tb" text-anchor="middle">04 비밀번호 복호화 (메모리에서만)</text>
  <text x="300" y="376" class="t" text-anchor="middle">pass.enc + key.bin → 1순위 비밀번호 (출력 · 로그 · 결과 파일에 안 남김)</text>
  <text x="300" y="392" class="t" text-anchor="middle">rf.conf (계정명) + rf.enc (비밀번호) → 2순위 계정, rf.conf 가 없으면 기능 꺼짐</text>
  <rect x="60" y="428" width="480" height="84" rx="6" class="box"/>
  <text x="300" y="450" class="t tb" text-anchor="middle">05 대상 해석 · 분류 (classifyTargets)</text>
  <text x="300" y="466" class="t" text-anchor="middle">IP 는 그대로, 이름은 hosts 에서 이름-m 조회 (없으면 NO_HOSTS_ENTRY)</text>
  <text x="300" y="482" class="t" text-anchor="middle">이름이 xml_host_prefix (기본 c) 로 시작하거나 -user-xml 목록 → Cisco XML</text>
  <text x="300" y="498" class="t" text-anchor="middle">그 밖 (user.txt 의 IP 포함) → Redfish</text>
  <rect x="60" y="534" width="480" height="68" rx="6" class="box"/>
  <text x="300" y="556" class="t tb" text-anchor="middle">06 프로파일 로드</text>
  <text x="300" y="572" class="t" text-anchor="middle">profiles/&lt;이름&gt;.tsv (-profile · auto_profile · TUI 는 목록에서 선택)</text>
  <text x="300" y="588" class="t" text-anchor="middle">표준 4항목 + 추가 항목 · value A|B = 허용값 여러 개 · verified Y/N · # [xml] 구역</text>
  <!-- 07 순회 -->
  <rect x="60" y="624" width="480" height="132" rx="6" class="box"/>
  <text x="300" y="646" class="t tb" text-anchor="middle">07 호스트 순회 (sweepHosts) — results/&lt;일시&gt;/ 폴더를 먼저 만듦</text>
  <text x="300" y="662" class="t" text-anchor="middle">concurrency (기본 100) 개 워커로 동시 처리</text>
  <text x="300" y="678" class="t" text-anchor="middle">웜업: 처음 auth_fail_stop (기본 3) 대는 한 대씩 직렬 처리</text>
  <text x="300" y="694" class="t" text-anchor="middle">로그인 1대 성공 → 병렬 전환 / N대 모두 AUTH_FAIL → 즉시 중단</text>
  <text x="300" y="710" class="t" text-anchor="middle">병렬 중에도 AUTH_FAIL 누적이 N 이상이면 새 호스트 시작을 멈춤</text>
  <text x="300" y="726" class="t" text-anchor="middle">웜업 중 2순위로만 성공한 호스트도 AUTH_FAIL 처럼 셈 (공통 비밀번호 오류 신호)</text>
  <text x="300" y="742" class="t" text-anchor="middle">멈춘 뒤 남은 호스트는 SKIPPED_AUTH_STOP (계정 잠금 방지, retry.txt)</text>
  <rect x="60" y="778" width="480" height="52" rx="6" class="dec"/>
  <text x="300" y="800" class="t tb" text-anchor="middle">08 호스트마다 대상 종류 판별 (checkHost)</text>
  <text x="300" y="816" class="t" text-anchor="middle">Redfish → 아래로 · Cisco XML → 오른쪽 (읽기 전용 점검)</text>
  <rect x="60" y="852" width="480" height="68" rx="6" class="box"/>
  <text x="300" y="874" class="t tb" text-anchor="middle">09 로그인 1회 (1순위 계정)</text>
  <text x="300" y="890" class="t" text-anchor="middle">POST SessionService/Sessions — bios.conf user + pass.enc, 호스트당 1번</text>
  <text x="300" y="906" class="t" text-anchor="middle">세션 서비스가 없는 BMC (404 · 405 · 501) 는 Basic 인증으로 진행</text>
  <rect x="60" y="942" width="480" height="52" rx="6" class="dec"/>
  <text x="300" y="964" class="t tb" text-anchor="middle">10 1순위가 AUTH_FAIL (401 · 로그인 403) ?</text>
  <text x="300" y="980" class="t" text-anchor="middle">성공 · AUTH_FAIL 이 아닌 실패 (UNREACHABLE 등)는 2순위를 쓰지 않음</text>
  <rect x="60" y="1016" width="480" height="84" rx="6" class="sec"/>
  <text x="300" y="1038" class="t tb" text-anchor="middle">2순위 계정 로그인 (fallback.go) — 정확히 1회</text>
  <text x="300" y="1054" class="t" text-anchor="middle">비인증 ServiceRoot 로 벤더 식별 → rf.conf 의 그 벤더 계정으로 로그인</text>
  <text x="300" y="1070" class="t" text-anchor="middle">벤더 불명 · 그 벤더 계정 없음 · 2순위도 거부 → AUTH_FAIL (조회 안 함)</text>
  <text x="300" y="1086" class="t" text-anchor="middle">다른 벤더 계정은 돌려 보지 않음 · 재시도 0회</text>
  <rect x="60" y="1122" width="480" height="84" rx="6" class="box"/>
  <text x="300" y="1144" class="t tb" text-anchor="middle">11 GET 조회 (읽기 전용)</text>
  <text x="300" y="1160" class="t" text-anchor="middle">ServiceRoot → Systems → System → Bios (현재값 Attributes)</text>
  <text x="300" y="1176" class="t" text-anchor="middle">→ Bios Settings (Pending 값) → Manager (관리 컨트롤러 모델 · 버전)</text>
  <text x="300" y="1192" class="t" text-anchor="middle">Dell 만 Jobs 목록 추가 GET · 요청 간격 100ms · 일시 오류는 재시도</text>
  <rect x="60" y="1228" width="480" height="132" rx="6" class="dec"/>
  <text x="300" y="1250" class="t tb" text-anchor="middle">12 항목 판정 (judge) — 프로파일 표준 항목마다 위에서부터</text>
  <text x="300" y="1266" class="t" text-anchor="middle">현재값이 허용값 (A|B) 중 하나 → OK</text>
  <text x="300" y="1282" class="t" text-anchor="middle">Pending=기대값 → PENDING_OK (Dell: Job 없으면 PENDING_NO_JOB)</text>
  <text x="300" y="1298" class="t" text-anchor="middle">verified=N → UNVERIFIED (설정 불가)</text>
  <text x="300" y="1314" class="t" text-anchor="middle">기대값도 현재값도 아닌 Pending, 또는 다른 속성 Pending → PENDING_EXISTS</text>
  <text x="300" y="1330" class="t" text-anchor="middle">그 밖의 불일치 → FAIL</text>
  <text x="300" y="1346" class="t" text-anchor="middle">행 · 속성 없음 → MAPPING_MISSING (모델당 1대 덤프) · exclude_attrs 는 제외</text>
  <rect x="60" y="1382" width="480" height="68" rx="6" class="sec"/>
  <text x="300" y="1404" class="t tb" text-anchor="middle">13 세션 정리 · 안전</text>
  <text x="300" y="1420" class="t" text-anchor="middle">이 도구가 만든 세션 1개만 DELETE (로그 · Actions · 남의 세션은 호출 안 함)</text>
  <text x="300" y="1436" class="t" text-anchor="middle">BMC 설정 변경 (PATCH) 없음 · 재부팅 없음 · 허용목록 밖 호출은 전송하지 않음</text>
  <!-- 14 결과 파일 -->
  <rect x="60" y="1472" width="480" height="100" rx="6" class="box"/>
  <text x="300" y="1494" class="t tb" text-anchor="middle">14 호스트 결과 → 결과 파일 기록 (doCheck 끝)</text>
  <text x="300" y="1510" class="t" text-anchor="middle">정상 호스트는 항목별 줄, 호스트 오류 (AUTH_FAIL 등)는 한 줄</text>
  <text x="300" y="1526" class="t" text-anchor="middle">result.tsv (원래 상태명) · ok.txt · fail.tsv · retry.txt · run_info.txt (0600)</text>
  <text x="300" y="1542" class="t" text-anchor="middle">retry.txt: UNREACHABLE · TIMEOUT · BMC_ERROR · SKIPPED · CANCELED</text>
  <text x="300" y="1558" class="t" text-anchor="middle">2순위로 접속한 호스트가 있으면 fallback_login.txt 도</text>
  <rect x="60" y="1594" width="480" height="52" rx="6" class="box"/>
  <text x="300" y="1616" class="t tb" text-anchor="middle">15 결과 줄 생성 · 태그 3종 (ProfileLines, tagFor)</text>
  <text x="300" y="1632" class="t" text-anchor="middle">줄마다 [태그] host ip vendor model bios attr 기준값 현재값 비고</text>
  <rect x="60" y="1668" width="130" height="100" rx="6" class="sec"/>
  <text x="125" y="1690" class="t tb" text-anchor="middle">[OK]</text>
  <text x="125" y="1706" class="t" text-anchor="middle">OK</text>
  <text x="125" y="1722" class="t" text-anchor="middle">PENDING_OK</text>
  <text x="125" y="1738" class="t tm" text-anchor="middle">Pending=기대값 포함</text>
  <text x="125" y="1754" class="t" text-anchor="middle"></text>
  <rect x="205" y="1668" width="150" height="100" rx="6" class="dec"/>
  <text x="280" y="1690" class="t tb" text-anchor="middle">[difference]</text>
  <text x="280" y="1706" class="t" text-anchor="middle">FAIL</text>
  <text x="280" y="1722" class="t" text-anchor="middle">UNVERIFIED</text>
  <text x="280" y="1738" class="t" text-anchor="middle">PENDING_EXISTS</text>
  <text x="280" y="1754" class="t" text-anchor="middle">PENDING_NO_JOB</text>
  <rect x="370" y="1668" width="170" height="100" rx="6" class="ext"/>
  <text x="455" y="1690" class="t tb" text-anchor="middle">[N/A]</text>
  <text x="455" y="1706" class="t" text-anchor="middle">MAPPING_MISSING</text>
  <text x="455" y="1722" class="t" text-anchor="middle">NO_DUMP</text>
  <text x="455" y="1738" class="t" text-anchor="middle">호스트 오류 (접속 실패)</text>
  <text x="455" y="1754" class="t" text-anchor="middle"></text>
  <rect x="60" y="1790" width="480" height="68" rx="6" class="box"/>
  <text x="300" y="1812" class="t tb" text-anchor="middle">16 CSV 저장 (결과 폴더 안, UTF-8 BOM · 0600)</text>
  <text x="300" y="1828" class="t" text-anchor="middle">profile_summary.csv · profile_long.csv</text>
  <text x="300" y="1844" class="t" text-anchor="middle">profile_wide_hosts_… .csv · profile_wide_attrs_… .csv (벤더·그룹별)</text>
  <rect x="60" y="1880" width="480" height="84" rx="6" class="box"/>
  <text x="300" y="1902" class="t tb" text-anchor="middle">17 화면 출력 (TUI · 평문)</text>
  <text x="300" y="1918" class="t" text-anchor="middle">기준값 초록 · 비고: OK 줄 초록, 그 밖 (difference · N/A) 노랑, 호스트 오류 빨강</text>
  <text x="300" y="1934" class="t" text-anchor="middle">TUI: 결과 화면 [프로파일 점검] 탭 (전체 비교 · 수정은 다른 흐름)</text>
  <text x="300" y="1950" class="t" text-anchor="middle">평문: == 프로파일 &lt;이름&gt; 점검 (대상 N대) == 아래에 같은 줄 형식</text>
  <rect x="60" y="1986" width="480" height="68" rx="6" class="ext"/>
  <text x="300" y="2008" class="t tb" text-anchor="middle">→ 계정 생성 흐름 (workflow_account.svg)</text>
  <text x="300" y="2024" class="t" text-anchor="middle">2순위 (rf.conf) 로 접속한 호스트가 있으면 점검 끝에 계정 생성을 묻습니다</text>
  <text x="300" y="2040" class="t" text-anchor="middle">TUI · 평문의 터미널 입력일 때만 (기본 Y) · -auto 는 묻지 않음</text>

  <!-- 보조 박스 (오른쪽 열) -->
  <rect x="600" y="142" width="285" height="84" rx="6" class="ext"/>
  <text x="742.5" y="164" class="t tb" text-anchor="middle">-auto / -auto-check (비대화형)</text>
  <text x="742.5" y="180" class="t" text-anchor="middle">시작할 때 이전 check.res_&lt;user&gt; 삭제</text>
  <text x="742.5" y="196" class="t" text-anchor="middle">결과는 호출한 폴더의 check.res_&lt;user&gt;</text>
  <text x="742.5" y="212" class="t" text-anchor="middle">점검만 · FAIL 이 있어도 종료코드 0</text>
  <rect x="600" y="248" width="285" height="68" rx="6" class="ext"/>
  <text x="742.5" y="270" class="t tb" text-anchor="middle">TUI 입력 단계 (대화형)</text>
  <text x="742.5" y="286" class="t" text-anchor="middle">대상 파일 지정 / 붙여넣기 → 프로파일 선택</text>
  <text x="742.5" y="302" class="t" text-anchor="middle">IP 대상이면 Cisco(XML) 대상도 질문</text>
  <rect x="600" y="624" width="285" height="68" rx="6" class="ext"/>
  <text x="742.5" y="646" class="t tb" text-anchor="middle">TUI Ctrl+X 취소</text>
  <text x="742.5" y="662" class="t" text-anchor="middle">아직 시작 안 한 호스트는 접속 안 함</text>
  <text x="742.5" y="678" class="t" text-anchor="middle">상태 CANCELED (retry.txt 에 기록)</text>
  <rect x="600" y="778" width="285" height="116" rx="6" class="ldap"/>
  <text x="742.5" y="800" class="t tb" text-anchor="middle">Cisco XML 대상 점검 (xmlhost.go)</text>
  <text x="742.5" y="816" class="t" text-anchor="middle">aaaLogin (같은 user · pass.enc)</text>
  <text x="742.5" y="832" class="t" text-anchor="middle">configResolveClass: 서버 · SP · bios* 클래스</text>
  <text x="742.5" y="848" class="t" text-anchor="middle">aaaLogout — 보내는 요청은 이 3종뿐</text>
  <text x="742.5" y="864" class="t" text-anchor="middle">로그인 전 실패 → Redfish 로 1회 재점검</text>
  <text x="742.5" y="880" class="t" text-anchor="middle">(AUTH_FAIL 은 잠금 방지로 재시도 안 함)</text>
  <rect x="600" y="916" width="285" height="68" rx="6" class="ldap"/>
  <text x="742.5" y="938" class="t tb" text-anchor="middle">프로파일 # [xml] 구역으로 판정</text>
  <text x="742.5" y="954" class="t" text-anchor="middle">전체비교 · 설정에서 제외 (점검만)</text>
  <text x="742.5" y="970" class="t" text-anchor="middle">서버 여럿이면 호스트/서버dn 으로 나눠 보고</text>
  <rect x="600" y="1880" width="285" height="84" rx="6" class="ext"/>
  <text x="742.5" y="1902" class="t tb" text-anchor="middle">check.res_&lt;user&gt; (-auto 일 때)</text>
  <text x="742.5" y="1918" class="t" text-anchor="middle">호스트당 1줄: OK / FAIL difference N건 /</text>
  <text x="742.5" y="1934" class="t" text-anchor="middle">FAIL N/A 접속실패 (사유)</text>
  <text x="742.5" y="1950" class="t" text-anchor="middle">-auto 는 _postapply 도 같은 내용으로 기록</text>

  <!-- 연결선 -->
