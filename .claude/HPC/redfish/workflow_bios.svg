<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 1830" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="bios.sh 통합 내부 처리 흐름 (개요)">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="1830" class="bg"/>
  <text x="450" y="30" class="t ttl" text-anchor="middle">bios.sh 통합 내부 처리 흐름 (개요)</text>
  <text x="450" y="50" class="t tm" text-anchor="middle">기준: bios.sh → bin/biostool bios (cmdBios). 단계 상세는 각 박스의 → workflow_*.svg 참조</text>

  <!-- 진입 -->
  <rect x="40" y="64" width="520" height="52" rx="6" class="box"/>
  <text x="300" y="86" class="t tb" text-anchor="middle">bash bios.sh [명령] [옵션...]</text>
  <text x="300" y="102" class="t tm" text-anchor="middle">caller_pwd (호출한 폴더) 기억 · script_dir 계산 (아직 cd 하지 않음)</text>

  <!-- 기능별 명령 분기 -->
  <rect x="40" y="138" width="520" height="68" rx="6" class="dec"/>
  <text x="300" y="160" class="t tb" text-anchor="middle">첫 인자가 기능별 명령인가 ?  (case "$1")</text>
  <text x="300" y="176" class="t tm" text-anchor="middle">account · trs · trs-cisco · dump · export · ucsm</text>
  <text x="300" y="192" class="t tm" text-anchor="middle">check · allcheck · encrypt · update</text>
  <path d="M560 172 L598 172" class="ln"/>
  <text x="568" y="166" class="t tm">예</text>

  <rect x="600" y="130" width="280" height="170" rx="6" class="ext"/>
  <text x="740" y="150" class="t tb" text-anchor="middle">래퍼로 exec (나머지 인자 그대로)</text>
  <text x="740" y="168" class="t tm" text-anchor="middle">account → account_create.sh</text>
  <text x="740" y="183" class="t tm" text-anchor="middle">→ workflow_account.svg 참조</text>
  <text x="740" y="198" class="t tm" text-anchor="middle">trs → trs.sh · trs-cisco → trs_cisco.sh</text>
  <text x="740" y="213" class="t tm" text-anchor="middle">dump → xml.sh · export → bios_export.sh</text>
  <text x="740" y="228" class="t tm" text-anchor="middle">ucsm → ucsm_check.sh</text>
  <text x="740" y="243" class="t tm" text-anchor="middle">encrypt → encrypt.sh</text>
  <text x="740" y="258" class="t tm" text-anchor="middle">update → update.sh</text>
  <text x="740" y="273" class="t tm" text-anchor="middle">check → bios_check.sh</text>
  <text x="740" y="288" class="t tm" text-anchor="middle">allcheck → all_bios_check.sh</text>

  <!-- passwd -->
  <rect x="40" y="228" width="520" height="68" rx="6" class="dec"/>
  <text x="300" y="250" class="t tb" text-anchor="middle">passwd 인가 ?  (cd 스크립트 폴더 → . lib.sh 다음)</text>
  <text x="300" y="266" class="t tm" text-anchor="middle">예 → select_bin → exec bin/biostool account change (래퍼 없음)</text>
  <text x="300" y="282" class="t tm" text-anchor="middle">비밀번호 변경 → workflow_account.svg 참조</text>

  <!-- 인자 정리 -->
  <rect x="40" y="318" width="520" height="68" rx="6" class="box"/>
  <text x="300" y="340" class="t tb" text-anchor="middle">인자 정리 · 경로 보정</text>
  <text x="300" y="356" class="t tm" text-anchor="middle">--profile X → -profile X · fix_path_args: 상대경로가 호출한 폴더에 있으면 그 기준</text>
  <text x="300" y="372" class="t tm" text-anchor="middle">-auto: targets·-user-xml 을 호출 폴더 기준 절대경로로 + -res-dir 추가</text>

  <!-- select_bin -->
  <rect x="40" y="408" width="520" height="68" rx="6" class="box"/>
  <text x="300" y="430" class="t tb" text-anchor="middle">select_bin (lib.sh) · 필요한 파일 확인</text>
  <text x="300" y="446" class="t tm" text-anchor="middle">커널 3 미만 bin/biostool_os6, 그 외 bin/biostool (없으면 go 로 빌드 시도)</text>
  <text x="300" y="462" class="t tm" text-anchor="middle">bios.conf·pass.enc·key.bin (+ user.txt / -auto targets) 없으면 종료 1</text>

  <!-- cmdBios -->
  <rect x="40" y="498" width="520" height="52" rx="6" class="box"/>
  <text x="300" y="520" class="t tb" text-anchor="middle">exec bin/biostool bios → cmdBios (unified_cmd.go)</text>
  <text x="300" y="536" class="t tm" text-anchor="middle">-ref·-ref-json·-diff 는 하나만 · -auto 는 기준 금지, 이전 check.res 먼저 삭제</text>

  <!-- 모드 분기 -->
  <rect x="40" y="572" width="520" height="52" rx="6" class="dec"/>
  <text x="300" y="594" class="t tb" text-anchor="middle">실행 모드 ?</text>
  <text x="300" y="610" class="t tm" text-anchor="middle">-auto · -auto-check → 비대화형 · -plain 또는 터미널 아님 → 평문 · 그 밖 → TUI</text>

  <path d="M300 116 L300 138" class="ln"/>
  <path d="M300 206 L300 228" class="ln"/>
  <text x="308" y="221" class="t tm">아니오</text>
  <path d="M300 296 L300 318" class="ln"/>
  <text x="308" y="311" class="t tm">아니오</text>
  <path d="M300 386 L300 408" class="ln"/>
  <path d="M300 476 L300 498" class="ln"/>
  <path d="M300 550 L300 572" class="ln"/>

  <!-- 공통 안전 약속 -->
  <rect x="600" y="318" width="280" height="166" rx="6" class="sec"/>
  <text x="740" y="340" class="t tb" text-anchor="middle">공통 안전 약속</text>
  <text x="740" y="358" class="t tm" text-anchor="middle">재부팅 없음 — 설정은 BMC Pending 까지만</text>
  <text x="740" y="374" class="t tm" text-anchor="middle">호스트당 로그인 1회 (2순위 폴백 시 최대 2회)</text>
  <text x="740" y="390" class="t tm" text-anchor="middle">끝나면 자기 세션만 삭제</text>
  <text x="740" y="406" class="t tm" text-anchor="middle">허용목록 밖 호출은 전송 전에 차단</text>
  <text x="740" y="422" class="t tm" text-anchor="middle">(로그 조회 · ClearLog · Reset 등)</text>
  <text x="740" y="438" class="t tm" text-anchor="middle">비밀번호는 화면·로그·결과 파일에 안 남김</text>
  <text x="740" y="454" class="t tm" text-anchor="middle">BMC 쪽 로그인/로그아웃 기록은 남음</text>
  <text x="740" y="470" class="t tm" text-anchor="middle">XML 대상은 읽기 전용 (전체비교·설정 제외)</text>

  <!-- 모드별 앞부분 -->
  <path d="M300 624 L300 634 L210 634 L210 646" class="ln"/>
  <path d="M300 624 L300 634 L530 634 L530 646" class="ln"/>
  <path d="M300 624 L300 634 L770 634 L770 646" class="ln"/>

  <rect x="40" y="646" width="340" height="68" rx="6" class="box"/>
  <text x="210" y="668" class="t tb" text-anchor="middle">대화형 TUI (tui_flow.go)</text>
  <text x="210" y="684" class="t tm" text-anchor="middle">대상 입력: 파일 / 붙여넣기 (IP 있으면 Cisco XML 대상도)</text>
  <text x="210" y="700" class="t tm" text-anchor="middle">→ 프로파일 선택 (분류는 대상 입력 직후 prepare 에서)</text>

  <rect x="420" y="646" width="220" height="68" rx="6" class="box"/>
  <text x="530" y="668" class="t tb" text-anchor="middle">평문 (-plain · 비 터미널)</text>
  <text x="530" y="684" class="t tm" text-anchor="middle">-profile 필수 · 대상 user.txt</text>
  <text x="530" y="700" class="t tm" text-anchor="middle">(-user · -user-xml 로 변경)</text>

  <rect x="660" y="646" width="220" height="68" rx="6" class="box"/>
  <text x="770" y="668" class="t tb" text-anchor="middle">-auto · -auto-check</text>
  <text x="770" y="684" class="t tm" text-anchor="middle">점검만 · auto_setup 연동</text>
  <text x="770" y="700" class="t tm" text-anchor="middle">-profile 또는 auto_profile</text>

  <path d="M210 714 L210 736" class="ln"/>
  <path d="M530 714 L530 736" class="ln"/>
  <path d="M770 714 L770 736" class="ln"/>

  <!-- 대상 분류 -->
  <rect x="40" y="736" width="840" height="52" rx="6" class="box"/>
  <text x="460" y="758" class="t tb" text-anchor="middle">prepare: bios.conf 읽기 · 대상 해석 → 대상 분류 (classifyTargets, resolve.go)</text>
  <text x="460" y="774" class="t tm" text-anchor="middle">hostname 이 xml_host_prefix (기본 c) 로 시작 · -user-xml 목록 → Cisco XML  /  그 밖 hostname · IP → Redfish</text>
  <path d="M240 788 L240 810" class="ln"/>
  <path d="M680 788 L680 810" class="ln"/>

  <!-- 점검 -->
  <rect x="40" y="810" width="400" height="98" rx="6" class="box"/>
  <text x="240" y="832" class="t tb" text-anchor="middle">Redfish 점검 (runUnified → doCheck)</text>
  <text x="240" y="848" class="t tm" text-anchor="middle">호스트당 세션 1회 · GET 만 (ModeReadOnly)</text>
  <text x="240" y="864" class="t tm" text-anchor="middle">BIOS 전체 속성 스냅샷 → 프로파일 판정 + 전체비교에 재사용</text>
  <text x="240" y="880" class="t tm" text-anchor="middle">1순위 AUTH_FAIL → rf.conf 2순위 계정으로 1회 (fallback.go)</text>
  <text x="240" y="896" class="t tm" text-anchor="middle">→ workflow.svg 참조 (설정 체크 상세)</text>

  <rect x="480" y="810" width="400" height="98" rx="6" class="ldap"/>
  <text x="680" y="832" class="t tb" text-anchor="middle">Cisco XML 점검 (xmlhost.go, 읽기 전용)</text>
  <text x="680" y="848" class="t tm" text-anchor="middle">hostname-m 로 aaaLogin → configResolveClass → aaaLogout</text>
  <text x="680" y="864" class="t tm" text-anchor="middle">프로파일 # [xml] 구역으로 판정 · 전체비교·설정에서 제외</text>
  <text x="680" y="880" class="t tm" text-anchor="middle">로그인 전 실패 (AUTH_FAIL 제외) → 그 호스트만 Redfish 1회</text>
  <text x="680" y="896" class="t tm" text-anchor="middle">비고: XML 실패 → Redfish</text>
  <path d="M480 880 L442 880" class="ln"/>
  <text x="447" y="873" class="t tm">폴백</text>

  <path d="M240 908 L240 930" class="ln"/>
  <path d="M680 908 L680 930" class="ln"/>

  <!-- 결과 기록 -->
  <rect x="40" y="930" width="840" height="52" rx="6" class="box"/>
  <text x="460" y="952" class="t tb" text-anchor="middle">점검 결과 기록 (모드 공통) → results/&lt;일시&gt;/</text>
  <text x="460" y="968" class="t tm" text-anchor="middle">result.tsv · ok.txt · fail.tsv · retry.txt · run_info.txt + profile_*.csv   (TUI 진행: [2/4 접속·조회] → [3/4 CSV 저장])</text>

  <path d="M210 982 L210 1004" class="ln"/>
  <path d="M530 982 L530 1004" class="ln"/>
  <path d="M770 982 L770 1004" class="ln"/>

  <!-- TUI 열 -->
  <rect x="40" y="1004" width="340" height="84" rx="6" class="box"/>
  <text x="210" y="1026" class="t tb" text-anchor="middle">결과 보기 [프로파일 점검] 탭 (tui_view.go)</text>
  <text x="210" y="1042" class="t tm" text-anchor="middle">←→ 벤더 · Enter 관리망 그룹 · a/o/f/n 필터</text>
  <text x="210" y="1058" class="t tm" text-anchor="middle">비고 색: OK 초록 · 그 밖 노랑 · 호스트 오류 빨강</text>
  <text x="210" y="1074" class="t tm" text-anchor="middle">렉 개선: 표 캐시 · 같은 프레임 건너뜀 · 스크롤 키 합침</text>

  <rect x="40" y="1110" width="340" height="52" rx="6" class="dec"/>
  <text x="210" y="1132" class="t tb" text-anchor="middle">키 ?</text>
  <text x="210" y="1148" class="t tm" text-anchor="middle">Tab → 전체 비교 · e → 수정 · q 두 번 → 끝</text>

  <rect x="40" y="1184" width="340" height="100" rx="6" class="box"/>
  <text x="210" y="1206" class="t tb" text-anchor="middle">선택: [전체 설정 비교] 탭</text>
  <text x="210" y="1222" class="t tm" text-anchor="middle">기준: 비교서버 · refs/*.json · diff.txt (r 로 다시)</text>
  <text x="210" y="1238" class="t tm" text-anchor="middle">대상 재접속 없이 스냅샷으로 비교 · compare_*.csv</text>
  <text x="210" y="1254" class="t tm" text-anchor="middle">-ref·-ref-json·-diff 를 주면 수집 직후 자동 비교</text>
  <text x="210" y="1270" class="t tm" text-anchor="middle">→ workflow_allcheck.svg 참조</text>

  <rect x="40" y="1306" width="340" height="100" rx="6" class="dec"/>
  <text x="210" y="1328" class="t tb" text-anchor="middle">선택: 수정 단계 (e) — 2단계 확인</text>
  <text x="210" y="1344" class="t tm" text-anchor="middle">확인 1: 차이 항목 전부 → 적용할까요?</text>
  <text x="210" y="1360" class="t tm" text-anchor="middle">확인 2: 수정제외만 다시 → 진행할까요?</text>
  <text x="210" y="1376" class="t tm" text-anchor="middle">(+ 남의 Pending 포함 여부)  y → Pending 까지만</text>
  <text x="210" y="1392" class="t tm" text-anchor="middle">→ workflow_set.svg 참조</text>

  <rect x="40" y="1428" width="340" height="52" rx="6" class="box"/>
  <text x="210" y="1450" class="t tb" text-anchor="middle">TUI 닫고 요약 출력</text>
  <text x="210" y="1466" class="t tm" text-anchor="middle">건수 · 결과 폴더 · CSV · 설정: 결과 (재부팅 안 함)</text>

  <path d="M210 1088 L210 1110" class="ln"/>
  <path d="M210 1162 L210 1184" class="ln"/>
  <text x="218" y="1177" class="t tm">Tab</text>
  <path d="M210 1284 L210 1306" class="ln"/>
  <text x="218" y="1299" class="t tm">e</text>
  <path d="M210 1406 L210 1428" class="ln"/>
  <text x="218" y="1421" class="t tm">q 두 번</text>
  <path d="M40 1356 L24 1356 L24 1046 L38 1046" class="ln"/>
  <text x="30" y="1299" class="t tm">n·취소·설정 후 → 결과 보기</text>
  <path d="M380 1136 L400 1136 L400 1454 L382 1454" class="ln"/>
  <text x="405" y="1300" class="t tm">q q</text>

  <!-- 평문 열 -->
  <rect x="420" y="1004" width="220" height="84" rx="6" class="box"/>
  <text x="530" y="1026" class="t tb" text-anchor="middle">평문 출력 (lineout.go)</text>
  <text x="530" y="1042" class="t tm" text-anchor="middle">[태그] host … 비고 한 줄씩 (버퍼)</text>
  <text x="530" y="1058" class="t tm" text-anchor="middle">-ref 등 → 전체비교 줄·특이사항도</text>
  <text x="530" y="1074" class="t tm" text-anchor="middle">읽기 전용 · 설정 질문 없음</text>
  <path d="M530 1088 L530 1502" class="ln"/>

  <!-- 비대화형 열 -->
  <rect x="660" y="1004" width="220" height="100" rx="6" class="box"/>
  <text x="770" y="1026" class="t tb" text-anchor="middle">check.res_&lt;user&gt; 기록</text>
  <text x="770" y="1042" class="t tm" text-anchor="middle">호출한 폴더(-res-dir), 호스트당 1줄</text>
  <text x="770" y="1058" class="t tm" text-anchor="middle">-auto 는 _postapply 에도 같은 내용</text>
  <text x="770" y="1074" class="t tm" text-anchor="middle">임시 파일 + rename (원자적)</text>
  <text x="770" y="1090" class="t tm" text-anchor="middle">→ workflow_auto.svg 참조</text>
  <path d="M770 1104 L770 1126" class="ln"/>
  <rect x="660" y="1126" width="220" height="52" rx="6" class="box"/>
  <text x="770" y="1148" class="t tb" text-anchor="middle">종료코드 0 (FAIL 있어도)</text>
  <text x="770" y="1164" class="t tm" text-anchor="middle">설정·계정 질문 없음</text>
  <path d="M770 1178 L770 1698" class="ln"/>

  <!-- 계정 생성 질문 -->
  <path d="M210 1480 L210 1502" class="ln"/>
  <rect x="40" y="1502" width="600" height="84" rx="6" class="dec"/>
  <text x="340" y="1524" class="t tb" text-anchor="middle">점검 끝 계정 생성 질문 (account_check.go, 터미널 입력일 때만)</text>
  <text x="340" y="1540" class="t tm" text-anchor="middle">1순위 계정 거부 → 2순위(rf.conf)로 점검한 호스트가 있으면 「계정을 만들까요? [Y/n]」 (빈 입력 = Y)</text>
  <text x="340" y="1556" class="t tm" text-anchor="middle">결과 폴더에 account_targets.txt (생성 대상) · account_unfixable.txt (AUTH_FAIL)</text>
  <text x="340" y="1572" class="t tm" text-anchor="middle">user2 가 있으면 두 번째 계정도 함께 → workflow_account.svg 참조</text>
  <path d="M340 1586 L340 1608" class="ln"/>
  <text x="348" y="1601" class="t tm">Y</text>
