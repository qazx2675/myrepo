<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 1366" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전체 설정 비교 내부 처리 흐름">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
      .gok { fill: var(--scs); font-weight: bold; }
      .gdf { fill: var(--dcs); font-weight: bold; }
      .gna { fill: var(--exs); font-weight: bold; }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="1366" class="bg"/>
  <text x="450" y="30" class="t ttl" text-anchor="middle">전체 설정 비교 내부 처리 흐름 (bash bios.sh)</text>

  <!-- 주 흐름: x=50..510, 중심 280 -->
  <!-- M1 -->
  <rect x="50" y="52" width="460" height="52" rx="6" class="box"/>
  <text x="280" y="72" class="t tb" text-anchor="middle">bash bios.sh → biostool bios (TUI)</text>
  <text x="280" y="89" class="t" text-anchor="middle">대상 입력(파일·붙여넣기) · Cisco(XML) 대상 · 프로파일 선택</text>
  <!-- M2 -->
  <rect x="50" y="126" width="460" height="68" rx="6" class="sec"/>
  <text x="280" y="146" class="t tb" text-anchor="middle">[2/4 접속·조회] runUnified (읽기 전용)</text>
  <text x="280" y="163" class="t" text-anchor="middle">호스트당 BMC 세션 1회: 프로파일 판정과 함께 BIOS 속성 전체를</text>
  <text x="280" y="179" class="t" text-anchor="middle">호스트별 스냅샷에 보관 (Cisco XML 은 점검만, 속성 없음)</text>
  <!-- M3 -->
  <rect x="50" y="216" width="460" height="52" rx="6" class="box"/>
  <text x="280" y="236" class="t tb" text-anchor="middle">[3/4] profile_ CSV 저장 → [프로파일 점검] 탭</text>
  <text x="280" y="253" class="t" text-anchor="middle">Tab 키로 [전체 설정 비교] 탭 전환 (처음이면 기준을 고름)</text>
  <!-- M5 -->
  <rect x="50" y="290" width="460" height="68" rx="6" class="dec"/>
  <text x="280" y="310" class="t tb" text-anchor="middle">기준 지정 (compareRef: 셋 중 정확히 하나)</text>
  <text x="280" y="327" class="t" text-anchor="middle">첫 Tab · r 키 → 기준 선택 메뉴 (Ctrl+X 취소 가능)</text>
  <text x="280" y="343" class="t" text-anchor="middle">-ref · -ref-json · -diff 를 줬으면 메뉴 없이 수집 직후 자동 비교</text>
  <!-- M6 -->
  <rect x="50" y="380" width="460" height="84" rx="6" class="box"/>
  <text x="280" y="400" class="t tb" text-anchor="middle">기준 호스트 조회 (compareRefs)</text>
  <text x="280" y="417" class="t" text-anchor="middle">대상 목록에 있는 기준: 읽어 둔 스냅샷 재사용 (재접속 없음)</text>
  <text x="280" y="433" class="t" text-anchor="middle">목록에 없는 기준만 1회 조회, 같은 BMC 중복은 먼저 것만</text>
  <text x="280" y="449" class="t" text-anchor="middle">JSON 은 파일만 읽음 · 조회 중 Ctrl+X 면 남은 기준은 CANCELED</text>
  <!-- M7 -->
  <rect x="50" y="486" width="460" height="68" rx="6" class="box"/>
  <text x="280" y="506" class="t tb" text-anchor="middle">기준 색인 (indexRefs)</text>
  <text x="280" y="523" class="t" text-anchor="middle">모델 키(소문자 벤더|정규화 모델)별로 기준을 묶고</text>
  <text x="280" y="539" class="t" text-anchor="middle">읽기 실패한 기준은 따로 보관 (분류는 BMC 가 보고한 실제 모델)</text>
  <!-- M8 -->
  <rect x="50" y="576" width="460" height="52" rx="6" class="dec"/>
  <text x="280" y="596" class="t tb" text-anchor="middle">대상 스냅샷 읽기 성공 ?</text>
  <text x="280" y="613" class="t" text-anchor="middle">대상 입력 순서로 순회 — 대상에는 다시 접속하지 않음</text>
  <!-- M9 -->
  <rect x="50" y="650" width="460" height="68" rx="6" class="box"/>
  <text x="280" y="670" class="t tb" text-anchor="middle">모델 키 매칭 (classify)</text>
  <text x="280" y="687" class="t" text-anchor="middle">대상 모델 키와 같은 기준 후보를 찾음 (자기 자신은 제외)</text>
  <text x="280" y="703" class="t" text-anchor="middle">후보 여럿: BIOS 버전이 같은 기준 우선, 없으면 첫 기준 (MULTI_REF)</text>
  <!-- M10 -->
  <rect x="50" y="740" width="460" height="52" rx="6" class="dec"/>
  <text x="280" y="760" class="t tb" text-anchor="middle">같은 모델의 기준 있음 ?</text>
  <text x="280" y="777" class="t" text-anchor="middle">refs JSON 기준도 모델 키가 맞아야 비교함</text>
  <!-- M11 -->
  <rect x="50" y="814" width="460" height="84" rx="6" class="box"/>
  <text x="280" y="834" class="t tb" text-anchor="middle">속성 비교 (compareAttrs)</text>
  <text x="280" y="851" class="t" text-anchor="middle">(기준 ∪ 대상) 속성 이름 중 제외 패턴을 뺀 것만, 이름순</text>
  <text x="280" y="867" class="t" text-anchor="middle">값은 문자열 그대로: 같음 · DIFF · ONLY_REF · ONLY_HOST</text>
  <text x="280" y="883" class="t" text-anchor="middle">BIOS 버전이 달라도 비교하고 BIOS_VER_DIFF 특이사항을 남김</text>
  <!-- M12 -->
  <rect x="50" y="920" width="460" height="52" rx="6" class="dec"/>
  <text x="280" y="940" class="t tb" text-anchor="middle">호스트 상태 확정: 차이 0건 → SAME, 1건 이상 → DIFF</text>
  <text x="280" y="957" class="t" text-anchor="middle">DIFF · ONLY_REF · ONLY_HOST 건수를 호스트별로 집계</text>
  <!-- M13 -->
  <rect x="50" y="994" width="460" height="84" rx="6" class="box"/>
  <text x="280" y="1014" class="t tb" text-anchor="middle">결과 줄 (compareLines): 속성 1개 = 1줄, 태그 3종</text>
  <text x="280" y="1031" class="t" text-anchor="middle"><tspan class="gok">OK</tspan> SAME(같은 값) · REFERENCE(기준 자신, 기준값=현재값)</text>
  <text x="280" y="1047" class="t" text-anchor="middle"><tspan class="gdf">difference</tspan> DIFF(값 다름) · ONLY_HOST(기준값 (없음))</text>
  <text x="280" y="1063" class="t" text-anchor="middle"><tspan class="gna">N/A</tspan> ONLY_REF(현재값 (N/A)) · 비교 못 한 호스트는 1줄</text>
  <!-- M14 -->
  <rect x="50" y="1100" width="460" height="100" rx="6" class="box"/>
  <text x="280" y="1120" class="t tb" text-anchor="middle">화면: TUI [전체 설정 비교] 탭</text>
  <text x="280" y="1137" class="t" text-anchor="middle">벤더 → 관리 컨트롤러 모델 그룹별 탭, 필터 전체·OK·difference·N/A·요약</text>
  <text x="280" y="1153" class="t" text-anchor="middle">줄: 태그 · host · ip · vendor · model · bios · attr · 기준값 · 현재값 · 비고</text>
  <text x="280" y="1169" class="t" text-anchor="middle">태그·현재값: OK 초록 · difference 노랑 · N/A 회색</text>
  <text x="280" y="1185" class="t" text-anchor="middle">비고: OK 초록, 그 밖 노랑 · 호스트 오류 줄 빨강 · XML 제외 줄 회색</text>
  <!-- M15 -->
  <rect x="50" y="1222" width="460" height="100" rx="6" class="box"/>
  <text x="280" y="1242" class="t tb" text-anchor="middle">CSV 4종 (compare_ 접두어, 결과 폴더, BOM · 0600)</text>
  <text x="280" y="1259" class="t" text-anchor="middle">summary: 호스트별 불일치·N/A 건수와 불일치 속성</text>
  <text x="280" y="1275" class="t" text-anchor="middle">wide_hosts_&lt;벤더&gt;_&lt;그룹&gt;: 첫 행 '기준' 에 기준 호스트 hostname·IP,</text>
  <text x="280" y="1291" class="t" text-anchor="middle">대상 행 difference 칸은 [DIFF] 접두 · wide_attrs: 속성별 차이 대수</text>
  <text x="280" y="1307" class="t" text-anchor="middle">long: 결과 줄 1개 = 행 1개 (r 로 다시 비교하면 덮어씀)</text>

  <!-- 주 흐름 화살표 -->
  <path d="M280 104 L280 126" class="ln"/>
  <path d="M280 194 L280 216" class="ln"/>
  <path d="M280 268 L280 290" class="ln"/>
  <path d="M280 358 L280 380" class="ln"/>
  <path d="M280 464 L280 486" class="ln"/>
  <path d="M280 554 L280 576" class="ln"/>
  <path d="M280 628 L280 650" class="ln"/>
  <path d="M280 718 L280 740" class="ln"/>
  <path d="M280 792 L280 814" class="ln"/>
  <path d="M280 898 L280 920" class="ln"/>
  <path d="M280 972 L280 994" class="ln"/>
  <path d="M280 1078 L280 1100" class="ln"/>
  <path d="M280 1200 L280 1222" class="ln"/>
  <text x="288" y="643" class="t tm">예</text>
  <text x="288" y="807" class="t tm">예</text>

  <!-- 우측 열: 제외 속성 (M2 로) -->
  <rect x="580" y="126" width="300" height="68" rx="6" class="ext"/>
  <text x="730" y="146" class="t tb" text-anchor="middle">제외 속성 (u.Ignore)</text>
  <text x="730" y="163" class="t" text-anchor="middle">ignore_attrs.txt (없으면 내장 기본 목록)</text>
  <text x="730" y="179" class="t" text-anchor="middle">∪ bios.conf exclude_attrs (* 와일드카드)</text>
  <path d="M580 160 L512 160" class="dash"/>

  <!-- 우측 열: 기준 지정 3가지 (M5 에서) -->
  <rect x="580" y="224" width="300" height="60" rx="6" class="ldap"/>
  <text x="730" y="243" class="t tb" text-anchor="middle">① 비교서버 hostname (-ref)</text>
  <text x="730" y="259" class="t" text-anchor="middle">여러 대 가능 (줄바꿈·공백·쉼표)</text>
  <text x="730" y="274" class="t" text-anchor="middle">비우고 Ctrl+D 하면 diff.txt</text>
  <rect x="580" y="294" width="300" height="60" rx="6" class="ldap"/>
  <text x="730" y="313" class="t tb" text-anchor="middle">② refs JSON (-ref-json)</text>
  <text x="730" y="329" class="t" text-anchor="middle">refs_dir/*.json 중 선택 (접속 없음)</text>
  <text x="730" y="344" class="t" text-anchor="middle">대상과 같은 호스트로 보지 않음</text>
  <rect x="580" y="364" width="300" height="60" rx="6" class="ldap"/>
  <text x="730" y="383" class="t tb" text-anchor="middle">③ diff.txt (-diff)</text>
  <text x="730" y="399" class="t" text-anchor="middle">모델별 기준 hostname 목록</text>
  <text x="730" y="414" class="t" text-anchor="middle">모델 칸은 확인용, 같은 모델 여러 대 가능</text>
  <path d="M510 324 L578 324" class="ln"/>
  <path d="M545 324 L545 254 L578 254" class="ln"/>
  <path d="M545 324 L545 394 L578 394" class="ln"/>

  <!-- 우측 열: 비교 제외·예외 상태 (M8, M10 의 아니오) -->
  <rect x="580" y="576" width="300" height="216" rx="6" class="ext"/>
  <text x="730" y="596" class="t tb" text-anchor="middle">비교 제외 · 예외 상태 (속성 비교 없음)</text>
  <text x="594" y="620" class="t tm">읽기 실패한 대상 (위 분기)</text>
  <text x="594" y="638" class="t">XML_READONLY  Cisco XML, 비교 제외(회색)</text>
  <text x="594" y="654" class="t">접속 오류 · CANCELED  상태 그대로 표시</text>
  <text x="594" y="680" class="t tm">같은 모델 기준 없음 (아래 분기)</text>
  <text x="594" y="698" class="t">REFERENCE  기준 호스트 자신 (OK 줄)</text>
  <text x="594" y="714" class="t">NO_REFERENCE  이 모델의 기준 없음</text>
  <text x="594" y="730" class="t">REF_UNREACHABLE  후보 기준 접속 실패</text>
  <text x="594" y="746" class="t">REF_CANCELED  후보 기준 조회를 취소함</text>
  <path d="M510 602 L578 602" class="ln"/>
  <text x="520" y="596" class="t tm">아니오</text>
  <path d="M510 766 L578 766" class="ln"/>
  <text x="520" y="760" class="t tm">아니오</text>
  <path d="M730 792 L730 1036 L512 1036" class="dash"/>
  <text x="742" y="900" class="t tm">비교 못 한 호스트도</text>
  <text x="742" y="916" class="t tm">결과 줄 1개 (N/A)</text>

  <!-- 범례 -->
  <rect x="50" y="1342" width="14" height="14" class="box"/><text x="70" y="1353" class="t tm">처리</text>
  <rect x="120" y="1342" width="14" height="14" class="dec"/><text x="140" y="1353" class="t tm">판정</text>
  <rect x="190" y="1342" width="14" height="14" class="ldap"/><text x="210" y="1353" class="t tm">기준 지정 3가지</text>
  <rect x="330" y="1342" width="14" height="14" class="sec"/><text x="350" y="1353" class="t tm">읽기 전용 수집</text>
  <rect x="460" y="1342" width="14" height="14" class="ext"/><text x="480" y="1353" class="t tm">예외·제외 (점선)</text>
</svg>
