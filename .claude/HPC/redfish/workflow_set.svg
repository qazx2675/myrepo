<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 2406" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="설정(Pending 적용) 내부 처리 흐름">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="2406" class="bg"/>
  <text x="450" y="30" class="t ttl" text-anchor="middle">설정(Pending 적용) 내부 처리 흐름 (bash bios.sh · TUI 의 수정 단계)</text>

  <!-- M0 -->
  <rect x="60" y="52" width="460" height="68" rx="6" class="box"/>
  <text x="290" y="74" class="t tb" text-anchor="middle">수정 단계 진입 (TUI 결과 화면에서 e)</text>
  <text x="290" y="90" class="t" text-anchor="middle">bash bios.sh → biostool bios, 점검 결과(프로파일 · 전체비교) 화면</text>
  <text x="290" y="106" class="t" text-anchor="middle">덤프 읽기(-from-dump) 모드는 설정하지 않음</text>

  <!-- M1 -->
  <rect x="60" y="144" width="460" height="84" rx="6" class="sec"/>
  <text x="290" y="166" class="t tb" text-anchor="middle">설정 대상 선정 — verified=Y 정확 모델 행만</text>
  <text x="290" y="182" class="t" text-anchor="middle">FAIL = 모델을 지정한 verified=Y 행의 불일치 (점검 단계에서 판정)</text>
  <text x="290" y="198" class="t" text-anchor="middle">verified=N 행 · * 행(Y 불가)은 UNVERIFIED → 설정 불가, 수정제외</text>
  <text x="290" y="214" class="t" text-anchor="middle">XML(Cisco) 대상은 점검 전용 → 설정에서 제외</text>

  <!-- M2 -->
  <rect x="60" y="252" width="460" height="68" rx="6" class="box"/>
  <text x="290" y="274" class="t tb" text-anchor="middle">buildSetPlan — 후보 항목 수집 (BMC 접속 없음)</text>
  <text x="290" y="290" class="t" text-anchor="middle">FAIL · PENDING_NO_JOB(설정 가능) · PENDING_EXISTS(verified=Y)</text>
  <text x="290" y="306" class="t" text-anchor="middle">접속 · 조회에 실패한 호스트는 후보 없음 (N/A)</text>

  <!-- M3 -->
  <rect x="60" y="344" width="460" height="84" rx="6" class="sec"/>
  <text x="290" y="366" class="t tb" text-anchor="middle">보호 속성 제외 (protect.go — 코드 고정)</text>
  <text x="290" y="382" class="t" text-anchor="middle">서버 고유값(IQN·IP·ServerName) · 부팅 · 보안 · RAID · PXE · NIC 관련</text>
  <text x="290" y="398" class="t" text-anchor="middle">내장 패턴 ∪ bios.conf protect_attrs(더하기만) — 끌 수 없음</text>
  <text x="290" y="414" class="t" text-anchor="middle">걸리면 설정 항목이 되지 않고 [보호] 수정제외로 표시</text>

  <!-- M4 -->
  <rect x="60" y="452" width="460" height="100" rx="6" class="box"/>
  <text x="290" y="474" class="t tb" text-anchor="middle">그 밖의 수정제외 걸러내기</text>
  <text x="290" y="490" class="t" text-anchor="middle">위험 속성명(비밀번호 · restore · bootorder · clear 등)은 수정제외</text>
  <text x="290" y="506" class="t" text-anchor="middle">시스템 프로파일 성격 속성은 호스트당 1개만</text>
  <text x="290" y="522" class="t" text-anchor="middle">쓰기 벤더 Dell · HPE · Lenovo, Settings 경로, 모델명 확인</text>
  <text x="290" y="538" class="t" text-anchor="middle">남의 Pending: Dell 은 호스트 제외, 그 외는 포함 여부 질문 대상</text>

  <!-- M5 -->
  <rect x="60" y="576" width="460" height="52" rx="6" class="dec"/>
  <text x="290" y="598" class="t tb" text-anchor="middle">설정할 항목이 있는가 ?</text>
  <text x="290" y="614" class="t" text-anchor="middle">호스트 · 항목 건수 집계 (BMC Pending 까지만, 재부팅 없음)</text>

  <!-- M6 -->
  <rect x="60" y="652" width="460" height="68" rx="6" class="dec"/>
  <text x="290" y="674" class="t tb" text-anchor="middle">수정 미리보기 + 확인 1</text>
  <text x="290" y="690" class="t" text-anchor="middle">호스트별 현재값 -&gt; 변경값 (수정대상) / (수정제외: 사유)</text>
  <text x="290" y="706" class="t" text-anchor="middle">"위 수정대상을 적용할까요?"</text>

  <!-- M7 -->
  <rect x="60" y="744" width="460" height="52" rx="6" class="dec"/>
  <text x="290" y="766" class="t tb" text-anchor="middle">확인 2 — 수정제외 확인 (있을 때만)</text>
  <text x="290" y="782" class="t" text-anchor="middle">수정제외 항목만 다시 보이고 "진행할까요?" 를 한 번 더 묻는다</text>

  <!-- M8 -->
  <rect x="60" y="820" width="460" height="68" rx="6" class="dec"/>
  <text x="290" y="842" class="t tb" text-anchor="middle">확인 3 — 남의 Pending 장비 (있을 때만)</text>
  <text x="290" y="858" class="t" text-anchor="middle">호스트 · 속성 · Pending 값을 보이고 포함 여부 질문</text>
  <text x="290" y="874" class="t" text-anchor="middle">y 포함 · n 그 호스트는 건드리지 않음(PENDING_EXISTS) · Ctrl+X 취소</text>

  <!-- M9 -->
  <rect x="60" y="912" width="460" height="84" rx="6" class="box"/>
  <text x="290" y="934" class="t tb" text-anchor="middle">applySetPlan — 호스트별 묶기 · 실행 준비</text>
  <text x="290" y="950" class="t" text-anchor="middle">계획이 점검 결과(호스트 · 항목)와 다르면 아무것도 보내지 않음</text>
  <text x="290" y="966" class="t" text-anchor="middle">같은 BMC(IP:포트)를 가리키면 앞 대상만 처리 (DUPLICATE_TARGET)</text>
  <text x="290" y="982" class="t" text-anchor="middle">동시 접속 concurrency · AUTH_FAIL 차단기 · Ctrl+X: 미시작 호스트 취소</text>

  <!-- M10 -->
  <rect x="60" y="1020" width="460" height="84" rx="6" class="sec"/>
  <text x="290" y="1042" class="t tb" text-anchor="middle">호스트별 접속 전 재검증 (runHost)</text>
  <text x="290" y="1058" class="t" text-anchor="middle">보호 속성이 하나라도 있으면 접속 없이 통째로 PROTECTED_ATTR</text>
  <text x="290" y="1074" class="t" text-anchor="middle">프로파일 재대조 — 모델 지정 verified=Y 행이 없으면 UNVERIFIED</text>
  <text x="290" y="1090" class="t" text-anchor="middle">벤더가 Dell · HPE · Lenovo 가 아니면 SET_NOT_SUPPORTED_VENDOR</text>

  <!-- M11 -->
  <rect x="60" y="1128" width="460" height="84" rx="6" class="box"/>
  <text x="290" y="1150" class="t tb" text-anchor="middle">호스트별 로그인 1회 (쓰기 허용 클라이언트)</text>
  <text x="290" y="1166" class="t" text-anchor="middle">세션 생성 1회 (미지원이면 Basic), 401/403 은 AUTH_FAIL — 재시도 안 함</text>
  <text x="290" y="1182" class="t" text-anchor="middle">1순위 계정이 거부되면 rf.conf 2순위 계정으로 1회 더</text>
  <text x="290" y="1198" class="t" text-anchor="middle">로그인 · 조회 실패는 UNREACHABLE · TIMEOUT 등 호스트 오류로 종료</text>

  <!-- M12 -->
  <rect x="60" y="1236" width="460" height="68" rx="6" class="dec"/>
  <text x="290" y="1258" class="t tb" text-anchor="middle">재조회 (GET) — 점검 이후 달라졌는가 ?</text>
  <text x="290" y="1274" class="t" text-anchor="middle">시스템 정보 · Bios 현재값 · Settings Pending 을 다시 읽어 판정</text>
  <text x="290" y="1290" class="t" text-anchor="middle">변하지 않았을 때만 아래로 진행</text>

  <!-- M13 -->
  <rect x="60" y="1328" width="460" height="100" rx="6" class="box"/>
  <text x="290" y="1350" class="t tb" text-anchor="middle">레지스트리 사전검증 · 보낼 값 확정</text>
  <text x="290" y="1366" class="t" text-anchor="middle">ReadOnly → SKIPPED_READONLY · 허용값 · 형식 밖 → INVALID_VALUE</text>
  <text x="290" y="1382" class="t" text-anchor="middle">허용값 A|B 중 BMC 가 받는 표기를 고름 (예: Enable)</text>
  <text x="290" y="1398" class="t" text-anchor="middle">레지스트리를 못 읽으면 현재값의 JSON 형식을 따름 (결과에 사유 표시)</text>
  <text x="290" y="1414" class="t" text-anchor="middle">비교서버 값은 Enumeration · Integer · Boolean 만 보냄</text>

  <!-- M14 -->
  <rect x="60" y="1452" width="460" height="68" rx="6" class="dec"/>
  <text x="290" y="1474" class="t tb" text-anchor="middle">시스템 프로파일 종속 규칙</text>
  <text x="290" y="1490" class="t" text-anchor="middle">프로파일 변경 중이고 목표가 Custom 이 아니면 프로파일 항목만 보냄</text>
  <text x="290" y="1506" class="t" text-anchor="middle">나머지는 DEPENDS_ON_PROFILE → 재부팅 후 재점검해 다시 설정</text>

  <!-- M15 -->
  <rect x="60" y="1544" width="460" height="84" rx="6" class="box"/>
  <text x="290" y="1566" class="t tb" text-anchor="middle">PATCH 본문 구성 (호스트당 1개)</text>
  <text x="290" y="1582" class="t" text-anchor="middle">{"Attributes":{속성:값, …}} — 값은 레지스트리 형식(문자열 · 정수 · 불리언)</text>
  <text x="290" y="1598" class="t" text-anchor="middle">Bios 가 OnReset 을 지원할 때만 @Redfish.SettingsApplyTime=OnReset</text>
  <text x="290" y="1614" class="t" text-anchor="middle">Dell: Job 본문은 TargetSettingsURI 하나뿐 (재부팅 필드 없음)</text>

  <!-- M16 -->
  <rect x="60" y="1652" width="460" height="84" rx="6" class="sec"/>
  <text x="290" y="1674" class="t tb" text-anchor="middle">전송 직전 허용목록 · 본문 검사 (redfish.go)</text>
  <text x="290" y="1690" class="t" text-anchor="middle">PATCH: Bios/Settings · Pending 만 / POST: Managers/&lt;id&gt;/Jobs 만</text>
  <text x="290" y="1706" class="t" text-anchor="middle">Immediate 금지(OnReset 만), 위험 · 보호 속성 · 허용 밖 키는 거부</text>
  <text x="290" y="1722" class="t" text-anchor="middle">PATCH 직전 실제 본문 속성의 보호 여부를 한 번 더 확인</text>

  <!-- M17 -->
  <rect x="60" y="1760" width="460" height="84" rx="6" class="box"/>
  <text x="290" y="1782" class="t tb" text-anchor="middle">PATCH 1회 — BMC 의 Pending 에 기록</text>
  <text x="290" y="1798" class="t" text-anchor="middle">PATCH Systems/&lt;id&gt;/Bios/Settings · 재시도 없음 · 재부팅 / 리셋 없음</text>
  <text x="290" y="1814" class="t" text-anchor="middle">400 REJECTED · 404/405/501 SET_UNSUPPORTED · 401/403 AUTH_FAIL</text>
  <text x="290" y="1830" class="t" text-anchor="middle">5xx · 타임아웃 · 끊김 SET_ERROR (쓰기 결과 불명 — 재시도 안 함)</text>

  <!-- M18 -->
  <rect x="60" y="1868" width="460" height="84" rx="6" class="ldap"/>
  <text x="290" y="1890" class="t tb" text-anchor="middle">[Dell 만] BIOS 설정 Job 확인 · 생성 (HPE · Lenovo 는 건너뜀)</text>
  <text x="290" y="1906" class="t" text-anchor="middle">PATCH 가 202 이거나 새 BIOS 설정 Job(예약 상태)이 확인되면 POST 생략</text>
  <text x="290" y="1922" class="t" text-anchor="middle">없으면 Managers/&lt;id&gt;/Jobs 에 TargetSettingsURI 만 담아 POST 1회</text>
  <text x="290" y="1938" class="t" text-anchor="middle">Job 생성 실패 → 이 호스트 항목은 APPLY_UNCONFIRMED</text>

  <!-- M19 -->
  <rect x="60" y="1976" width="460" height="68" rx="6" class="dec"/>
  <text x="290" y="1998" class="t tb" text-anchor="middle">Settings 재조회 — Pending 이 보낸 값과 같은가 ?</text>
  <text x="290" y="2014" class="t" text-anchor="middle">GET Bios/Settings 로 항목별 Pending 값을 비교</text>
  <text x="290" y="2030" class="t" text-anchor="middle">같으면 APPLIED (PATCH 응답 코드와 Pending 값을 사유에 기록)</text>

  <!-- M20 -->
  <rect x="60" y="2068" width="460" height="68" rx="6" class="box"/>
  <text x="290" y="2090" class="t tb" text-anchor="middle">호스트 결과 분류 · 요약 (TUI "설정 결과" 화면)</text>
  <text x="290" y="2106" class="t" text-anchor="middle">[완료] 모든 항목 APPLIED/ALREADY_OK · [미반영] 그 외 · [제외] · [취소]</text>
  <text x="290" y="2122" class="t" text-anchor="middle">"설정 결과: 완료 N대, 실패 · 미반영 M대, 취소, 제외" + 항목별 줄</text>

  <!-- M21 -->
  <rect x="60" y="2160" width="460" height="84" rx="6" class="box"/>
  <text x="290" y="2182" class="t tb" text-anchor="middle">결과 파일 기록 (점검 결과 폴더, 0600)</text>
  <text x="290" y="2198" class="t" text-anchor="middle">apply_result.tsv(항목별 상태) · applied.txt(APPLIED 호스트)</text>
  <text x="290" y="2214" class="t" text-anchor="middle">apply_failed.txt(실패 · 미확인, 있을 때만)</text>
  <text x="290" y="2230" class="t" text-anchor="middle">apply_requests.txt(실제로 보낸 PATCH · Job 과 결과)</text>

  <!-- M22 -->
  <rect x="60" y="2268" width="460" height="68" rx="6" class="ext"/>
  <text x="290" y="2290" class="t tb" text-anchor="middle">끝 — 재부팅은 하지 않음</text>
  <text x="290" y="2306" class="t" text-anchor="middle">설정은 BMC Pending 까지, 다음 재부팅(OS 설치 등) 때 BIOS 에 반영</text>
  <text x="290" y="2322" class="t" text-anchor="middle">반영 후 재점검하고, 임의의 몇 대는 직접 확인할 것</text>

  <path d="M290 120 L290 144" class="ln"/>
  <path d="M290 228 L290 252" class="ln"/>
  <path d="M290 320 L290 344" class="ln"/>
  <path d="M290 428 L290 452" class="ln"/>
  <path d="M290 552 L290 576" class="ln"/>
  <path d="M290 628 L290 652" class="ln"/>
  <text x="296" y="644" class="t tm">있음</text>
  <path d="M290 720 L290 744" class="ln"/>
  <text x="296" y="736" class="t tm">예</text>
  <path d="M290 796 L290 820" class="ln"/>
  <text x="296" y="812" class="t tm">예</text>
  <path d="M290 888 L290 912" class="ln"/>
  <path d="M290 996 L290 1020" class="ln"/>
  <path d="M290 1104 L290 1128" class="ln"/>
  <path d="M290 1212 L290 1236" class="ln"/>
  <path d="M290 1304 L290 1328" class="ln"/>
  <text x="296" y="1320" class="t tm">그대로</text>
  <path d="M290 1428 L290 1452" class="ln"/>
  <path d="M290 1520 L290 1544" class="ln"/>
  <path d="M290 1628 L290 1652" class="ln"/>
  <path d="M290 1736 L290 1760" class="ln"/>
  <path d="M290 1844 L290 1868" class="ln"/>
  <path d="M290 1952 L290 1976" class="ln"/>
  <path d="M290 2044 L290 2068" class="ln"/>
  <text x="296" y="2060" class="t tm">일치</text>
  <path d="M290 2136 L290 2160" class="ln"/>
  <path d="M290 2244 L290 2268" class="ln"/>

  <!-- R0 -->
  <rect x="600" y="52" width="280" height="84" rx="6" class="ext"/>
  <text x="740" y="74" class="t tb" text-anchor="middle">비대화형 · 평문은 설정 없음</text>
  <text x="740" y="90" class="t" text-anchor="middle">-plain · -auto · -auto-check 는</text>
  <text x="740" y="106" class="t" text-anchor="middle">점검만 하고 설정 질문 없음</text>
  <text x="740" y="122" class="t" text-anchor="middle">(applySetPlan 은 TUI 에서만 호출)</text>
  <path d="M600 86 L522 86" class="dash"/>

  <!-- R2 -->
  <rect x="600" y="252" width="280" height="100" rx="6" class="ext"/>
  <text x="740" y="274" class="t tb" text-anchor="middle">선택: 전체비교 차이 합치기</text>
  <text x="740" y="290" class="t" text-anchor="middle">bios.conf allcheck_set=on 일 때만</text>
  <text x="740" y="306" class="t" text-anchor="middle">같은 모델 · BIOS 버전 · 속성 목록</text>
  <text x="740" y="322" class="t" text-anchor="middle">프로파일과 목표값이 다르면</text>
