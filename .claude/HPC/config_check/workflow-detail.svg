  <text x="415" y="1388" fill="#ffffff" font-size="16" font-weight="bold">7. 마무리 출력 (최종 상태 기준)</text>
  <text x="415" y="1410" fill="#dbeafe" font-size="12">① AI GPU 서버(OK만 ai_server_script)  ② 벤더별 코멘트(OFF 대상, D 는 OK 대상 코멘트 포함)  ③ 전체 OK 공통 코멘트</text>
  <text x="415" y="1430" fill="#dbeafe" font-size="12">④ DHCP 정보(OFF 목록을 ssh 1회, a.sh)  ⑤ 기타 상태 서버(pingO_sshx / no_mgmt-autofs / os_install / no_output)</text>
  <text x="415" y="1450" fill="#dbeafe" font-size="12">⑥ usb0 disabled 필요 서버   ⑦ VWP 사용 VM(ev) 서버 (vm_inventory 대조, 빨간 깜빡임 경고)</text>
  <text x="415" y="1470" fill="#fef08a" font-size="12" font-weight="bold">-auto: 결과 리포트 블록(####…)으로 감싸고 완료기록 기록 (-auto-check 는 완료기록 없음)</text>
