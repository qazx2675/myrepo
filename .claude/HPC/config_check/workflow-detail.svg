<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1e293b"/><stop offset="50%" stop-color="#334155"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="blueBox" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="emeraldBox" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#047857"/><stop offset="100%" stop-color="#065f46"/></linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#92400e"/></linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6d28d9"/><stop offset="100%" stop-color="#5b21b6"/></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="1140" height="85" rx="12" fill="url(#headerGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="62" fill="#f8fafc" font-size="24" font-weight="bold">config_check.sh — 내부 처리 흐름 상세도</text>
  <text x="60" y="90" fill="#94a3b8" font-size="14">OS 체크 + 환경설정 적용 + 재체크 + 벤더/DHCP 코멘트 (gossh 기반)   실행: bash config_check.sh [-auto | -auto-check &lt;user&gt; &lt;목록파일&gt;]</text>
  <rect x="960" y="42" width="185" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="1052" y="63" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">.claude/HPC/config_check</text>
  <!-- Left: setup -->
  <rect x="30" y="135" width="320" height="370" rx="12" fill="url(#stepGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="135" width="320" height="38" rx="12" fill="#1e293b"/>
  <text x="50" y="160" fill="#38bdf8" font-size="15" font-weight="bold">0. 설정 블록 및 공통 모듈</text>
  <rect x="48" y="190" width="284" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="212" fill="#e2e8f0" font-size="13" font-weight="bold">고정 경로 변수</text>
  <text x="62" y="232" fill="#94a3b8" font-size="11">• user_info_mn / user_info_output (info*.sh)</text>
  <text x="62" y="250" fill="#94a3b8" font-size="11">• check_script = .../check/os/run.sh</text>
  <text x="62" y="268" fill="#94a3b8" font-size="11">• insert_file / appl_setting_file / setting_file</text>
  <rect x="48" y="296" width="284" height="100" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="318" fill="#e2e8f0" font-size="13" font-weight="bold">환경 맞춤 변수 (빈 값이면 해당 기능 생략)</text>
  <text x="62" y="338" fill="#94a3b8" font-size="11">• os6_host, uptime_enable_user, dhcp_server</text>
  <text x="62" y="355" fill="#94a3b8" font-size="11">• ai_server_list / ai_server_script, vm_inventory</text>
  <text x="62" y="372" fill="#94a3b8" font-size="11">• auto_done_dir / auto_done_host (-auto 완료기록)</text>
  <text x="62" y="389" fill="#fbbf24" font-size="11">• gsh(): gossh 실행 중에만 INT 무시 (Ctrl+C 유지)</text>
  <rect x="48" y="408" width="284" height="88" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="430" fill="#e2e8f0" font-size="13" font-weight="bold">내장 AWK 헬퍼</text>
  <text x="62" y="449" fill="#94a3b8" font-size="11">• VENDOR_AWK: 호스트 접두사 → 벤더 D/S/L/J/T/W/X</text>
  <text x="62" y="466" fill="#94a3b8" font-size="10">  D: c·h·sh·s2h~s4h / S: 그 외 s / L: p / J: l / T: d / W: m</text>
  <text x="62" y="484" fill="#94a3b8" font-size="11">• EXPAND_AWK: host[01-03] 압축 표기 전개</text>
  <rect x="30" y="525" width="320" height="295" rx="12" fill="url(#stepGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="525" width="320" height="38" rx="12" fill="#1e293b"/>
  <text x="50" y="550" fill="#a78bfa" font-size="15" font-weight="bold">호스트 상태 코드 (&lt;이름&gt;.state)</text>
  <rect x="48" y="580" width="65" height="26" rx="5" fill="#065f46" stroke="#34d399"/>
  <text x="80" y="598" fill="#ecfdf5" font-size="12" font-weight="bold" text-anchor="middle">OK</text>
  <text x="122" y="598" fill="#cbd5e1" font-size="11">체크 결과 있음 (적용·재체크 대상)</text>
  <rect x="48" y="618" width="65" height="26" rx="5" fill="#9f1239" stroke="#fb7185"/>
  <text x="80" y="636" fill="#fff1f2" font-size="12" font-weight="bold" text-anchor="middle">OFF</text>
  <text x="122" y="636" fill="#cbd5e1" font-size="11">pingX — 타임아웃·DNS 실패</text>
  <rect x="48" y="656" width="65" height="26" rx="5" fill="#92400e" stroke="#fbbf24"/>
  <text x="80" y="674" fill="#fffbeb" font-size="12" font-weight="bold" text-anchor="middle">REF</text>
  <text x="122" y="674" fill="#cbd5e1" font-size="11">pingO_sshx — 접속 거부</text>
  <rect x="48" y="694" width="65" height="26" rx="5" fill="#1e40af" stroke="#60a5fa"/>
  <text x="80" y="712" fill="#eff6ff" font-size="12" font-weight="bold" text-anchor="middle">INST</text>
  <text x="122" y="712" fill="#cbd5e1" font-size="11">os_install — OS 설치 중/미완료</text>
  <rect x="48" y="732" width="65" height="26" rx="5" fill="#5b21b6" stroke="#c084fc"/>
  <text x="80" y="750" fill="#f5f3ff" font-size="12" font-weight="bold" text-anchor="middle">NOSV</text>
  <text x="122" y="750" fill="#cbd5e1" font-size="11">no_mgmt-autofs — gossh 분류 결과</text>
  <rect x="48" y="770" width="65" height="26" rx="5" fill="#334155" stroke="#94a3b8"/>
  <text x="80" y="788" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">NONE</text>
  <text x="122" y="788" fill="#cbd5e1" font-size="11">no_output — 접속됐으나 체크 출력 0줄</text>
  <text x="48" y="812" fill="#64748b" font-size="10.5">OFF/REF/INST/NOSV 는 gossh 결과 파일에서 분류</text>
  <rect x="30" y="840" width="320" height="640" rx="12" fill="url(#stepGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="840" width="320" height="38" rx="12" fill="#1e293b"/>
  <text x="50" y="865" fill="#38bdf8" font-size="15" font-weight="bold">산출물 구조</text>
  <text x="50" y="898" fill="#f8fafc" font-size="12" font-family="monospace">/tmp/config_check.XXXXXX/  (종료 시 자동 삭제)</text>
  <text x="50" y="926" fill="#cbd5e1" font-size="11.5" font-family="monospace">├─ hosts</text>
  <text x="50" y="941" fill="#94a3b8" font-size="10.5">정제된 전체 대상 호스트</text>
  <text x="50" y="960" fill="#34d399" font-size="11.5" font-family="monospace">├─ first.* / recheck.*</text>
  <text x="50" y="975" fill="#94a3b8" font-size="10.5">1차 체크 / 재체크 결과</text>
  <text x="50" y="994" fill="#94a3b8" font-size="11.5" font-family="monospace">│   .out .err</text>
  <text x="50" y="1009" fill="#94a3b8" font-size="10.5">gossh 원문(정렬됨) / stderr</text>
  <text x="50" y="1028" fill="#94a3b8" font-size="11.5" font-family="monospace">│   .set .state</text>
  <text x="50" y="1043" fill="#94a3b8" font-size="10.5">결과 파일 전개 / 호스트별 상태</text>
  <text x="50" y="1062" fill="#fb7185" font-size="11.5" font-family="monospace">│   .fail .usb0</text>
  <text x="50" y="1077" fill="#94a3b8" font-size="10.5">FAIL 줄 / usb0 필요 호스트</text>
  <text x="50" y="1096" fill="#c084fc" font-size="11.5" font-family="monospace">│   .ldap .splunk .os</text>
  <text x="50" y="1111" fill="#94a3b8" font-size="10.5">호스트&lt;TAB&gt;정규화된 값</text>
  <text x="50" y="1130" fill="#fbbf24" font-size="11.5" font-family="monospace">├─ ok.txt</text>
  <text x="50" y="1145" fill="#94a3b8" font-size="10.5">설정 적용·재체크 대상(OK)</text>
  <text x="50" y="1164" fill="#fbbf24" font-size="11.5" font-family="monospace">├─ setting.out / .err</text>
  <text x="50" y="1179" fill="#94a3b8" font-size="10.5">설정 스크립트 출력</text>
  <text x="50" y="1198" fill="#fbbf24" font-size="11.5" font-family="monospace">├─ final.state</text>
  <text x="50" y="1213" fill="#94a3b8" font-size="10.5">재체크 결과를 덮은 최종 상태</text>
  <text x="50" y="1232" fill="#64748b" font-size="11.5" font-family="monospace">└─ V_&lt;벤더&gt;.ok / .off</text>
  <text x="50" y="1247" fill="#94a3b8" font-size="10.5">벤더별 코멘트용 목록</text>
  <text x="50" y="1274" fill="#f8fafc" font-size="12" font-weight="bold">실행 디렉터리에 남는 파일</text>
  <text x="50" y="1294" fill="#cbd5e1" font-size="11">• check.res_${user}  : 체크 결과 원문</text>
  <text x="50" y="1312" fill="#cbd5e1" font-size="11">• check.res_${user}_postapply : -auto 재체크 결과</text>
  <text x="50" y="1330" fill="#cbd5e1" font-size="11">• check.info_${user}  : 20대 이상 값별 호스트</text>
  <rect x="48" y="1385" width="284" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="1407" fill="#fbbf24" font-size="13" font-weight="bold">안정성 처리</text>
  <text x="62" y="1427" fill="#cbd5e1" font-size="11">• trap EXIT 로 임시 디렉터리 정리</text>
  <text x="62" y="1444" fill="#cbd5e1" font-size="11">• run.sh 뒤 "; :" 로 종료코드 0 강제 (stderr 분리 방지)</text>
  <text x="62" y="1460" fill="#cbd5e1" font-size="11">• -pm 은 반드시 -w 보다 앞에 둔다</text>
  <!-- Main -->
  <rect x="390" y="135" width="780" height="95" rx="12" fill="url(#blueBox)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="415" y="165" fill="#ffffff" font-size="16" font-weight="bold">1. user 선택 및 대상 파일 확인</text>
  <text x="415" y="190" fill="#dbeafe" font-size="12.5">• 대화형: info_mn.sh 목록 출력 → 번호 입력 → info.sh 로 user 확정   /   -auto·-auto-check: &lt;user&gt; &lt;목록파일&gt; 인자 사용</text>
  <text x="415" y="212" fill="#dbeafe" font-size="12.5">• 대상 목록 ${user}.txt 가 실행 디렉터리에 없으면 즉시 종료 (EOF 입력도 종료)</text>
  <line x1="780" y1="230" x2="780" y2="260" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="390" y="265" width="780" height="105" rx="12" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="415" y="295" fill="#38bdf8" font-size="16" font-weight="bold">2. 작업 대상 리스트 정제 및 출력</text>
  <text x="415" y="320" fill="#e2e8f0" font-size="12.5">• 공백·줄바꿈 혼용 파싱, 중복 제거 → $TMP/hosts, TOTAL 계산 (호스트 0대면 종료)</text>
  <text x="415" y="342" fill="#cbd5e1" font-size="12.5">• 30행 단위 다열 출력 (탭이 아닌 공백으로 열 맞춤)</text>
  <text x="415" y="362" fill="#cbd5e1" font-size="12.5">• 접두사(숫자 앞 문자열)별 수량 "a * 3ea" + "총 N EA" 출력</text>
  <line x1="780" y1="370" x2="780" y2="400" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="390" y="405" width="780" height="90" rx="12" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="415" y="435" fill="#38bdf8" font-size="16" font-weight="bold">3. 작업 진행 확인 및 uptime 조회</text>
  <text x="415" y="460" fill="#e2e8f0" font-size="12.5">• "작업을 진행하시겠습니까? (y/n)" → n 이면 종료 (-auto 는 자동 y)</text>
  <text x="415" y="482" fill="#fbbf24" font-size="12.5">• [조건부] user 가 uptime_enable_user 와 일치하면 gsh -script -w hosts "uptime" 실행</text>
  <line x1="780" y1="495" x2="780" y2="525" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="390" y="530" width="780" height="290" rx="12" fill="url(#emeraldBox)" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="415" y="562" fill="#ffffff" font-size="17" font-weight="bold">4. 1차 OS 체크 — do_check hosts first (gossh 1회)</text>
  <rect x="415" y="575" width="730" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="430" y="598" fill="#a7f3d0" font-size="13" font-family="monospace">gsh -pm -script -w "$t" "bash $check_script pd; :" &gt; first.out 2&gt; first.err</text>
  <rect x="415" y="625" width="230" height="180" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="430" y="648" fill="#34d399" font-size="12.5" font-weight="bold">① 상태 분류 (.set → .state)</text>
  <text x="430" y="668" fill="#cbd5e1" font-size="11">• gossh 결과 파일 5종을</text>
  <text x="430" y="685" fill="#cbd5e1" font-size="11">  EXPAND_AWK 로 호스트 전개</text>
  <text x="430" y="702" fill="#cbd5e1" font-size="11">• 파일에 없으면 OK,</text>
  <text x="430" y="719" fill="#cbd5e1" font-size="11">  있으면 OFF/REF/INST/NOSV</text>
  <text x="430" y="736" fill="#cbd5e1" font-size="11">• 출력 0줄인 OK → NONE</text>
  <text x="430" y="753" fill="#cbd5e1" font-size="11">• .out 은 호스트명 기준 정렬</text>
  <rect x="665" y="625" width="230" height="180" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="680" y="648" fill="#34d399" font-size="12.5" font-weight="bold">② 값 추출 (OK 호스트만)</text>
  <text x="680" y="668" fill="#cbd5e1" font-size="11">• FAIL 줄 → .fail</text>
  <text x="680" y="685" fill="#cbd5e1" font-size="11">• FAIL + usb0 + interface</text>
  <text x="680" y="702" fill="#cbd5e1" font-size="11">  → .usb0</text>
  <text x="680" y="719" fill="#cbd5e1" font-size="11">• INFO/FAIL ldap 다음 토큰</text>
  <text x="680" y="736" fill="#cbd5e1" font-size="11">  → .ldap (Undefined→undefined)</text>
  <text x="680" y="753" fill="#cbd5e1" font-size="11">• INFO splunk → .splunk</text>
  <text x="680" y="770" fill="#cbd5e1" font-size="11">• INFO 중 std 포함 → .os</text>
  <rect x="915" y="625" width="230" height="180" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="930" y="648" fill="#34d399" font-size="12.5" font-weight="bold">③ 리포트 출력 순서</text>
  <text x="930" y="668" fill="#cbd5e1" font-size="11">• FAIL 목록 (없으면 NO FAIL,</text>
  <text x="930" y="685" fill="#cbd5e1" font-size="11">  OK 호스트 0대면 미출력)</text>
  <text x="930" y="702" fill="#cbd5e1" font-size="11">• LDAP → 상태줄 → 조합</text>
  <text x="930" y="719" fill="#cbd5e1" font-size="11">• Splunk → OS 값 요약</text>
  <text x="930" y="736" fill="#cbd5e1" font-size="11">• 값별 호스트 20대 이상은</text>
  <text x="930" y="753" fill="#cbd5e1" font-size="11">  check.info_${user} 저장</text>
  <text x="930" y="770" fill="#cbd5e1" font-size="11">• check.res_${user} 저장</text>
  <line x1="780" y1="820" x2="780" y2="850" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <rect x="390" y="855" width="780" height="310" rx="12" fill="url(#stepGrad)" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="415" y="887" fill="#fbbf24" font-size="17" font-weight="bold">5. 환경설정 수정 분기 — "환경설정을 수정하시겠습니까? (y / n / set)"</text>
  <text x="415" y="909" fill="#94a3b8" font-size="11.5">-auto: 목록에 p/d 로 시작하는 호스트가 있으면 set, 없으면 y   /   -auto-check: 항상 n</text>
  <rect x="415" y="925" width="230" height="170" rx="8" fill="url(#amberBox)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="530" y="950" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">[ y ] 설정 적용</text>
  <line x1="430" y1="960" x2="630" y2="960" stroke="#fcd34d" stroke-width="1" stroke-opacity="0.4"/>
  <text x="430" y="980" fill="#fef3c7" font-size="11.5">• 대상: OK 호스트만 (ok.txt)</text>
  <text x="430" y="1000" fill="#fef3c7" font-size="11.5">• gsh -script -w ok.txt 1회</text>
  <text x="430" y="1022" fill="#ffffff" font-size="11.5" font-weight="bold">  bash setting_insert.sh;</text>
  <text x="430" y="1040" fill="#ffffff" font-size="11.5" font-weight="bold">  bash appl_change.sh</text>
  <text x="430" y="1066" fill="#ffffff" font-size="11.5" font-weight="bold">→ 이어서 재체크</text>
