  <text x="680" y="1022" fill="#ffffff" font-size="11.5" font-weight="bold">  bash setting_insert.sh;</text>
  <text x="680" y="1040" fill="#ffffff" font-size="11.5" font-weight="bold">  bash appl_change.sh;</text>
