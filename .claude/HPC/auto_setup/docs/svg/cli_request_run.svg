<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 693" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="auto_setup request manual-run &lt;jobid&gt; &lt;yml&gt; [check]">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="693" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">auto_setup request manual-run &lt;jobid&gt; &lt;yml&gt; [check]</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">CLI · 수동 OS 체크 요청 — TUI h→c (기본) / h→t (check) 와 같음</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">auto_setup request manual-run &lt;jobid&gt; &lt;yml&gt; [check]</text>
  <text x="265" y="92" class="t" text-anchor="middle">check 를 붙이면 설정체크만, 없으면 설정체크 + 설정수정</text>
  <path d="M265 102 L265 130" class="ln"/>
  <rect x="40" y="130" width="450" height="30" rx="6" class="dec"/>
  <text x="265" y="150" class="t tb" text-anchor="middle">인자 3개 (또는 4번째가 check) 인가?</text>
  <rect x="560" y="130" width="310" height="30" rx="6" class="ext"/>
  <text x="715" y="150" class="t tb" text-anchor="middle">사용법 출력, 종료코드 1</text>
  <path d="M490 145 L560 145" class="ln"/>
  <text x="498" y="140" class="t tm">아니오</text>
  <path d="M265 160 L265 188" class="ln"/>
  <text x="273" y="177" class="t tm">예</text>
  <rect x="40" y="188" width="450" height="78" rx="6" class="box"/>
  <text x="265" y="208" class="t tb" text-anchor="middle">writeRequest("manual-run", {jobid, yml, mode})</text>
  <text x="265" y="224" class="t" text-anchor="middle">requests/&lt;epoch&gt;_manual-run.req 를 임시 파일 → link 로 원자 기록</text>
  <text x="265" y="240" class="t" text-anchor="middle">원격 클라이언트면 gossh 로 os8_mgmt 에 기록</text>
  <text x="265" y="256" class="t" text-anchor="middle">[O] 요청 등록: &lt;파일명&gt; (파일만 남기고 CLI 는 끝)</text>
  <path d="M265 266 L265 294" class="ln"/>
  <rect x="40" y="294" width="450" height="46" rx="6" class="ldap"/>
  <text x="265" y="314" class="t tb" text-anchor="middle">데몬 collectRequests (5초 주기) → acceptManualRun</text>
  <text x="265" y="330" class="t" text-anchor="middle">job 없음 · 그룹 없음 · 같은 그룹이 이미 대기 중이면 거부</text>
  <rect x="560" y="294" width="310" height="46" rx="6" class="ext"/>
  <text x="715" y="314" class="t tb" text-anchor="middle">requests/rejected/&lt;같은 이름&gt;</text>
  <text x="715" y="330" class="t" text-anchor="middle">마지막 줄 reason=&lt;사유&gt;, 로그 [!] 요청 거부</text>
  <path d="M490 317 L560 317" class="ln"/>
  <text x="498" y="312" class="t tm">거부</text>
  <path d="M265 340 L265 368" class="ln"/>
  <rect x="40" y="368" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="388" class="t tb" text-anchor="middle">requests/active/ 에 보관 → scheduleManual</text>
  <text x="265" y="404" class="t" text-anchor="middle">자동 run 이 없을 때 시작 (동시에 1개), 시작 직전 경로 재확인(os8 응답</text>
  <text x="265" y="420" class="t" text-anchor="middle">→ local, os6 만 응답 → os6)</text>
  <path d="M265 430 L265 458" class="ln"/>
  <rect x="40" y="458" width="450" height="46" rx="6" class="ldap"/>
  <text x="265" y="478" class="t tb" text-anchor="middle">os_check_sh -auto &lt;user&gt; targets.txt  /  -auto-check (check)</text>
  <text x="265" y="494" class="t" text-anchor="middle">그룹 호스트 전체 (완료 여부와 무관, 접속불가는 결과에 따로 표시)</text>
  <path d="M265 504 L265 532" class="ln"/>
  <rect x="40" y="532" width="450" height="62" rx="6" class="sec"/>
  <text x="265" y="552" class="t tb" text-anchor="middle">codes/&lt;code&gt;.txt 생성 · 정상 실행된 호스트 처리</text>
  <text x="265" y="568" class="t" text-anchor="middle">기본(c): 완료 처리됨 / check(t): 완료·단계·실패 횟수·2차 체크 그대로</text>
  <text x="265" y="584" class="t" text-anchor="middle">끝나면 active/ 의 요청 파일 삭제</text>
  <text x="40" y="631" class="t tm">범례</text>
  <rect x="80" y="620" width="14" height="14" class="box"/>
  <text x="100" y="631" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="620" width="14" height="14" class="dec"/>
  <text x="237" y="631" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="620" width="14" height="14" class="ldap"/>
  <text x="395" y="631" class="t tm">외부 호출 (gossh · ssh · 01 · 엔진 · os_check)</text>
  <rect x="679" y="620" width="14" height="14" class="sec"/>
  <text x="699" y="631" class="t tm">기록 · 결과</text>
  <rect x="80" y="640" width="14" height="14" class="ext"/>
  <text x="100" y="651" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="668" class="t tm">코드: requests.go acceptManualRun · requests.go scheduleManual · ctl.go cmdRequest · requests.go ReqManualRun</text>
</svg>
