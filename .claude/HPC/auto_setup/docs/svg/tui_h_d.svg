<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 631" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TUI h → d — 수동 완료">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="631" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">TUI h → d — 수동 완료</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">메뉴 항목 · 화면 2 · 단축키 d 와 같음 (v0.7.1)</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">h → d  (또는 d)</text>
  <text x="265" y="92" class="t" text-anchor="middle">정말 끝난 호스트에만 사용</text>
  <path d="M265 102 L265 138" class="ln"/>
  <rect x="40" y="138" width="450" height="46" rx="6" class="dec"/>
  <text x="265" y="158" class="t tb" text-anchor="middle">완료 처리할 대상이 있는가?</text>
  <text x="265" y="174" class="t" text-anchor="middle">종료된 작업이 아님 · 호스트 또는 그룹에 미완료 호스트가 있음</text>
  <rect x="560" y="130" width="310" height="62" rx="6" class="ext"/>
  <text x="715" y="150" class="t tb" text-anchor="middle">안내만 표시, 프롬프트는 열지 않음</text>
  <text x="715" y="166" class="t" text-anchor="middle">"종료된 작업은 완료 처리할 수 없습니다" ·</text>
  <text x="715" y="182" class="t" text-anchor="middle">"이미 완료입니다" 등</text>
  <path d="M490 161 L560 161" class="ln"/>
  <text x="498" y="156" class="t tm">아니오</text>
  <path d="M265 184 L265 220" class="ln"/>
  <text x="273" y="201" class="t tm">예</text>
  <rect x="40" y="220" width="450" height="62" rx="6" class="box"/>
  <text x="265" y="240" class="t tb" text-anchor="middle">인라인 프롬프트 (startDone)</text>
  <text x="265" y="256" class="t" text-anchor="middle">수동 완료 ▶ 1 이 호스트(&lt;호스트명&gt;)  2 그룹 미완료 N대   (Esc 취소)</text>
  <text x="265" y="272" class="t" text-anchor="middle">전체 보기에서는 1 만, 이미 완료된 호스트는 호스트 선택지가 없음</text>
  <path d="M265 282 L265 310" class="ln"/>
  <rect x="40" y="310" width="450" height="62" rx="6" class="dec"/>
  <text x="265" y="330" class="t tb" text-anchor="middle">1 또는 2 → 확인 줄에서 y ?</text>
  <text x="265" y="346" class="t" text-anchor="middle">"… 완료로 처리합니다 — 부팅 시각 검증 없이 인정되고 체크스크립트는</text>
  <text x="265" y="362" class="t" text-anchor="middle">실행되지 않습니다. 계속? (y/n)"</text>
  <rect x="560" y="318" width="310" height="46" rx="6" class="ext"/>
  <text x="715" y="338" class="t tb" text-anchor="middle">Esc · q · d · y 가 아닌 키</text>
  <text x="715" y="354" class="t" text-anchor="middle">"취소했습니다"</text>
  <path d="M490 341 L560 341" class="ln"/>
  <text x="498" y="336" class="t tm">취소</text>
  <path d="M265 372 L265 400" class="ln"/>
  <text x="273" y="389" class="t tm">y</text>
  <rect x="40" y="400" width="450" height="78" rx="6" class="box"/>
  <text x="265" y="420" class="t tb" text-anchor="middle">runDone</text>
  <text x="265" y="436" class="t" text-anchor="middle">로컬 데몬(os8_mgmt): markDone(hosts, manual)</text>
  <text x="265" y="452" class="t" text-anchor="middle">원격 클라이언트(os6_mgmt): done 을 os8_mgmt 로 중계 (그룹은 done</text>
  <text x="265" y="468" class="t" text-anchor="middle">--job &lt;id&gt; --yml &lt;그룹&gt;)</text>
  <path d="M265 478 L265 506" class="ln"/>
  <rect x="40" y="506" width="450" height="46" rx="6" class="sec"/>
  <text x="265" y="526" class="t tb" text-anchor="middle">메시지: 완료 처리 요청: N대 (데몬이 5초 안에 반영)</text>
  <text x="265" y="542" class="t" text-anchor="middle">CLI auto_setup done 과 같음 — 출처 manual, 부팅 시각 검증 없음</text>
  <text x="40" y="589" class="t tm">범례</text>
  <rect x="80" y="578" width="14" height="14" class="box"/>
  <text x="100" y="589" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="578" width="14" height="14" class="dec"/>
  <text x="237" y="589" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="578" width="14" height="14" class="sec"/>
  <text x="395" y="589" class="t tm">기록 · 결과</text>
  <rect x="478" y="578" width="14" height="14" class="ext"/>
  <text x="498" y="589" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="606" class="t tm">코드: done_tui.go startDone · done_tui.go handleDone · done_tui.go runDone · done.go markDone</text>
</svg>
