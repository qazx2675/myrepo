<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 541" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TUI h — 호스트 작업 메뉴">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; }
      }
      .bg { fill: var(--bg); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .tb { font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .ttl { font-size: 18px; font-weight: bold; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .dash { stroke: var(--exs); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#ahd); }
      .ahf { fill: var(--ln); }
      .ahd { fill: var(--exs); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahd"/></marker>
  </defs>

  <rect width="900" height="541" class="bg"/>
  <text x="450" y="28" class="t ttl" text-anchor="middle">TUI h — 호스트 작업 메뉴</text>
  <text x="450" y="46" class="t tm" text-anchor="middle">키 · 화면 2 에서만 (화면 1 에서는 무반응)</text>

  <rect x="40" y="56" width="450" height="46" rx="6" class="ext"/>
  <text x="265" y="76" class="t tb" text-anchor="middle">h  (화면 2)</text>
  <text x="265" y="92" class="t" text-anchor="middle">안내 줄에서 화면 2 에만 "h 호스트 작업" 이 보임</text>
  <path d="M265 102 L265 130" class="ln"/>
  <rect x="40" y="130" width="450" height="94" rx="6" class="box"/>
  <text x="265" y="150" class="t tb" text-anchor="middle">openMenu(h) → hostMenu</text>
  <text x="265" y="166" class="t" text-anchor="middle">화면은 그대로 두고 키 안내 줄 바로 아래에 인라인 한 줄이 열림:</text>
  <text x="265" y="182" class="t" text-anchor="middle">호스트 작업 ▶ c 체크+수정  t 체크만  g 재확인  d 수동 완료  v 결과</text>
  <text x="265" y="198" class="t" text-anchor="middle">(Esc 닫기)</text>
  <text x="265" y="214" class="t" text-anchor="middle">전체 보기(a)에서는 g · d 만 표시</text>
  <path d="M265 224 L265 260" class="ln"/>
  <rect x="40" y="260" width="450" height="46" rx="6" class="dec"/>
  <text x="265" y="280" class="t tb" text-anchor="middle">누른 키는?</text>
  <text x="265" y="296" class="t" text-anchor="middle">글자(c t g d v) 또는 번호(1~5), 대소문자 무관</text>
  <rect x="560" y="252" width="310" height="62" rx="6" class="box"/>
  <text x="715" y="272" class="t tb" text-anchor="middle">Esc · q · h</text>
  <text x="715" y="288" class="t" text-anchor="middle">메뉴만 닫음 (TUI 는 종료되지 않음)</text>
  <text x="715" y="304" class="t" text-anchor="middle">그 밖의 키는 무시</text>
  <path d="M490 283 L560 283" class="ln"/>
  <text x="498" y="278" class="t tm">닫기</text>
  <path d="M265 306 L265 342" class="ln"/>
  <rect x="40" y="342" width="450" height="46" rx="6" class="box"/>
  <text x="265" y="362" class="t tb" text-anchor="middle">pickMenu — 메뉴를 닫고 같은 글자의 단축키 핸들러 실행</text>
  <text x="265" y="378" class="t" text-anchor="middle">handleDetail(c/t/g/d/v): 예전 c t g v d 를 직접 눌러도 같은 동작</text>
  <path d="M265 388 L265 416" class="ln"/>
  <rect x="40" y="416" width="450" height="46" rx="6" class="sec"/>
  <text x="265" y="436" class="t tb" text-anchor="middle">각 항목의 흐름</text>
  <text x="265" y="452" class="t" text-anchor="middle">tui_h_c · tui_h_t · tui_h_g · tui_h_d · tui_h_v</text>
  <text x="40" y="499" class="t tm">범례</text>
  <rect x="80" y="488" width="14" height="14" class="box"/>
  <text x="100" y="499" class="t tm">동작 (auto_setup)</text>
  <rect x="217" y="488" width="14" height="14" class="dec"/>
  <text x="237" y="499" class="t tm">판정 · 키 입력 · 확인</text>
  <rect x="375" y="488" width="14" height="14" class="sec"/>
  <text x="395" y="499" class="t tm">기록 · 결과</text>
  <rect x="478" y="488" width="14" height="14" class="ext"/>
  <text x="498" y="499" class="t tm">시작 · 종료 · 참고 (점선)</text>
  <text x="40" y="516" class="t tm">코드: menu_tui.go hostMenu · menu_tui.go handleMenu · menu_tui.go pickMenu · render.go menuHint</text>
</svg>
