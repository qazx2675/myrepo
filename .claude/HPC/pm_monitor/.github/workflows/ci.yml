name: pm_monitor CI (Standalone)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/HPC/pm_monitor

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Go vet
        run: go vet ./...

      - name: Go test
        # root 가 필요한 테스트(raw ICMP)는 root 가 아니면 건너뛴다
        run: go test ./...

      - name: Gofmt check
        run: test -z "$(gofmt -l .)"

      - name: Go build
        run: go build -o install_mn_os8 .

      - name: Bash syntax check
        run: |
          bash -n build.sh
          bash -n install_mn.sh
