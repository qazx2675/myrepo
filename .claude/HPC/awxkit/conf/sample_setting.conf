# awxkit 설정 파일 샘플
# 실제 사용 시 conf/${user}_setting.conf 로 복사해 값을 채우세요.
# 예: 사용자 식별자가 hong 이면 conf/hong_setting.conf

# ── AWX 접속 (여기만 채우면 doctor 까지 동작) ──────────────
awx_url        = http://10.20.30.40
username       = admin
password       = changeme
insecure_tls   = true

# ── [S1] NodeInfo ──────────────────────────────────────
s1_template        = nodeinfo
s1_hostname_key    = target_hosts  # ${user}.txt의 hostname 전체(줄바꿈 텍스트)가 이 변수 하나로 전달됨
s1_osver_key       = osver         # 실행 시 -os 플래그(예: -os 8.10) 값을 이 변수명으로 전달. 비우면 -os 사용 안 함
s1_osver_choices   =               # 선택 사항. 채우면 -os가 목록에 없을 때 오류, 비우면 -os 값을 검증 없이 그대로 사용
s1_extra_vars      =               # -os 외 다른 필수 survey 항목이 있을 때: "key=value, key2=value2" 형태로 채움
s1_fetch           = artifacts     # artifacts | stdout | remote
s1_artifact_key    =               # s1_fetch=artifacts 일 때 결과가 담긴 artifacts 키. 비우면 전체 저장
s1_remote_path     =               # s1_fetch=remote 일 때 AWX 실행노드상의 경로 (API로는 못 받아옴, 안내만)
s1_output_dir      = ./output      # 로컬 저장 경로 (실행 1회당 ${user}_nodeinfo.yaml 하나 생성)

# ── [S2] 인벤토리 동기화 ────────────────────────────────
# 실행 흐름: (1) -file로 받은 yaml 파일명을 소스의 s2_source_field에 저장(PATCH)
#           -> (2) 그 소스를 동기화(update) -> (3) s2_inventory의 등록 호스트 목록 출력
# 실행 예: bash invsync.sh -file hong_nodeinfo.yaml
#   (yaml 파일은 이 스크립트가 올리는 게 아니라, nodeinfo 이후 별도 스크립트가
#    이미 폐쇄망 git에 업로드해 둔 상태여야 함 — 파일명만 여기 넘겨주면 됨)

# 사용할 인벤토리 소스 ID. 채워두면 그 소스를 고정으로 사용(아래 목록 자동탐색을 생략).
# 비워두면 s2_inventory 밑에 있는 소스 목록을 조회해서 첫 번째(ID가 가장 작은 것)를 자동으로 씀.
# 소스가 1개뿐이면 비워둬도 되고, 여러 개인데 항상 정해진 것 하나만 써야 하면 ID를 직접 넣을 것.
s2_inventory_source =

# 동기화 대상 인벤토리 ID. AWX 웹 UI의 Inventories 메뉴에서 확인 (URL의 숫자 또는 목록의 ID 컬럼).
# s2_inventory_source가 비어있을 때 이 인벤토리 밑의 소스 목록을 조회하는 데도 쓰이고,
# 동기화 완료 후 등록된 호스트 목록을 출력하는 데도 쓰임.
s2_inventory        = 3

# yaml 파일명을 인벤토리 소스의 어느 필드에 저장할지 지정하는 필드명.
# 기본값은 AWX의 표준 필드인 source_path(= "Sourced from a Project"일 때의 인벤토리 파일 경로).
# 실제 AWX 웹 UI에서 인벤토리 소스 편집 화면을 열어 "인벤토리 파일"에 해당하는 항목이
# source_path가 맞는지 먼저 확인할 것. 다르면 그 필드명으로 교체.
# 확인 방법: AWX 웹 UI에서 해당 소스를 열고 브라우저 개발자도구(F12) > Network 탭에서
# PATCH 요청의 payload 키 이름을 보거나, API 문서(/api/v2/inventory_sources/{id}/)를 확인.
s2_source_field     = source_path

# ── [S3] DHCP ──────────────────────────────────────────
s3_template        = dhcp-register
s3_infra_key       = infra_type
s3_infra_choices   = seoul, daejeon, busan
s3_extra_vars      =               # 템플릿에 -infra(s3_infra_key) 외 다른 필수 survey 항목이 있을 때:
                                    # "key=value, key2=value2" 형태로 채우면 launch 시 같이 전달됨

# ── [S4] PXE ───────────────────────────────────────────
s4_template         = pxe-register
s4_infra_key        = pxe_infra
s4_infra_choices    = seoul, daejeon, busan   # 비우면 자유 입력을 받음 (선택 사항)
s4_osver_key        = os_version
s4_osver_choices    = rhel-8.8, rocky-9.2     # 선택 사항
s4_bootmode_key     = boot_mode
s4_bootmode_choices = legacy, uefi            # 선택 사항
s4_splunk_key       = install_splunk
s4_splunk_choices   = On-premise, Cloud, no   # 선택 사항 (-splunk On-premise|Cloud|no)
s4_inventory        = 3                       # 완료 후 "총 N대 등록 완료" 집계할 인벤토리 ID
s4_extra_vars       =                         # 템플릿에 위 4개(infra/os/boot/splunk) 외 다른 필수 survey
                                               # 항목이 있을 때: "key=value, key2=value2" 형태로 채움

# ── 공통 동작 ──────────────────────────────────────────
poll_interval  = 3
history_file   = ./awxkit_history.log
