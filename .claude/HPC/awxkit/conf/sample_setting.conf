# awxkit 설정 파일 샘플
# 실제 사용 시 conf/${user}_setting.conf 로 복사해 값을 채우세요.
# 예: 사용자 식별자가 hong 이면 conf/hong_setting.conf

# ── AWX 접속 (여기만 채우면 doctor 까지 동작) ──────────────
awx_url        = http://10.20.30.40
username       = admin
password       = changeme
insecure_tls   = true

# ── [S1] NodeInfo ──────────────────────────────────────
s1_template        = nodeinfo
s1_hostname_key    = target_host
s1_fetch           = artifacts
s1_remote_path     =
s1_output_dir      = ./output

# ── [S2] 인벤토리 동기화 ────────────────────────────────
s2_inventory_source = 5
s2_inventory        = 3

# ── [S3] DHCP ──────────────────────────────────────────
s3_template        = dhcp-register
s3_infra_key       = infra_type
s3_infra_choices   = seoul, daejeon, busan

# ── [S4] PXE ───────────────────────────────────────────
s4_template        = pxe-register
s4_infra_key       = pxe_infra
s4_osver_key       = os_version
s4_bootmode_key    = boot_mode
s4_splunk_key      = install_splunk
s4_inventory       = 3

# ── 공통 동작 ──────────────────────────────────────────
poll_interval  = 3
history_file   = ./awxkit_history.log
