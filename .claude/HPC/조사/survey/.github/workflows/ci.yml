name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/HPC/조사/survey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      # 표준 라이브러리만 사용하므로 의존성 다운로드가 없다.
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
