# 자산 조사 스크립트 설정 (샘플)
# 경로/값은 환경에 맞게 수정하십시오.

[input]
asset_file = "/root/HPC/조사/asset_list.txt"   # 표1 텍스트 경로. 탭(\t) 구분: 자산ID<TAB>hostname<TAB>상태<TAB>위치

[gossh]
bin         = "/usr/local/bin/gossh"
concurrency = 4000                             # gossh 동시 실행 수 (-c). 설정값(appl) 조사에만 적용
timeout       = 10                             # gossh 타임아웃 초 (-t). 지우면 gossh 기본값 사용
retry_timeout = 30                             # 재조사(DNS 미등록/타임아웃, VM 제외) 시 쓸 긴 타임아웃 초
extra_args    = ""                             # 필요 시 추가 플래그

[scripts]
# 설정값(appl) 조사: gossh -c <concurrency> -w <hosts> -script "<이 값>" 으로 원격 실행
config_value = "cat /etc/auto.appl | grep -v '#' | grep -w '/appl'"
# 인프라망 조사: gossh -w <hosts> -script "bash <이 값>" 으로 원격 실행
#   -> 조사 대상 호스트에 배포된 스크립트 경로(또는 명령). 각 호스트에서 로컬 실행됨
infra_net    = "/usr/local/bin/infra_survey.sh"
# gossh 출력 "hostname: 출력값" 에서 '출력값' 에 적용하는 정규식 (캡처 그룹 1).
# 비우면 출력값 그대로 사용. 매칭 안 되면 아래 fallback 으로 재조사. \s 는 공백/탭 모두 매칭.
# 출력이 여러 줄이면 각 줄에 적용해 처음 매칭되는 줄만 쓴다.
#   "INFO ldap infra site match"        -> "infra"
#   "FAIL ldap_site" + "INFO ldap infra" -> "infra"  (FAIL 줄은 무시)
#   "FAIL LDAP 확인필요"                 -> 매칭 실패 -> fallback
infra_regex  = '^INFO\s+\S+\s+(\S+)'

# infra_regex 매칭 실패 시 재조사할 gossh 커맨드 (비우면 재조사 안 함)
infra_fallback_cmd   = "cat /etc/openldap/ldap.conf | grep -i binddn"
# 재조사(binddn) 출력에서 값 추출용 정규식 (캡처 그룹 1). 비우면 첫 줄 전체.
#   binddn 의 uid= 값을 뽑는다.
#   예: "binddn uid=svc_ldap,ou=People,dc=corp" -> "svc_ldap"
#   주: uid= 가 없는 binddn(예: cn=Manager,ou=SDC,...)은 매칭 실패 -> binddn 원본 줄이
#       인프라망에 기록됨(SDC 파일 분리 안 됨). ou 기반 SDC 판별이 필요하면
#       'ou=([^,\s]+)' 로 바꾸거나 알려주세요.
infra_fallback_regex = 'uid=([^,\s]+)'

# 설정값 mountpoint 이름별 "정상 위치".
#   설정값 "nas-a:/appl2/appl2" 에서 ':' 앞부분(nas-a)을 name 과 대조하고,
#   매칭된 location 이 표1의 위치와 같으면 O, 다르면 X.
[[mountpoint]]
name     = "nas-a"
location = "A센터"

[[mountpoint]]
name     = "nas-b"
location = "B센터"

[[mountpoint]]
name     = "nas-dr"
location = "DR"

# ============================================================================
# 아래 두 섹션은 run_survey.sh 만 사용한다. survey 바이너리는 무시한다.
# (없어도 동작한다: 필터 없이 asset_file 그대로 사용, A 서버 재조사 생략)
# ============================================================================

[asset_filter]
# 원본 표1 경로. run_survey.sh 가 include/exclude 로 걸러 위 [input].asset_file 을 만든다.
# 비우면 필터링을 건너뛰고 [input].asset_file 을 그대로 쓴다.
source  = "/root/HPC/조사/asset_list.txt"
# egrep(-E) 패턴. OR 은 '|'. 특수문자가 있으면 따옴표로 감쌀 것.
#   include: 이 패턴에 매칭되는 줄만 남긴다 (비우면 전체)
#   exclude: 이 패턴에 매칭되는 줄을 뺀다 (비우면 제외 없음)
include = ""
exclude = ""

[server_a]
# B 서버에서 '타임아웃'/'접속불가' 로 나온 호스트만 A 서버에서 1회 재조사한다.
# (DNS 미등록은 제외 — 재조사해도 의미 없음)
enabled    = false
host       = "a-server"
user       = "autofs"
# A 서버에서 survey 바이너리(RHEL6 정적 빌드)와 conf/ 가 있는 디렉토리. 여기서 실행된다.
dir        = "/app/autofs/조사"
# 재조사 대상 목록을 B→A 로 올려둘 경로.
# A 서버 conf 의 [input].asset_file 과 반드시 같아야 한다.
asset_file = "/app/autofs/조사/asset_list.txt"
