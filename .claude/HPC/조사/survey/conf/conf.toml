# 자산 조사 스크립트 설정 (샘플)
# 경로/값은 환경에 맞게 수정하십시오.

[input]
asset_file = "/root/HPC/조사/asset_list.txt"   # 표1 텍스트 경로. 탭(\t) 구분: 자산ID<TAB>hostname<TAB>상태<TAB>위치

[gossh]
bin         = "/usr/local/bin/gossh"
concurrency = 4000                             # gossh 동시 실행 수 (-c). 설정값(appl) 조사에만 적용
timeout     = 10                               # gossh 타임아웃 초 (-t). 지우면 gossh 기본값 사용
extra_args  = ""                               # 필요 시 추가 플래그

[scripts]
# 설정값(appl) 조사: gossh -c <concurrency> -w <hosts> -script "<이 값>" 으로 원격 실행
config_value = "cat /etc/auto.appl | grep -v '#' | grep -w '/appl'"
# 인프라망 조사: gossh -w <hosts> -script "bash <이 값>" 으로 원격 실행
#   -> 조사 대상 호스트에 배포된 스크립트 경로(또는 명령). 각 호스트에서 로컬 실행됨
infra_net    = "/usr/local/bin/infra_survey.sh"
# gossh 출력 "hostname: 출력값" 에서 '출력값' 에 적용하는 정규식 (캡처 그룹 1).
# 비우면 출력값 그대로 사용. 매칭 안 되면 아래 fallback 으로 재조사. \s 는 공백/탭 모두 매칭.
# 출력이 여러 줄이면 각 줄에 적용해 처음 매칭되는 줄만 쓴다.
#   "INFO ldap infra site match"        -> "infra"
#   "FAIL ldap_site" + "INFO ldap infra" -> "infra"  (FAIL 줄은 무시)
#   "FAIL LDAP 확인필요"                 -> 매칭 실패 -> fallback
infra_regex  = '^INFO\s+\S+\s+(\S+)'

# infra_regex 매칭 실패 시 재조사할 gossh 커맨드 (비우면 재조사 안 함)
infra_fallback_cmd   = "cat /etc/openldap/ldap.conf | grep -i binddn"
# 재조사 출력에서 값 추출용 정규식 (캡처 그룹 1). 비우면 첫 줄 전체.
#   예: binddn 값에 "ou=SDC" 가 있으면  'ou=([^,\s]+)'  로 "SDC" 추출
infra_fallback_regex = 'ou=([^,[:space:]]+)'

# 설정값 mountpoint 이름별 "정상 위치".
#   설정값 "nas-a:/appl2/appl2" 에서 ':' 앞부분(nas-a)을 name 과 대조하고,
#   매칭된 location 이 표1의 위치와 같으면 O, 다르면 X.
[[mountpoint]]
name     = "nas-a"
location = "A센터"

[[mountpoint]]
name     = "nas-b"
location = "B센터"

[[mountpoint]]
name     = "nas-dr"
location = "DR"
