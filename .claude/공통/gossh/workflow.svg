<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 2570" width="1100" height="2570" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="gossh 흐름도">
  <defs>
    <style>
      :root { --bg:#ffffff; --tx:#222222; --mute:#555555; --bx:#e8f4ff; --bxs:#0066cc; --dc:#fff3e0; --dcs:#c25e00; --ld:#f3e8ff; --lds:#7b3fb0; --sc:#e6f6ea; --scs:#1f7a3a; --ex:#f4f4f4; --exs:#777777; --ln:#444444; --bd:#eef0f5; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1e1e1e; --tx:#ececec; --mute:#b5b5b5; --bx:#22344a; --bxs:#5aa9ff; --dc:#40331f; --dcs:#ffb455; --ld:#35264a; --lds:#c79cff; --sc:#1f3a28; --scs:#6fd08c; --ex:#2c2c2c; --exs:#999999; --ln:#cccccc; --bd:#2a2d36; }
      }
      .bg { fill: var(--bg); }
      .band { fill: var(--bd); }
      .t { font-family: "Malgun Gothic","Noto Sans CJK KR",sans-serif; font-size: 12px; fill: var(--tx); }
      .ttl { font-size: 22px; font-weight: bold; }
      .tm { fill: var(--mute); font-size: 11px; }
      .bt { font-size: 16px; font-weight: bold; }
      .h { font-size: 15.5px; font-weight: bold; text-anchor: middle; }
      .b { font-size: 13.5px; text-anchor: middle; }
      .s { font-size: 11.5px; fill: var(--mute); text-anchor: middle; }
      .nl { font-size: 12.5px; fill: var(--mute); text-anchor: middle; }
      .nlr { font-size: 12.5px; fill: var(--mute); text-anchor: end; }
      .box { fill: var(--bx); stroke: var(--bxs); stroke-width: 1.5; }
      .dec { fill: var(--dc); stroke: var(--dcs); stroke-width: 1.5; }
      .ldap { fill: var(--ld); stroke: var(--lds); stroke-width: 1.5; }
      .sec { fill: var(--sc); stroke: var(--scs); stroke-width: 1.5; }
      .ext { fill: var(--ex); stroke: var(--exs); stroke-width: 1.5; }
      .dsh { stroke-dasharray: 5 4; }
      .ln { stroke: var(--ln); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .tie { stroke: var(--exs); stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .ahf { fill: var(--ln); }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" class="ahf"/></marker>
  </defs>
  <rect width="1100" height="2570" class="bg"/>
  <text class="t ttl" x="550" y="38" text-anchor="middle">gossh — 한눈에 보는 흐름</text>
  <text class="t tm" x="550" y="62" text-anchor="middle">gossh -w 호스트목록 [옵션] '명령' : 많은 서버에 같은 명령을 동시에 실행합니다. 주황색은 판정·확인·입력이 일어나는 곳입니다.</text>
  <rect class="band" x="20" y="84" width="1060" height="34" rx="6"/>
  <text class="t bt" x="36" y="107">1단계 · 준비 — 옵션을 읽고 이전 결과 정리</text>
  <text class="t nlr" x="1064" y="106">main.go main() · preprocessArgs</text>
  <rect class="ext" x="270" y="134" width="560" height="55" rx="10"/>
  <text class="t h" x="550.0" y="156">시작 : gossh -w hosts|범위식 [옵션] '명령'</text>
  <text class="t b" x="550.0" y="175">-w 에는 파일 이름 또는 node[01-05] 같은 범위식을 줄 수 있음</text>
  <path class="tie" d="M270 161.5 H252"/>
  <rect class="ext dsh" x="20" y="123.5" width="232" height="76" rx="8"/>
  <text class="t nl" x="136.0" y="145.5">실행 파일 이름이 pdsh 면</text>
  <text class="t nl" x="136.0" y="165.5">진행률·안내 메시지를</text>
  <text class="t nl" x="136.0" y="185.5">찍지 않음 (isPdshName)</text>
  <path class="ln" d="M550.0 189 V215"/>
  <rect class="box" x="270" y="215" width="560" height="74" rx="10"/>
  <text class="t h" x="550.0" y="237">옵션 해석 · 필수 값 검사</text>
  <text class="t b" x="550.0" y="256">preprocessArgs 로 인자 정리 → flag 파싱, -w 의 ^ 접두 제거</text>
  <text class="t b" x="550.0" y="275">-w 없음 · 명령 없음 · 특수옵션과 명령 동시 지정 → 사용법, 종료코드 1</text>
  <path class="tie" d="M830 252.0 H848"/>
  <rect class="ext dsh" x="848" y="214.0" width="232" height="76" rx="8"/>
  <text class="t nl" x="964.0" y="236.0">특수 옵션</text>
  <text class="t nl" x="964.0" y="256.0">-tmp -limit -tl : 임시파일·limits</text>
  <text class="t nl" x="964.0" y="276.0">-rpm : rpm 패키지 비교</text>
  <path class="ln" d="M550.0 289 V315"/>
  <rect class="sec" x="270" y="315" width="560" height="97" rx="10"/>
  <text class="t h" x="550.0" y="337">이전 결과 파일 삭제 (이름이 완전히 같은 것만)</text>
  <text class="t b" x="550.0" y="356">_res_off · _res_refsed · _os_install · _nosvrauto · _res_cancel</text>
  <text class="t b" x="550.0" y="375">-rpm 이면 _rpm_report.txt · _rpm_tab.txt · _rpm_diff 도 삭제</text>
  <text class="t s" x="550.0" y="394">와일드카드 없이 정확한 이름만 os.Remove — 옛 결과가 이번 결과와 섞이지 않게</text>
  <rect class="band" x="20" y="438" width="1060" height="34" rx="6"/>
  <text class="t bt" x="36" y="461">2단계 · 판정 — 병렬 수 제한이 필요한지, 위험한 명령인지 확인</text>
  <text class="t nlr" x="1064" y="460">danger.go isDangerousCommand · isAutofsUserPath</text>
  <rect class="dec" x="270" y="488" width="560" height="74" rx="10"/>
  <text class="t h" x="550.0" y="510">명령에 "/user/" 경로가 있나? (autofs)</text>
  <text class="t b" x="550.0" y="529">있으면 병렬 수를 450 으로 자동 제한 (autofsSafeConcurrency)</text>
  <text class="t b" x="550.0" y="548">-cf &lt;숫자&gt; 를 주면 제한을 무시하고 지정값 사용</text>
  <path class="tie" d="M830 525.0 H848"/>
  <rect class="ext dsh" x="848" y="497.0" width="232" height="56" rx="8"/>
  <text class="t nl" x="964.0" y="519.0">제한 안내를 stderr 에 출력</text>
  <text class="t nl" x="964.0" y="539.0">(pdsh 이름이면 생략)</text>
  <path class="ln" d="M550.0 562 V588"/>
  <rect class="dec" x="270" y="588" width="560" height="93" rx="10"/>
  <text class="t h" x="550.0" y="610">위험어 판정</text>
  <text class="t b" x="550.0" y="629">기존 7개 : reboot poweroff shutdown halt "init 0" "init 6" ddc → 부분일치</text>
  <text class="t b" x="550.0" y="648">새 위험어(mkfs, ifdown 등) → 독립된 명령 단어일 때만 (호스트명 오탐 방지)</text>
  <text class="t b" x="550.0" y="667">플래그 -dnlgjawkrdjqghkrdls 가 없으면 여기서 거부</text>
  <path class="ln" d="M830 634.5 H848"/>
  <rect class="ext dsh" x="848" y="586.5" width="232" height="96" rx="8"/>
  <text class="t nl" x="964.0" y="608.5">[플래그 없음]</text>
  <text class="t nl" x="964.0" y="628.5">위험어 감지 + 플래그 없음</text>
  <text class="t nl" x="964.0" y="648.5">→ 경고와 사용 예시 출력</text>
  <text class="t nl" x="964.0" y="668.5">종료코드 1 (실행 안 함)</text>
  <path class="ln" d="M550.0 681 V707"/>
  <rect class="box" x="270" y="707" width="560" height="74" rx="10"/>
  <text class="t h" x="550.0" y="729">호스트 목록 만들기</text>
  <text class="t b" x="550.0" y="748">호스트 파일을 줄마다 읽음 (# 주석 제외, 공백·쉼표로 분리)</text>
  <text class="t b" x="550.0" y="767">토큰마다 expandHostLine 으로 범위식 확장 → 중복 제거</text>
  <path class="ln" d="M830 744.0 H848"/>
  <rect class="ext dsh" x="848" y="706.0" width="232" height="76" rx="8"/>
  <text class="t nl" x="964.0" y="728.0">[0대]</text>
  <text class="t nl" x="964.0" y="748.0">목록이 비었으면</text>
  <text class="t nl" x="964.0" y="768.0">경고만 출력하고 종료코드 0</text>
  <rect class="band" x="20" y="807" width="1060" height="34" rx="6"/>
  <text class="t bt" x="36" y="830">3단계 · 확인 — 위험 작업 플래그가 있을 때만 (사람이 한 번 더 확인)</text>
  <text class="t nlr" x="1064" y="829">danger.go parseConfirmHosts · diffHostSets</text>
  <rect class="box" x="270" y="857" width="560" height="74" rx="10"/>
  <text class="t h" x="550.0" y="879">실행 명령과 대상 호스트 목록(총 N대) 출력</text>
  <text class="t b" x="550.0" y="898">플래그가 있으면 위험어 여부와 관계없이 이 단계로 들어옴</text>
  <text class="t b" x="550.0" y="917">"작업대상이 맞는지 다시 확인하세요" 경고 문구</text>
  <path class="tie" d="M270 894.0 H252"/>
  <rect class="ext dsh" x="20" y="866.0" width="232" height="56" rx="8"/>
  <text class="t nl" x="136.0" y="888.0">플래그가 없으면</text>
  <text class="t nl" x="136.0" y="908.0">3단계는 통째로 건너뜀</text>
  <path class="ln" d="M550.0 931 V957"/>
  <rect class="dec" x="270" y="957" width="560" height="93" rx="10"/>
  <text class="t h" x="550.0" y="979">⌨ 대상 호스트 재입력 대조</text>
  <text class="t b" x="550.0" y="998">대상 호스트를 직접 다시 입력 (공백·쉼표·| 구분, 빈 줄로 입력 끝)</text>
  <text class="t b" x="550.0" y="1017">범위식은 -w 와 같은 규칙으로 펼쳐서 비교 — 순서·중복은 무시</text>
  <text class="t b" x="550.0" y="1036">완전히 같을 때만 다음 단계</text>
  <path class="ln" d="M830 1003.5 H848"/>
  <rect class="ext dsh" x="848" y="955.5" width="232" height="96" rx="8"/>
  <text class="t nl" x="964.0" y="977.5">[불일치]</text>
  <text class="t nl" x="964.0" y="997.5">빈 입력이거나 하나라도 다르면</text>
  <text class="t nl" x="964.0" y="1017.5">입력에만 / 대상에만 있는 호스트를</text>
  <text class="t nl" x="964.0" y="1037.5">보여주고 즉시 취소, 종료코드 1</text>
  <path class="ln" d="M550.0 1050 V1076"/>
  <rect class="dec" x="270" y="1076" width="560" height="55" rx="10"/>
  <text class="t h" x="550.0" y="1098">⌨ 정말 실행할까요? (y/N)</text>
  <text class="t b" x="550.0" y="1117">y 또는 yes 만 통과 (그 밖의 입력은 모두 아니오)</text>
  <path class="ln" d="M830 1103.5 H848"/>
  <rect class="ext dsh" x="848" y="1065.5" width="232" height="76" rx="8"/>
  <text class="t nl" x="964.0" y="1087.5">[N]</text>
  <text class="t nl" x="964.0" y="1107.5">"작업이 취소되었습니다."</text>
  <text class="t nl" x="964.0" y="1127.5">종료코드 0</text>
  <rect class="band" x="20" y="1157" width="1060" height="34" rx="6"/>
  <text class="t bt" x="36" y="1180">4단계 · 실행 — 호스트마다 동시에 접속해 명령 실행</text>
  <text class="t nlr" x="1064" y="1179">main.go runSSHCommand · tmplimit.go · rpmcmp.go</text>
  <rect class="dec" x="270" y="1207" width="560" height="97" rx="10"/>
  <text class="t h" x="550.0" y="1229">특수 옵션이면 실행할 명령을 질문으로 만듦</text>
  <text class="t b" x="550.0" y="1248">-tmp / -limit / -tl : 삭제 여부·기준 호스트를 묻고 스크립트 생성</text>
  <text class="t b" x="550.0" y="1267">-rpm : 비교서버를 묻고 기준 rpm 목록을 가져옴</text>
  <text class="t s" x="550.0" y="1286">planSpecial (tmplimit.go) · planRPM (rpmcmp.go) — 질문은 promptLine 으로 받음</text>
  <path class="tie" d="M270 1255.5 H252"/>
  <rect class="ext dsh" x="20" y="1227.5" width="232" height="56" rx="8"/>
  <text class="t nl" x="136.0" y="1249.5">질문은 stdin 에서 받으므로</text>
  <text class="t nl" x="136.0" y="1269.5">파이프 입력으로도 진행 가능</text>
  <path class="ln" d="M550.0 1304 V1330"/>
  <rect class="box" x="270" y="1330" width="560" height="97" rx="10"/>
  <text class="t h" x="550.0" y="1352">워커풀 시작</text>
  <text class="t b" x="550.0" y="1371">sem 채널 크기 = 동시성 (-c, autofs 면 450, -cf 면 지정값)</text>
  <text class="t b" x="550.0" y="1390">호스트마다 goroutine 으로 runSSHCommand 실행</text>
  <text class="t s" x="550.0" y="1409">-pm 이면 OS 설치중·svrauto 접근 점검도 함께 (runPmCheck)</text>
  <path class="ln" d="M550.0 1427 V1453"/>
  <rect class="ldap" x="270" y="1453" width="560" height="74" rx="10"/>
  <text class="t h" x="550.0" y="1475">DNS 선행 조회</text>
  <text class="t b" x="550.0" y="1494">lookupHostWithRetry — 순수 Go 리졸버, 동시 50개 (dnsLookupConcurrency)</text>
  <text class="t b" x="550.0" y="1513">실패하면 짧게 최대 2회 재시도 → 그래도 안 되면 접속불가</text>
  <path class="ln" d="M830 1490.0 H848"/>
  <rect class="ext dsh" x="848" y="1452.0" width="232" height="76" rx="8"/>
  <text class="t nl" x="964.0" y="1474.0">[실패]</text>
  <text class="t nl" x="964.0" y="1494.0">DNS 가 안 되면 접속 시도 없이</text>
  <text class="t nl" x="964.0" y="1514.0">접속불가(_res_off) 로 분류</text>
  <path class="ln" d="M550.0 1527 V1553"/>
  <rect class="ldap" x="270" y="1553" width="560" height="74" rx="10"/>
  <text class="t h" x="550.0" y="1575">SSH 접속</text>
  <text class="t b" x="550.0" y="1594">getAuthMethods — 키 우선 인증, 필요하면 비밀번호</text>
  <text class="t b" x="550.0" y="1613">-t 초 안에 접속 못 하면 접속불가, 연결 거부는 _res_refsed</text>
  <path class="tie" d="M830 1590.0 H848"/>
  <rect class="ext dsh" x="848" y="1542.0" width="232" height="96" rx="8"/>
  <text class="t nl" x="964.0" y="1564.0">Ctrl+C 처리 (참고)</text>
  <text class="t nl" x="964.0" y="1584.0">1·2·3회 누를 때마다 단계적 중단</text>
  <text class="t nl" x="964.0" y="1604.0">startInterruptHandler</text>
  <text class="t nl" x="964.0" y="1624.0">abortAll · 취소는 _res_cancel</text>
  <path class="ln" d="M550.0 1627 V1653"/>
  <rect class="ldap" x="270" y="1653" width="560" height="97" rx="10"/>
  <text class="t h" x="550.0" y="1675">원격 명령 실행 → stdout / stderr 분리</text>
  <text class="t b" x="550.0" y="1694">표준출력과 표준에러를 따로 모으고 이스케이프 코드 제거 (stripANSI)</text>
  <text class="t b" x="550.0" y="1713">결과는 호스트: 줄 형식으로 정리 (renderResultLines)</text>
  <text class="t s" x="550.0" y="1732">printCommandResult — 즉시 출력, -b / -rpm 이면 bunchOutputs 에 모아 둠</text>
  <path class="ln" d="M550.0 1750 V1776"/>
  <rect class="box" x="270" y="1776" width="560" height="97" rx="10"/>
  <text class="t h" x="550.0" y="1798">진행률 실시간 표시</text>
  <text class="t b" x="550.0" y="1817">완료 수 / 전체를 1초마다 stderr 에 갱신 (drawProgressLocked)</text>
  <text class="t b" x="550.0" y="1836">-m : Enter 로 오래 걸리는 호스트 목록 보기 (renderHangListLocked)</text>
  <text class="t s" x="550.0" y="1855">터미널일 때만 · pdsh 이름이면 생략 (-m 은 예외)</text>
  <rect class="band" x="20" y="1899" width="1060" height="34" rx="6"/>
  <text class="t bt" x="36" y="1922">5단계 · 재검증과 결과 — 접속불가 다시 확인, 출력, 결과 파일</text>
  <text class="t nlr" x="1064" y="1921">main.go main()</text>
  <rect class="dec" x="270" y="1949" width="560" height="55" rx="10"/>
  <text class="t h" x="550.0" y="1971">1차에서 접속불가·거부된 호스트가 있나?</text>
  <text class="t b" x="550.0" y="1990">대량 실행 중 DNS·접속 혼잡으로 잘못 분류된 호스트를 걸러내기 위함</text>
  <path class="ln" d="M830 1976.5 H848"/>
  <rect class="ext dsh" x="848" y="1948.5" width="232" height="56" rx="8"/>
  <text class="t nl" x="964.0" y="1970.5">[없음]</text>
  <text class="t nl" x="964.0" y="1990.5">없으면 재검증을 건너뜀</text>
  <path class="ln" d="M550.0 2004 V2030"/>
  <rect class="box" x="270" y="2030" width="560" height="97" rx="10"/>
  <text class="t h" x="550.0" y="2052">재검증 — 낮은 동시성으로 다시 실행</text>
  <text class="t b" x="550.0" y="2071">동시성 50 이하, 로그인 제한시간 8초 (retryConnectTimeout)</text>
  <text class="t b" x="550.0" y="2090">접속되면 명령까지 다시 실행 → "재검증 결과: N대" 안내</text>
