<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
<title>AWX nodeinfo 프로세스 개선 (기존 vs 변경후)</title>
<defs>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="arr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"/></marker>
</defs>
<rect width="1500" height="900" fill="#fff"/>
<text x="750.0" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#222">AWX nodeinfo 배포 프로세스 개선 (01.AWX_nodeinfo_V2.sh)</text>
<rect x="40" y="58" width="22" height="16" fill="#fff3a0" stroke="#e8a900" stroke-width="2.5"/>
<text x="70" y="71" font-size="14" fill="#444">= 변경/신규 부분 (하이라이트)</text>

<text x="40" y="110" font-size="20" font-weight="bold" fill="#444">1. 기존 (dhcp 등록 → PXE 수동실행 → dd 를 yaml마다 반복)</text>
<rect x="40" y="125" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="110.0" y="166.0" font-size="13" text-anchor="middle" fill="#222">bash 01.AWX_</text>
<text x="110.0" y="184.0" font-size="13" text-anchor="middle" fill="#222">nodeinfo_V2.sh</text>
<rect x="200" y="125" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="270.0" y="175.0" font-size="13" text-anchor="middle" fill="#222">user 선택</text>
<line x1="180" y1="170" x2="200" y2="170" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="360" y="125" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="430.0" y="157.0" font-size="13" text-anchor="middle" fill="#222">nodeinfo 실행여부</text>
<text x="430.0" y="175.0" font-size="13" text-anchor="middle" fill="#222">y: 템플릿 실행</text>
<text x="430.0" y="193.0" font-size="13" text-anchor="middle" fill="#222">n: user.txt 양식</text>
<line x1="340" y1="170" x2="360" y2="170" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="520" y="125" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="590.0" y="166.0" font-size="13" text-anchor="middle" fill="#222">생성된 yaml</text>
<text x="590.0" y="184.0" font-size="13" text-anchor="middle" fill="#222">git 업로드</text>
<line x1="500" y1="170" x2="520" y2="170" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="680" y="125" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="750.0" y="175.0" font-size="13" text-anchor="middle" fill="#222">yaml 확인단계</text>
<line x1="660" y1="170" x2="680" y2="170" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="840" y="125" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="910.0" y="166.0" font-size="13" text-anchor="middle" fill="#222">su시 awx yaml</text>
<text x="910.0" y="184.0" font-size="13" text-anchor="middle" fill="#222">소스 dhcp 등록</text>
<line x1="820" y1="170" x2="840" y2="170" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1000" y="125" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="1070.0" y="166.0" font-size="13" text-anchor="middle" fill="#222">pxe는 AWX에서</text>
<text x="1070.0" y="184.0" font-size="13" text-anchor="middle" fill="#222">직접 실행</text>
<line x1="980" y1="170" x2="1000" y2="170" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1160" y="125" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="1230.0" y="175.0" font-size="13" text-anchor="middle" fill="#222">dd 작업</text>
<line x1="1140" y1="170" x2="1160" y2="170" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1320" y="125" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="1390.0" y="175.0" font-size="13" text-anchor="middle" fill="#222">작업완료</text>
<line x1="1300" y1="170" x2="1320" y2="170" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<path d="M1230,215 L1230,255 L910,255 L910,217" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="1070.0" y="275" font-size="13" text-anchor="middle" fill="#c0392b">yaml이 더 있으면 반복 (yaml 1개당 약 1분 + 수동 단계)</text>
<text x="40" y="340" font-size="20" font-weight="bold" fill="#444">2. 변경후 (dhcp·PXE 동시 등록 → 전체 리스트 일괄 등록 → dd 템플릿 한 번에)</text>
<rect x="40" y="355" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="110.0" y="396.0" font-size="13" text-anchor="middle" fill="#222">bash 01.AWX_</text>
<text x="110.0" y="414.0" font-size="13" text-anchor="middle" fill="#222">nodeinfo_V2.sh</text>
<rect x="200" y="355" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="270.0" y="405.0" font-size="13" text-anchor="middle" fill="#222">user 선택</text>
<line x1="180" y1="400" x2="200" y2="400" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="360" y="355" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="430.0" y="387.0" font-size="13" text-anchor="middle" fill="#222">nodeinfo 실행여부</text>
<text x="430.0" y="405.0" font-size="13" text-anchor="middle" fill="#222">y: 템플릿 실행</text>
<text x="430.0" y="423.0" font-size="13" text-anchor="middle" fill="#222">n: user.txt 양식</text>
<line x1="340" y1="400" x2="360" y2="400" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="520" y="355" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="590.0" y="396.0" font-size="13" text-anchor="middle" fill="#222">생성된 yaml</text>
<text x="590.0" y="414.0" font-size="13" text-anchor="middle" fill="#222">git 업로드</text>
<line x1="500" y1="400" x2="520" y2="400" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="680" y="355" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="750.0" y="405.0" font-size="13" text-anchor="middle" fill="#222">yaml 확인단계</text>
<line x1="660" y1="400" x2="680" y2="400" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="840" y="355" width="140" height="90" rx="8" fill="#fff3a0" stroke="#e8a900" stroke-width="3"/>
<text x="910.0" y="378.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">su시 awx yaml 소스</text>
<text x="910.0" y="396.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">dhcp, pxe 동시 등록</text>
<text x="910.0" y="414.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">(yaml 수만큼</text>
<text x="910.0" y="432.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">자동반복)</text>
<line x1="820" y1="400" x2="840" y2="400" stroke="#d93025" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1000" y="355" width="140" height="90" rx="8" fill="#fff3a0" stroke="#e8a900" stroke-width="3"/>
<text x="1070.0" y="387.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">완료시 작업</text>
<text x="1070.0" y="405.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">전체리스트가</text>
<text x="1070.0" y="423.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">한번에 등록</text>
<line x1="980" y1="400" x2="1000" y2="400" stroke="#d93025" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1160" y="355" width="140" height="90" rx="8" fill="#fff3a0" stroke="#e8a900" stroke-width="3"/>
<text x="1230.0" y="405.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">dd 템플릿 수행</text>
<line x1="1140" y1="400" x2="1160" y2="400" stroke="#d93025" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1320" y="355" width="140" height="90" rx="8" fill="#eef2f7" stroke="#8a99ad" stroke-width="1.5"/>
<text x="1390.0" y="405.0" font-size="13" text-anchor="middle" fill="#222">작업완료</text>
<line x1="1300" y1="400" x2="1320" y2="400" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<path d="M945,355 C945,330 875,330 875,353" fill="none" stroke="#d93025" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="910" y="323" font-size="12" text-anchor="middle" fill="#d93025" font-weight="bold">yaml 수만큼 자동 반복 (1개당 ~1분)</text>
<rect x="840" y="455" width="460" height="48" rx="6" fill="#fff3a0" stroke="#e8a900" stroke-width="2"/>
<text x="1070.0" y="475" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">변경 포인트: ① PXE를 AWX 수동실행 → 스크립트가 dhcp와 동시 등록</text>
<text x="1070.0" y="493" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">② 건별 dd 반복 제거 → 전체 리스트 일괄 등록 후 dd 템플릿 1회 수행</text>
<text x="40" y="580" font-size="20" font-weight="bold" fill="#444">3. 여러 모델이 섞여 있을 경우 추천 OS 배포 프로세스 (신규)</text>
<rect x="40" y="600" width="260" height="100" rx="8" fill="#fff3a0" stroke="#e8a900" stroke-width="3"/>
<text x="170.0" y="637.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">AWX 스크립트</text>
<text x="170.0" y="655.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">먼저 실행</text>
<text x="170.0" y="673.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">(dhcp·pxe 일괄 등록)</text>
<rect x="360" y="600" width="260" height="100" rx="8" fill="#fff3a0" stroke="#e8a900" stroke-width="3"/>
<text x="490.0" y="637.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">상세목록현황</text>
<text x="490.0" y="655.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">기록</text>
<text x="490.0" y="673.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">(모델·호스트별 현황)</text>
<line x1="300" y1="650" x2="360" y2="650" stroke="#d93025" stroke-width="2" marker-end="url(#arr)"/>
<rect x="680" y="600" width="260" height="100" rx="8" fill="#fff3a0" stroke="#e8a900" stroke-width="3"/>
<text x="810.0" y="646.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">10분 대기</text>
<text x="810.0" y="664.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">(등록 반영/안정화)</text>
<line x1="620" y1="650" x2="680" y2="650" stroke="#d93025" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1000" y="600" width="260" height="100" rx="8" fill="#fff3a0" stroke="#e8a900" stroke-width="3"/>
<text x="1130.0" y="646.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">10분 뒤 OS 배포</text>
<text x="1130.0" y="664.0" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">진행 (dd 템플릿)</text>
<line x1="940" y1="650" x2="1000" y2="650" stroke="#d93025" stroke-width="2" marker-end="url(#arr)"/>
<text x="40" y="735" font-size="13" fill="#555">※ yaml 1개 등록에 약 1분 소요 — 예) yaml 30개 = 약 30분. 모델이 섞여 있어도 등록을 모두 마친 뒤 현황을 확인하고 배포하여 오배포를 방지.</text>
<rect x="40" y="765" width="1420" height="110" rx="8" fill="#f7f7f7" stroke="#ccc"/>
<text x="60" y="792" font-size="15" font-weight="bold" fill="#222">기존 → 변경 요약</text>
<text x="60" y="817" font-size="13" fill="#333">• dhcp 등록 + PXE: 분리(PXE 수동) → 동시 등록 (자동)</text>
<text x="60" y="839" font-size="13" fill="#333">• 반복 단위: yaml마다 dhcp→pxe→dd 반복 → 등록만 yaml 수만큼 자동반복, 완료 후 전체 리스트 일괄 등록</text>
<text x="60" y="861" font-size="13" fill="#333">• dd 작업: 건별 수행 → dd 템플릿 1회 수행 / 혼합 모델은 스크립트 선실행 → 현황 기록 → 10분 후 배포</text>
</svg>