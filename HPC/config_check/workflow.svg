<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1010" viewBox="0 0 760 1010" role="img" aria-label="config_check.sh 처리 흐름">
<rect width="760" height="1010" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
<style>
text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:13px;fill:#222}
.t{font-weight:bold;font-size:14px}
.s{font-size:11.5px;fill:#555}
.b{fill:#ecf1ff;stroke:#5b74c9;stroke-width:1.2}
.g{fill:#e9f7ec;stroke:#3f9a56;stroke-width:1.2}
.y{fill:#fff6dc;stroke:#c9962b;stroke-width:1.2}
.n{fill:#f1f1f1;stroke:#888;stroke-width:1.2}
.l{stroke:#444;stroke-width:1.3;fill:none;marker-end:url(#a)}
.lb{font-size:12px;fill:#333}
</style>
</defs>

<text x="380" y="24" text-anchor="middle" class="t" style="font-size:16px">config_check.sh 처리 흐름</text>

<rect class="n" x="230" y="40" width="300" height="46" rx="23"/>
<text x="380" y="60" text-anchor="middle" class="t">bash config_check.sh</text>
<text x="380" y="77" text-anchor="middle" class="s">(-auto &lt;user&gt; &lt;목록파일&gt; 이면 질문 없이 진행)</text>
<path class="l" d="M380,86 V108"/>

<rect class="b" x="190" y="108" width="380" height="48" rx="6"/>
<text x="380" y="128" text-anchor="middle" class="t">1. user 선택</text>
<text x="380" y="146" text-anchor="middle" class="s">info_mn.sh 목록 → 번호 입력 → info.sh 로 user 확정</text>
<path class="l" d="M380,156 V178"/>

<rect class="b" x="190" y="178" width="380" height="48" rx="6"/>
<text x="380" y="198" text-anchor="middle" class="t">2. 리스트 확인</text>
<text x="380" y="216" text-anchor="middle" class="s">${user}.txt 파싱·중복제거 → 30행 열 출력, prefix별 수량, 총 N EA</text>
<path class="l" d="M380,226 V250"/>

<polygon class="y" points="380,250 480,284 380,318 280,284"/>
<text x="380" y="281" text-anchor="middle" class="t">3. 작업 진행?</text>
<text x="380" y="298" text-anchor="middle" class="s">y / n</text>
<path class="l" d="M480,284 H600 V330"/>
<text x="540" y="278" text-anchor="middle" class="lb">n</text>
<rect class="n" x="560" y="330" width="80" height="30" rx="15"/>
<text x="600" y="350" text-anchor="middle">종료</text>
<path class="l" d="M380,318 V348"/>
<text x="392" y="338" class="lb">y</text>

<rect class="g" x="100" y="348" width="560" height="86" rx="6"/>
<text x="380" y="368" text-anchor="middle" class="t">4. OS 체크 (gossh 1회)</text>
<text x="380" y="386" text-anchor="middle" class="s">gossh -pm -script -w 목록 "bash run.sh pd; :"</text>
<text x="380" y="404" text-anchor="middle" class="s">상태 분류: OK / OFF(pingX) / REF(pingO_sshx) / NOSV(nosvrauto) / INST(os_install) / NONE</text>
<text x="380" y="422" text-anchor="middle" class="s">gossh 결과 파일(_res_off 등)을 awk 로 풀어 호스트별 상태 작성</text>
<path class="l" d="M380,434 V458"/>

<rect class="g" x="150" y="458" width="460" height="86" rx="6"/>
<text x="380" y="478" text-anchor="middle" class="t">체크 리포트 (OK 호스트 기준)</text>
<text x="380" y="496" text-anchor="middle" class="s">FAIL(없으면 NO FAIL) → LDAP 요약 → 상태줄(total/OK/…)</text>
<text x="380" y="514" text-anchor="middle" class="s">→ Splunk·LDAP·대수·OS 조합 → Splunk / OS 값 요약</text>
<text x="380" y="532" text-anchor="middle" class="s">20대 이상 값별 호스트는 check.info_${user} 파일로 저장</text>
<path class="l" d="M380,544 V572"/>

<polygon class="y" points="380,572 500,610 380,648 260,610"/>
<text x="380" y="606" text-anchor="middle" class="t">5. 환경설정 수정?</text>
<text x="380" y="623" text-anchor="middle" class="s">y / n / set</text>
<path class="l" d="M500,610 H680 V770 H610"/>
<text x="590" y="604" text-anchor="middle" class="lb">n</text>
<path class="l" d="M380,648 V672"/>
<text x="392" y="664" class="lb">y / set</text>

<rect class="g" x="150" y="672" width="460" height="86" rx="6"/>
<text x="380" y="692" text-anchor="middle" class="t">설정 적용 (OK 호스트만, gossh 1회)</text>
<text x="380" y="710" text-anchor="middle" class="s">y   : bash insert; bash appl</text>
<text x="380" y="726" text-anchor="middle" class="s">set : bash insert; bash appl; bash setting</text>
<text x="380" y="744" text-anchor="middle" class="s">→ OK 호스트 재체크 → 상태 병합 → 체크 리포트 재출력</text>
<path class="l" d="M380,758 V782"/>

<rect class="b" x="150" y="782" width="460" height="118" rx="6"/>
<text x="380" y="802" text-anchor="middle" class="t">6. 마무리 출력</text>
<text x="380" y="822" text-anchor="middle" class="s">AI GPU 서버 점검 → 벤더별 코멘트 → 전체 OK 공통 코멘트</text>
<text x="380" y="840" text-anchor="middle" class="s">→ DHCP 조회(ssh 1회) → 기타 상태 서버(REF/NOSV/INST/no_output)</text>
<text x="380" y="858" text-anchor="middle" class="s">→ usb0 disabled 필요 서버 → VWP 사용 VM(ev) 서버</text>
<text x="380" y="880" text-anchor="middle" class="s">-auto 이면 결과 리포트 블록 + 완료기록</text>
<path class="l" d="M380,900 V928"/>

<rect class="n" x="230" y="928" width="300" height="46" rx="23"/>
<text x="380" y="948" text-anchor="middle" class="t">종료</text>
<text x="380" y="965" text-anchor="middle" class="s">임시 디렉터리 삭제 · check.res_${user} 만 남김</text>

<text x="20" y="1000" class="s">초록 = gossh 실행 구간(Ctrl+C 는 gossh 가 처리)  /  노랑 = 운영자 입력  /  파랑 = 로컬 처리</text>
</svg>
