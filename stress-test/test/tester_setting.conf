# 랩 검증용 conf (가짜 AWX 127.0.0.1:18080). monitor_sec/interval 은 e2e.sh 가 덮어씀
awx_url = http://127.0.0.1:18080
username = admin
password = test
gossh = /usr/local/bin/gossh
repohost = root@192.168.0.58
repo_dir = /root/work/st-repo
svr_dir = /root/work/st-svr
git_dir = /root/work/st-git
inventory = 3
cpu_template = cpu-test
cpu_hostname_key = target_hosts
stress_template = stress-ng
stress_hostname_key = target_hosts
stress_extra_vars = foo=bar
stress_end_keys = end_year,end_month,end_day,end_hour,end_min
default_inventory = DEFAULT
monitor_sec = 60
monitor_interval = 5
load_threshold = 3
output_dir = ./output
poll_interval = 1
history_file = ./stress-test_history.log
